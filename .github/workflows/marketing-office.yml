name: Marketing office

on:
  push:
    paths:
      - "marketing/agent-office/**"
      - "src/exchange_info/university_registry.py"
      - ".github/workflows/marketing-office.yml"
  pull_request:
    paths:
      - "marketing/agent-office/**"
      - "src/exchange_info/university_registry.py"
      - ".github/workflows/marketing-office.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-office-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marketing/agent-office
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # ffmpeg comes with the imageio-ffmpeg package, and the runner image already has Chrome's libraries, so apt (whose
      # mirror has stalled this job twice) is only used if Chromium cannot start without it.
      - name: Install the office and Chromium
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv lock --check
          uv sync --frozen --extra dev
          uv run --frozen playwright install chromium
          uv run --frozen python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()" \
            || uv run --frozen playwright install-deps chromium

      - name: Run tests (offline writer, dry-run publishing, real renders)
        run: uv run --frozen pytest -q
