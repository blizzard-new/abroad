name: TLS trust regression
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: tls-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/
            !/data/
            !/sources/
            !/src/exchange_info/official_data/
            !/mobile_flutter/
      # This image only validates installed TLS artifacts; it is never published.
      - name: Build isolated image and check installed CA stores
        run: docker build --progress=plain -t uniway-tls-ci .
      - name: Verify image offline, without entrypoint or production volumes
        run: docker run --rm --network none --cpus 1 --memory 512m --entrypoint python uniway-tls-ci -m exchange_info.tls_audit --system
