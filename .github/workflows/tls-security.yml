name: TLS trust regression
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: tls-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/archive/
            !/data/
            !/sources/
            !/src/exchange_info/official_data/
            !/mobile_flutter/
            /src/exchange_info/official_data/**/*.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --use-deprecated=legacy-certs uv==0.13.5
          uv lock --check
          uv sync --frozen --extra dev --no-install-project
      - name: Audit the installed lockfile dependencies
        run: uv run --no-sync python -m pip_audit --local --progress-spinner off
      - name: Run offline TLS and deployment-package regressions
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m pytest tests/test_tls_security.py tests/test_http_client.py tests/test_selfhost_package.py tests/test_email_verification.py tests/test_content_summary.py tests/test_school_image_collector.py -q
      # This image only validates installed TLS artifacts; it is never published.
      - name: Build isolated image and check installed CA stores
        run: docker build --progress=plain -t uniway-tls-ci .
      - name: Verify image offline, without entrypoint or production volumes
        run: docker run --rm --network none --cpus 1 --memory 512m --entrypoint python uniway-tls-ci -m exchange_info.tls_audit --system
