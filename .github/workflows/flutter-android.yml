name: Flutter Android preview

on:
  pull_request:
    paths:
      - "mobile_flutter/**"
      - ".github/workflows/flutter-android.yml"
  push:
    branches: [main]
    paths:
      - "mobile_flutter/**"
      - ".github/workflows/flutter-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile_flutter
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile_flutter/android/**/*.gradle*
            mobile_flutter/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install pinned Flutter SDK (3.44.6)
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Widget and unit tests
        run: flutter test --no-pub

      - name: Build Android preview APK
        run: |
          flutter build apk --debug --dart-define=API_BASE_URL=https://app.uniway-tw.com/
          mkdir -p build/preview
          cp build/app/outputs/flutter-apk/app-debug.apk build/preview/UniWay-Android-preview-debug.apk
          (cd build/preview && sha256sum UniWay-Android-preview-debug.apk > UniWay-Android-preview-debug.apk.sha256)

      - name: Upload Android preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UniWay-Android-preview-apk
          if-no-files-found: error
          path: |
            mobile_flutter/build/preview/UniWay-Android-preview-debug.apk
            mobile_flutter/build/preview/UniWay-Android-preview-debug.apk.sha256
