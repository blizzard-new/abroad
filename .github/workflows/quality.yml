name: Web quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set isolated test data directory
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_ENV"]).open("a") as handle:
              handle.write(f"EXCHANGE_INFO_DATA_DIR={os.environ['RUNNER_TEMP']}/exchange-info-tests\n")
          PY

      - name: Install project and browser
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.26
          uv lock --check
          uv sync --frozen --extra dev
          uv run --frozen python -m playwright install --with-deps chromium

      - name: Verify the committed React Aria school picker bundle
        run: |
          npm ci --prefix frontend/react-aria --no-fund --no-audit
          npm run build --prefix frontend/react-aria
          git diff --exit-code -- src/exchange_info/static/react-aria-school-picker.js src/exchange_info/static/react-aria-school-picker.css src/exchange_info/static/react-aria-school-picker.js.LEGAL.txt

      - name: Install PDF rendering tools from Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftoppm -v

      - name: Check Python and JavaScript syntax
        run: |
          uv run --frozen python -m compileall -q src
          node --check src/exchange_info/static/app.js
          node --check src/exchange_info/static/content-review.js
          node --check src/exchange_info/static/icon-motion.js

      - name: Check frozen OpenAPI contract
        run: uv run --frozen python scripts/export_openapi.py --check

      - name: Parse Supabase migrations and function bodies
        run: uv run --frozen python scripts/validate_supabase_migrations.py

      - name: Audit runtime dependencies for known vulnerabilities
        run: uv run --frozen python scripts/audit_python_dependencies.py

      - name: Validate isolated Supabase runtime
        timeout-minutes: 20
        run: uv run --frozen python scripts/validate_tku_community_runtime.py

      - name: Run Web test suite
        env:
          WEB_TEST_SHARD: ${{ matrix.shard }}
          TKU_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/web-evidence/browser
        run: |
          mkdir -p "$RUNNER_TEMP/web-evidence"
          set -o pipefail
          uv run --frozen python scripts/run_web_quality_tests.py --shard "$WEB_TEST_SHARD" --shards 4 --junitxml "$RUNNER_TEMP/web-evidence/suite.xml" --evidence-dir "$RUNNER_TEMP/web-evidence" 2>&1 | tee "$RUNNER_TEMP/web-evidence/pytest.log"

      - name: Run immutable main control for prior shared failures
        if: ${{ always() }}
        env:
          WEB_TEST_SHARD: ${{ matrix.shard }}
        run: uv run --frozen python scripts/run_main_browser_control.py --shard "$WEB_TEST_SHARD" --evidence-dir "$RUNNER_TEMP/web-evidence/main-control"

      - name: Retain original test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-evidence-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/web-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm bundled official data was not mutated
        if: ${{ always() }}
        run: git diff --exit-code -- src/exchange_info/official_data
