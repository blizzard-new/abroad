name: ExchangeGuide
options:
  bundleIdPrefix: tw.edu.cgu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  ExchangeGuide:
    type: application
    platform: iOS
    sources:
      - path: ExchangeGuide
        excludes:
          - Resources
    resources:
      - path: ExchangeGuide/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.edu.cgu.exchangeguide
        PRODUCT_NAME: ExchangeGuide
        INFOPLIST_FILE: ExchangeGuide/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - ExchangeGuideTests
  ExchangeGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ExchangeGuideTests
    dependencies:
      - target: ExchangeGuide
