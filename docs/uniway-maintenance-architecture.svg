<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1540" viewBox="0 0 1920 1540" role="img" aria-labelledby="title desc">
<title id="title">Uniway 全臺交換資料維護 本地伺服器架構</title>
<desc id="desc">官方與學生來源經來源登錄、Windows 排程、本地 Postgres 任務佇列、Python worker、安全抓取、私有快照、解析驗證與人工審核，再原子發布到網站。沿用 KEVINSERVER、Docker Compose、本地 Postgres 及 Storage；外部 AI 預設關閉。包含本地備份與權限邊界。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#506279"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#182b40}.title{font-size:42px;font-weight:700}.subtitle{font-size:23px;fill:#4e6175}.section{font-size:26px;font-weight:700}.box-title{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#4e6175}.arrow{fill:none;stroke:#506279;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style>
<rect width="1920" height="1540" fill="#f7f9fc"/>
<text x="60" y="75" class="title">Uniway 全臺交換資料維護</text>
<text x="62" y="114" class="subtitle">本地伺服器架構與操作流程  ·  版本 1.1  ·  2026.10.14</text>
<rect x="60" y="145" width="1800" height="87" rx="16" fill="#e9f1ff" stroke="#b6cbed" stroke-width="2"/>
<text x="85" y="181" class="body">已確認基線：KEVINSERVER / Windows Server 2025 / Docker Desktop Linux / Compose uniway</text>
<text x="85" y="216" class="small">沿用本地 Postgres 17.6、PostgREST 14.12、Storage API 1.60.4 與 Windows Caddy；不恢復雲端服務</text>
<rect x="80" y="260" width="540" height="90" rx="16" fill="#fff" stroke="#b9c8d9" stroke-width="2"/>
<text x="102" y="298" class="box-title">官方資料</text>
<text x="102" y="330" class="small">公告、清單、網頁、PDF、允許的 feed</text>
<rect x="690" y="260" width="540" height="90" rx="16" fill="#fff" stroke="#b9c8d9" stroke-width="2"/>
<text x="712" y="298" class="box-title">學生經驗</text>
<text x="712" y="330" class="small">主動投稿、授權心得、過期回報</text>
<rect x="1300" y="260" width="540" height="90" rx="16" fill="#fff" stroke="#b9c8d9" stroke-width="2"/>
<text x="1322" y="298" class="box-title">管理員輸入</text>
<text x="1322" y="330" class="small">核准來源、人工補充、限定範圍重查</text>
<rect x="45" y="395" width="1830" height="925" rx="24" fill="#eff4fa" stroke="#b8c8dc" stroke-width="2"/>
<text x="75" y="435" class="section">本地私有處理邊界</text>
<text x="1170" y="435" class="small">資料庫與管理埠不新增公網暴露</text>
<path d="M350 350 V375 H450 V449 H260 V464" class="arrow"/>
<path d="M960 350 V375 H450" class="arrow"/>
<path d="M1570 350 V375 H450" class="arrow"/>
<rect x="80" y="470" width="360" height="150" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="109" cy="504" r="17" fill="#245eb4"/>
<text x="109" y="511" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">1</text>
<text x="138" y="512" class="box-title">來源登錄</text>
<text x="102" y="548" class="body">母校／年度／校區／院系</text>
<text x="102" y="577" class="body">核准 domain、權利與來源角色</text>
<text x="102" y="606" class="body">陌生網址先審查，再排任務</text>
<rect x="530" y="470" width="360" height="150" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="559" cy="504" r="17" fill="#245eb4"/>
<text x="559" y="511" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">2</text>
<text x="588" y="512" class="box-title">排程與持久佇列</text>
<text x="552" y="548" class="body">Task Scheduler 或既有排程</text>
<text x="552" y="577" class="body">Postgres jobs table</text>
<text x="552" y="606" class="body">去重、租約、退避、手動重查</text>
<rect x="980" y="470" width="360" height="150" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="1009" cy="504" r="17" fill="#245eb4"/>
<text x="1009" y="511" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">3</text>
<text x="1038" y="512" class="box-title">單一 Python worker</text>
<text x="1002" y="548" class="body">獨立進程，與 Web 資源隔離</text>
<text x="1002" y="577" class="body">安全抓取、ETag／304</text>
<text x="1002" y="606" class="body">SSRF／下載上限／失敗分類</text>
<rect x="1430" y="470" width="360" height="150" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="1459" cy="504" r="17" fill="#245eb4"/>
<text x="1459" y="511" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">4</text>
<text x="1488" y="512" class="box-title">私有快照與證據</text>
<text x="1452" y="548" class="body">現有 Storage file backend</text>
<text x="1452" y="577" class="body">雜湊去重、來源與頁碼</text>
<text x="1452" y="606" class="body">與公開 static 目錄隔離</text>
<path d="M440 545 H524" class="arrow"/>
<path d="M890 545 H974" class="arrow"/>
<path d="M1340 545 H1424" class="arrow"/>
<path d="M1610 620 V714" class="arrow"/>
<rect x="1430" y="720" width="360" height="150" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="1459" cy="754" r="17" fill="#245eb4"/>
<text x="1459" y="761" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">5</text>
<text x="1488" y="762" class="box-title">本地解析優先</text>
<text x="1452" y="798" class="body">固定解析器、必要時離線 OCR</text>
<text x="1452" y="827" class="body">內容＋parser 版本決定重跑</text>
<text x="1452" y="856" class="body">外部 AI 預設關閉</text>
<rect x="980" y="720" width="360" height="150" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="1009" cy="754" r="17" fill="#245eb4"/>
<text x="1009" y="761" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">6</text>
<text x="1038" y="762" class="box-title">欄位驗證與協調</text>
<text x="1002" y="798" class="body">核對年份、範圍、單位、權威</text>
<text x="1002" y="827" class="body">正式規則與心得分開</text>
<text x="1002" y="856" class="body">缺值／錯誤不可改成零</text>
<rect x="530" y="720" width="360" height="150" rx="16" fill="#fff" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="559" cy="754" r="17" fill="#245eb4"/>
<text x="559" y="761" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">7</text>
<text x="588" y="762" class="box-title">候選差異與衝突</text>
<text x="552" y="798" class="body">舊值、新值、來源原句</text>
<text x="552" y="827" class="body">同值不重複審，衝突不覆蓋</text>
<text x="552" y="856" class="body">保留 candidate 與基準版本</text>
<rect x="80" y="720" width="360" height="150" rx="16" fill="#fff4df" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="109" cy="754" r="17" fill="#245eb4"/>
<text x="109" y="761" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">8</text>
<text x="138" y="762" class="box-title">審核後台</text>
<text x="102" y="798" class="body">高風險欄位與心得人工核對</text>
<text x="102" y="827" class="body">批准、退回、暫緩、重查</text>
<text x="102" y="856" class="body">校內截止／名額優先</text>
<path d="M1430 795 H1346" class="arrow"/>
<path d="M980 795 H896" class="arrow"/>
<path d="M530 795 H446" class="arrow"/>
<path d="M260 870 V964" class="arrow"/>
<rect x="80" y="970" width="360" height="150" rx="16" fill="#fff4df" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="109" cy="1004" r="17" fill="#245eb4"/>
<text x="109" y="1011" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">9</text>
<text x="138" y="1012" class="box-title">受保護發布入口</text>
<text x="102" y="1048" class="body">批准綁定確切內容與證據</text>
<text x="102" y="1077" class="body">低風險僅限白名單規則</text>
<text x="102" y="1106" class="body">權限、版本、撤回清單再檢查</text>
<rect x="530" y="970" width="360" height="150" rx="16" fill="#eaf7ef" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="559" cy="1004" r="17" fill="#245eb4"/>
<text x="559" y="1011" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">10</text>
<text x="588" y="1012" class="box-title">原子發布與回復</text>
<text x="552" y="1048" class="body">同一 DB transaction</text>
<text x="552" y="1077" class="body">鎖候選與 publication head</text>
<text x="552" y="1106" class="body">回復建立新 release，不刪歷史</text>
<rect x="980" y="970" width="360" height="150" rx="16" fill="#eaf7ef" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="1009" cy="1004" r="17" fill="#245eb4"/>
<text x="1009" y="1011" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">11</text>
<text x="1038" y="1012" class="box-title">固定版本清單</text>
<text x="1002" y="1048" class="body">entity revisions ＋ release</text>
<text x="1002" y="1077" class="body">包含共享學校／城市 revision</text>
<text x="1002" y="1106" class="body">公開讀取仍套 suppression</text>
<rect x="1430" y="970" width="360" height="150" rx="16" fill="#eaf7ef" stroke="#cbd6e2" stroke-width="2"/>
<circle cx="1459" cy="1004" r="17" fill="#245eb4"/>
<text x="1459" y="1011" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">12</text>
<text x="1488" y="1012" class="box-title">公開只讀 API</text>
<text x="1452" y="1048" class="body">列表、詳細頁固定 release ID</text>
<text x="1452" y="1077" class="body">來源、年度、最後核實、時效</text>
<text x="1452" y="1106" class="body">未知與部分覆蓋明確標示</text>
<path d="M440 1045 H524" class="arrow"/>
<path d="M890 1045 H974" class="arrow"/>
<path d="M1340 1045 H1424" class="arrow"/>
<path d="M1610 1120 V1178 H60 V795 H74" class="arrow dash"/>
<text x="625" y="1168" class="small">用戶投稿／過期回報回到審核，不直接修改正式值</text>
<rect x="80" y="1210" width="1710" height="75" rx="16" fill="#ffffff" stroke="#cbd6e2" stroke-width="2"/>
<text x="102" y="1242" class="body">三個可靠性底線：租約 token＋DB 到期檢查　｜　發布原子交易＋版本鎖　｜　失敗不清空已核實資料</text>
<text x="102" y="1272" class="small">公開入口沿用 Windows Caddy；不自動執行 update.ps1，不自動套正式 migrations，不新開 firewall 埠</text>
<text x="65" y="1370" class="section">本地維運與上線門檻</text>
<rect x="65" y="1390" width="865" height="103" rx="16" fill="#fff" stroke="#bdcad9" stroke-width="2"/>
<text x="86" y="1426" class="box-title">已有排程先核對，再補能力</text>
<text x="86" y="1458" class="small">備份每日 04:00、健康每 5 分鐘；檢查斷電／重啟、磁碟、租約與積壓</text>
<text x="86" y="1483" class="small">備份成功訊息不等於能還原；需 DB＋檔案一致備份與隔離還原演練</text>
<rect x="955" y="1390" width="865" height="103" rx="16" fill="#fff" stroke="#bdcad9" stroke-width="2"/>
<text x="976" y="1426" class="box-title">異機加密備份由使用者選目標</text>
<text x="976" y="1458" class="small">核心流程留在本地；外部模型僅明確 opt-in provider／資料／預算後啟用</text>
<text x="976" y="1483" class="small">先 dry-run、35 項驗收、核准切換；正式部署與新權限另行確認</text>
</svg>