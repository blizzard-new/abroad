med and follow official guidance. Use Waze for real-time updates on closures and alternate routes.","demonstration":"Expect increased traffic and delays. Use Waze for real-time updates on closures and alternate routes.","driving_advisory":"Expect delays due to increased traffic and congestion. Use Waze for real-time updates on closures and alternate routes.","holiday_festival":"Expect increased traffic and delays. Use Waze for real-time updates on closures and alternate routes.","parade":"Expect increased traffic and delays. Use Waze for real-time updates on closures and alternate routes.","partner_user_comms":"Expect delays due to increased traffic and congestion. Use Waze for real-time updates on closures and alternate routes.","sporting_event":"Expect increased traffic and delays. Use Waze for real-time updates on closures and alternate routes.","summit":"Expect delays due to increased traffic and congestion. Use Waze for real-time updates on closures and alternate routes.","unplanned_disruption":"Expect delays due to increased traffic and congestion. Use Waze for real-time updates on closures and alternate routes.","other":"Expect increased traffic and delays. Use Waze for real-time updates on closures and alternate routes."},"show_more":"Show more","show_less":"Show less","impact_title":"Closed roads","created_by":"Posted by %{createdBy}","last_updated_by":"Last updated by %{lastUpdatedBy}","attribution_source":"This information is sourced from the Waze community, partners, and other third-party providers.","category_header":{"ended":"Past events","live":"Happening now","upcoming":"Upcoming events"},"webview_header":{"event":"Waze traffic alert","event_page":"Waze events"},"call_to_action":{"copied_link":"Link copied","copy_link":"Copy link","share":"Share","plan_a_drive":"Find a route","website":"Website"},"per_event":{"default":{"description":"Stay informed about traffic disruptions and road closures caused by major events in your area","image_alt":"Map showing traffic congestion and road closures around a major event","image_url":"https:\u002F\u002Fweb-assets.waze.com\u002Fsocial\u002Fog-event-landing.png","title":"Waze traffic alert:"}},"unready_events":"Unready Events","dynamic_info_disclaimer":"Information on this page is dynamic, actual road conditions may differ","end_of_list":"You've reached the end of the list","loading_events":"Loading events...","map":{"editor_link":"Edit this event"},"learn_more_title":"Learn more","overview":"Overview","recenter":"Recenter"},"guides":{"header":{"title":"Your essential guide to driving in Italy","description":"We've partnered with Waze Italian local drivers to help you avoid fines and drive smoothly.","cta":{"get_waze":"Get Waze","share":"Share","read_later":"Read later","view_routes":"View routes"}},"badges":{"automatic_fine":"Automatic fine"},"sections":{"ztl_zone":{"title":"ZTL zones","description_part_one":"Most Italian cities protect their historic centers with Limited Traffic Zones (ZTL). This is the most common cause of traffic fines for visitors. Unlike other countries, in Italy, ZTLs are strictly monitored by cameras, not police. A single wrong turn may trigger a fine that’s mailed to your home address months after your trip.","description_part_two":"Always check the signs for restricted hours. If your hotel is in a ZTL, call them in advance and ask them to register your license plate.","info_bubble":{"title":"ZTL in Waze","content":"When possible, Waze provides routes that bypass active ZTL zones, as long as your destination is outside the zone. If your destination is inside an active ZTL zone, Waze will alert you and ask you to add a pass or change your destination."}},"speed_cameras":{"title":"Speed cameras","description":"In Italy, speed cameras are often in gray or orange boxes, or mounted on a pole on highways and other paved roads. The system is fully automated and very strict. Even minor speeding infractions (5-10 km\u002Fh over) can be captured and may result in a fine sent by mail or to your rental agency.","info_bubble":{"title":"Speed cameras in Waze","content":"Waze gives you real-time alerts for fixed speed cameras and enforcement zones, relying on community-sourced data."}},"public_transport_lanes":{"title":"Public transport lanes","description":"Do not enter lanes marked with yellow lines or the words [bus], [taxi], or [tram]. These lanes are strictly reserved and frequently monitored by cameras. Using them, even for a moment, can trigger a fine."},"parking_regulations":{"title":"Parking regulations","white_lines":{"title":"White lines","description":"[White lines:] You can park for free, but check for signs indicating a time limit."},"blue_lines":{"title":"Blue lines","description":"[Blue lines:] You must pay to park. Use the meters to get a ticket and make sure to add your license plate number."},"yellow_lines":{"title":"Yellow lines","description":"[Yellow lines:] This is restricted parking for authorized vehicles only."},"pink_lines":{"title":"Pink lines","description":"[Pink lines:] Reserved for expectant mothers and parents with infants."}},"gas":{"title":"Gas","description":"Pumping gas in Italy is simple. However, the names can be confusing. [Gasolio] is diesel and [Benzina] is gasoline. Since it's easy to mix them up, always double-check the fuel cap before you start pumping and look for (E) for gas or (B) for diesel."},"toll_roads":{"title":"Toll roads","description_part_one":"Toll roads (Autostrade) are the fastest way to get between cities, but they can be expensive.","description_part_two":"When exiting, aim for the Blue Lanes marked \"Carte.\" Pay by tapping or inserting your credit card or Apple\u002FGoogle Pay.","description_part_three":"[Rental Tip:] Skip the \"Telepass\" device offered by rental agencies. The daily activation fees rarely justify the few minutes you might save compared to using the Blue Lanes."},"rural_areas":{"title":"Mountainous & rural areas","description_part_one":"If you’re planning a trip to Tuscany, the Amalfi Coast, the Alps, or the Dolomites, get ready for steep, winding roads with very sharp turns. The roads are often narrower than you might think, sometimes with one-and-a-half lanes and no shoulder.","description_part_two":"It’s common practice for locals to honk twice (two short taps) before a blind turn to warn drivers coming from the other direction.","description_part_three":"Don't feel pressured to keep up with local drivers who take the curves at high speeds. You can pull over at a designated roadside pull off to let them pass."},"specific_rules":{"title":"Specific rules to Italy","description_part_one":"[Headlights:] Turn them on at all times when you drive outside of cities, even during the day.","description_part_two":"[Roundabouts:] Usually, cars already in the roundabout have the right of way.","description_part_three":"[Scooters:] You’ll see scooters everywhere, so always check your mirrors. They often weave between lanes, especially in roundabouts and at traffic lights."},"emergency_numbers":{"title":"Emergency numbers","general":"General emergencies","medical":"Medical emergencies","roadside":"Roadside emergencies"},"vocabulary":{"title":"Essential vocabulary","gasoline":"Gasoline","diesel":"Diesel","highway":"Highway","toll":"Toll","card":"Card","exit":"Exit","yield":"Yield","one_way":"One way","parking":"Parking","no_parking":"No parking","pay":"Pay","free":"Free"},"cta":{"ready":"Ready for your Italian adventure?","start_driving":"Start driving","disclaimer":"The content above, provided by the Waze community, is for information purposes only and constitutes a mere recommendation from local drivers. This content is not a substitute for official legal advice or local traffic laws. Drivers are responsible for complying with all applicable local laws, regulations, and road signage.","link_copied":"link copied","link_copy_failure":"link could not be copied"},"footer":{"slogan":"Where drivers help drivers","terms_of_use":"Terms of Use","privacy":"Privacy Policy","copyright_notice":"Copyright notice","copyright":"© 2006 - %{currentYear} Waze Mobile. All Rights Reserved."}}},"guides_mexico":{"header":{"title":"Your essential guide to driving in Mexico","description":"We partnered with Waze Mexican local drivers to help you avoid fines and drive smoothly.","image":{"alt_text":"A colorful illustration of the Waze logo exploring Mexico landmarks and culture."},"cta":{"share":"Share","get_waze":"Get Waze","read_later":"Read later","view_routes":"View routes"}},"sections":{"visitors":{"title":"U.S. & Canadian visitors","kilometers_per_hour":{"title":"Kilometers per hour","description":"Mexico operates on the metric system, so speed limit signs are in km\u002Fh. If you see a sign reading \"60\" and mentally map it to 60 mph, you’ll be traveling at nearly double the legal limit."},"foreign_plated_vehicles":{"title":"Foreign-plated vehicles","description":"You can drive without special permits inside the “Free Zone”, which covers the entire Baja Peninsula and a 20–26 km perimeter from the border. To drive deeper into mainland Mexico, you must get a Temporary Import Permit (TIP) from an official Banjercito office at the border."}},"speed_limits_and_hazards":{"title":"Speed limits & hazards","sudden_speed_drops":{"title":"Sudden speed drops","description":"Speed limits drop sharply and without warning near small villages. Police are often stationed at town entrances to enforce these sudden changes.","image":{"alt_text":"Waze map interface showing a reduced speed warning notification","caption":"Waze alerts you about sudden limit drops roughly 500 meters before the drop, giving you plenty of time to adjust to the new speed safely."}},"speed_bumps":{"title":"Speed bumps (Topes)","description":"Large concrete speed bumps are very common on free roads, near town entrances and at intersections. Many are unpainted or lack a preceding warning sign. Hitting one at 90 km\u002Fh can destroy your car’s suspension. Make sure to go into your Waze settings to turn on speed bump notifications for your trip.","image":{"caption":"Look out for speed bumps on rural roads.","alt_text":"Yellow diamond road sign indicating a speed bump on a rural road in Mexico."}},"cameras":{"title":"Cameras","description":"Automated camera networks are concentrated in dense areas like Mexico City and the State of Mexico. For rental cars, violations are usually linked to the license plate and charged to your credit card by the agency."}},"gas":{"title":"Gas","description":"In most places in Mexico you don’t pump your own fuel. Attendants handle the entire process, and it’s customary to tip them $10 to $20 Pesos. To ensure a smooth transaction, keep these standard practices in mind:","check_the_pump":{"title":"Check the pump","description":"Before the attendant begins fueling, verify that the pump meter starts at zero. A common oversight is continuing the charge from where the previous customer left off."},"cash_transactions":{"title":"Cash transactions","description":"Paying by card or Google\u002FApple pay is often easiest, but if you’re using cash, verbally confirm the bill amount as you hand it over, for example, \"Here is 500 pesos\". This makes it difficult for a dishonest attendant to quickly swap your large bill for a smaller one and claim you underpaid.","image":{"caption":"Be alert when paying with cash at gas stations","alt_text":"A gas station attendant in Mexico pumping fuel into a car"}}},"city_driving_tips":{"title":"City driving tips","multi_level_roads":{"title":"Multi-level roads","description":"In major hubs like Mexico City, elevated expressways run directly above main streets. Signage is often limited, so expect to see exit signs at the exact point where the road divides. Watch Waze closely and pick your lane early, since missing critical turnoffs may cost you lengthy detours.","image":{"caption":"Elevated expressways in Mexico city","alt_text":"Traffic flowing on a multi-level highway system in Mexico City."}},"bus_lanes":{"title":"Bus lanes","description":"Major avenues include dedicated lanes reserved for municipal buses (BRT), marked by paint or barriers and monitored by cameras. Driving or turning across them often may trigger heavy fines and vehicle impoundment.","image":{"caption":"Mexico City’s Metrobús lanes are highly regulated and off-limits for cars.","alt_text":"A red Metrobús in its dedicated lane in Mexico City."}},"defensive_driving":{"title":"Defensive driving","description":"Driving in Mexico requires a highly alert mindset. Don’t assume other vehicles will follow standard traffic rules. Cars and motorbikes may pass on the right, cut into your lane without signaling, and run red lights. Double check your mirrors and surroundings before any maneuver."},"hoy_no_circula":{"title":"Hoy No Circula","description_part_one":"To combat air pollution, Mexico City and the State of Mexico restrict driving on certain weekdays based on the last digit of the license plate and the vehicle’s emissions category. Hybrid and electric vehicles are exempt from these restrictions and can circulate every day, making them a better choice for rentals. Ask your rental agency about the vehicle's restrictions and verification sticker (holograma).","description_part_two":"During severe pollution spikes (contingencia ambiental), additional restrictions apply. Driving on a restricted day can result in heavy fines and immediate vehicle impoundment.","image":{"alt_text":"A mobile phone screen showing a Hoy-No-Circula air pollution alert notification.","caption":"Waze helps you navigate these restrictions by alerting you when a contingency is declared for the upcoming day."},"waze_tip_content":{"title":"Waze Tip","content":"You can add your toll passes directly into Waze and it will calculate the most efficient route using toll highways, and allow you to compare alternative routes based on time and toll costs."}}},"toll_roads":{"title":"Toll roads","description_part_one":"Mexico features a dual highway system: free roads (carreteras federales) and toll roads (autopistas de cuota). Toll roads are often faster, better maintained, and highly recommended for tourists.","image_one":{"caption":"El Periférico highway in Mexico City.","alt_text":"Cars driving through an electronic toll plaza on the Anillo Periférico highway."},"description_part_two":"Many toll roads require an electronic tag. Entering without one can cause exit delays, steep fines, and on certain routes, trigger automated spike strips that shred your tires if you pass without paying. Ask your rental agency for a pre-loaded toll tag (like PASE or IAVE) or buy one at a local convenience store like OxxO or 7Eleven.","image_two":{"alt_text":"Waze settings menu showing local Mexican toll passes like PASE and IAVE.","caption":"You can add your toll passes directly into Waze in Settings under ‘Toll & HOV passes’. The app will calculate the most efficient route based on your preferences, allowing you to compare alternative routes based on time and costs."}},"parking":{"title":"Parking","description":"Parking rules vary by city and neighborhood, but the rules for curb colors remain consistent across the country.","red_or_yellow_curbs":{"title":"Red or yellow curbs","description":"No parking at any time. Parking here carries a high risk of getting your vehicle towed or locked with a wheel clamp.","image_red":{"alt_text":"A red painted concrete curb indicating a restricted parking."},"image_yellow":{"alt_text":"A yellow painted concrete curb indicating a restricted parking."}},"white_or_broken_lines":{"title":"White or broken lines","description":"Parking is generally allowed, but always check nearby signs to confirm.","image_solid":{"alt_text":"A solid white line painted on a road indicating a legal parking spot"},"image_broken":{"alt_text":"A broken white line painted on a road indicating a legal parking spot"}},"unofficial_parking_attendants":{"title":"Unofficial parking attendants (Franeleros)","description":"In busy areas, unauthorized attendants may block public street spaces with plastic buckets or crates and offer to watch your car for a fee. This informal system is a deeply rooted neighborhood custom. While many locals pay the fee, the Waze local community recommends using private parking lots whenever possible."}},"personal_safety":{"title":"Personal safety","avoid_driving_at_night":{"title":"Avoid driving at night","description":"Poorly lit roads make it difficult to spot hazards like potholes, speed bumps (topes), and wandering livestock. Additionally, night driving carries a higher security risk. After midnight, many drivers intentionally run red lights to avoid being stationary targets for crime, and many cities stop operating traffic lights altogether.","image":{"caption":"Stick to driving during daylight hours.","alt_text":"A dimly lit street corner in Mexico at night with storefronts."}},"keep_valuables_hidden":{"title":"Keep valuables hidden","description":"In slow traffic and at red lights, keep your windows rolled up and store all valuables completely out of sight to prevent quick thefts."},"unofficial_checkpoints":{"title":"Unofficial checkpoints","description":"In rural areas, you may encounter local groups blocking the road with a rope to collect a small cash fee. For your safety, the Waze local community recommends that you pay the fee and not try to speed through. Keep a roll of $20 and $50 pesos in your front storage compartment."}},"police_stops_and_fines":{"title":"Police stops & fines","description":"If an officer pulls you over and requests an on-the-spot cash payment, decline and ask for a formal written ticket instead. Traffic fines in Mexico are surprisingly inexpensive, making the official legal route likely the cheaper and safer option. Many cities offer a 50% discount if you pay right away at the treasury office (Tesorería Municipal) or police precinct.","image":{"caption":"If pulled over, politely request a formal written ticket.","alt_text":"A police officer in a high-visibility vest speaking to a driver in her car."},"tourist_courtesy_warnings":{"title":"Tourist courtesy warnings","description":"In major tourist hubs like Cancún, Playa del Carmen, Tulum, minor violations may qualify for a courtesy violation (Infracción de Cortesía), which is a formal written warning with no cost."},"license_plate_removal":{"title":"License plate removal","description":"Don’t be surprised if your license plate is missing - it’s a common legal practice for officers to remove a vehicle's license plate as collateral for parking violations. The plate is returned to you once you pay the fine at the Treasury Office."}},"emergency_numbers":{"title":"Emergency numbers","general":"General Emergency Services","highway":"Highway Assistance"},"vocabulary":{"title":"Essential vocabulary","stop":"Stop","speed_bump":"Speed bump","uturn":"U-turn","detour":"Detour","express_lanes":"Express lanes","local_lanes":"Local lanes","toll_highway":"Toll highway","free_highway":"Free highway","toll_tag":"Toll tag","cash":"Cash","card":"Card","regular_gasoline":"Regular gasoline","full_tank":"Full tank","unofficial_parking_attendant":"Unofficial parking attendant","vehicle_impound_lot":"Vehicle impound lot"},"cta":{"ready":"Ready for your Mexican adventure?","start_driving":"Start driving","disclaimer":"The content above, provided by the Waze community, is for information purposes only and constitutes a mere recommendation from local drivers. This content is not a substitute for official legal advice or local traffic laws. Drivers are responsible for complying with all applicable local laws, regulations, and road signage.","get_waze":"Get Waze","read_later":"Read later","view_routes":"View routes","link_copied":"Link copied to clipboard","link_copy_failure":"Can't copy link"}}}}}</script><script type="application/ld+json">{"@context":"https:\u002F\u002Fschema.org","@type":"Place","geo":{
