[project]
name = "taiwan-exchange-info"
version = "0.1.0"
description = "Web-first exchange application guide for Taiwan university students, supporting CGU, NTPU, NTU and NCU."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "cryptography>=50.0.1,<51.0.0",
    "ddgs>=9.14.4",
    "fastapi>=0.115.0",
    "jsonschema>=4.23.0,<5.0.0",
    "playwright>=1.45.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "pydantic>=2.7.0",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "httpx2>=2.0.0,<3.0.0",
    "pip-audit==2.10.1",
    "pglast==8.4",
    "pytest>=8.2.0",
]

[project.scripts]
exchange-info = "exchange_info.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exchange_info = [
    "static/*",
    "static/assets/**/*",
    "static/vendor/**/*",
    "official_data/**/*.pdf",
    "official_data/**/*.json",
    "official_data/**/*.json.gz",
    "official_data/**/*.jsonl",
    "official_data/**/*.csv",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
