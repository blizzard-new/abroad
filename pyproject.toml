[project]
name = "taiwan-exchange-info"
version = "0.1.0"
description = "Web-first exchange application guide supporting CGU, NTPU, NTU, CCU, NCU and TKU students."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "cryptography>=50.0.1,<51.0.0",
    "ddgs>=9.14.4",
    "fastapi>=0.115.0",
    "jsonschema>=4.23.0,<5.0.0",
    "playwright>=1.45.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "pydantic>=2.7.0",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "httpx2>=2.0.0,<3.0.0",
    "pip-audit==2.10.1",
    "pglast==8.4",
    "pytest>=8.2.0",
]

[project.scripts]
exchange-info = "exchange_info.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exchange_info = [
    "editorial/*.json",
    "static/*",
    "static/assets/**/*",
    "static/vendor/**/*",
    "official_data/**/*.pdf",
    "official_data/ccu/*.doc",
    "official_data/ccu/*.odt",
    "official_data/ccu/partner_forms/*.docx",
    "official_data/ccu/partner_forms/*.doc",
    "official_data/ccu/partner_forms/*.xlsx",
    "official_data/ccu/partner_forms/*.xls",
    "official_data/ccu/public_responses/*.html",
    "official_data/ccu/public_responses/*.jpg",
    "official_data/ccu/completion_sources/*",
    "official_data/**/*.docx",
    "official_data/**/*.xlsx",
    "official_data/**/*.json",
    "official_data/**/*.json.gz",
    "official_data/**/*.jsonl",
    "official_data/**/*.csv",
    "official_data/tku/capture_packs/*.zip.*",
    "official_data/tku/fonts/*.ttf",
    "official_data/tku/fonts/OFL.txt",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
