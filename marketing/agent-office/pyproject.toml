[project]
name = "uniway-agent-office"
version = "0.1.0"
description = "UniWay 行銷辦公室：每天自動企劃、撰寫、設計、剪輯並發佈 Threads／Instagram／YouTube 內容的 AI agent 團隊。"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
office = "office.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["office*"]

[tool.setuptools.package-data]
office = ["render/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
