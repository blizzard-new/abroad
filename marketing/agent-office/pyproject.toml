[project]
name = "uniway-agent-office"
version = "0.1.0"
description = "UniWay 行銷辦公室：每天自動企劃、撰寫、設計、剪輯並發佈 Threads／Instagram／YouTube 內容的 AI agent 團隊。"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "imageio-ffmpeg>=0.5.1",  # a ffmpeg build (with x264) for Windows, Mac and Linux, so nobody installs it by hand
    "numpy>=1.26.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows has no time zone database of its own
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
office = "office.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["office*"]

[tool.setuptools.package-data]
office = ["render/*.html", "render/*.css", "static/*", "static/fonts/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
