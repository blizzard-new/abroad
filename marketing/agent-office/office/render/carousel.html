<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<title>UniWay 輪播圖文</title>
<!--
  IG 輪播（1080×1350，4:5）與限時動態（1080×1920）的版型。
  renderer.py 會呼叫 window.renderSlide({...}) 換內容，等字型載入完再截圖成 JPEG（Instagram API 只收 JPEG 圖片）。
-->
<link rel="stylesheet" href="/fonts/genjyuu/GenJyuuGothic-Medium.css" />
<link rel="stylesheet" href="/fonts/genjyuu/GenJyuuGothic-Bold.css" />
<link rel="stylesheet" href="/template/mascot-face.css" />
<style>
  @font-face { font-family: "Poppins"; font-weight: 500; src: url("/fonts/poppins/Poppins-Medium.ttf") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 700; src: url("/fonts/poppins/Poppins-Bold.ttf") format("truetype"); }
  :root {
    --navy: #10294a;
    --ink: #1f3b5c;
    --muted: #52708f;
    --blue: #2f7de1;
    --cyan: #17b5d8;
    --coral: #e2574a;
    --paper: #f4f8fc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  #slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    color: var(--navy);
    font-family: "Poppins", "GenJyuuGothic", "Noto Sans TC", sans-serif;
    background:
      radial-gradient(520px 560px at 8% 4%, rgba(120, 205, 225, 0.55), transparent 70%),
      radial-gradient(560px 600px at 100% 96%, rgba(255, 205, 175, 0.6), transparent 70%),
      radial-gradient(420px 460px at 96% 38%, rgba(196, 186, 245, 0.35), transparent 70%),
      var(--paper);
  }
  #slide.story { height: 1920px; }
  #slide > * { position: absolute; }
  #slide.dark {
    color: #fff;
    background:
      radial-gradient(700px 700px at 85% 10%, rgba(47, 125, 225, 0.45), transparent 70%),
      radial-gradient(640px 640px at 0% 100%, rgba(23, 181, 216, 0.3), transparent 70%),
      radial-gradient(circle at 50% 35%, #17345a, #0f1d30 75%);
  }

  .brand { left: 72px; top: 64px; display: flex; align-items: center; gap: 16px; }
  .brand img { width: 68px; height: 68px; }
  .word { font: 700 46px/1 "Poppins", sans-serif; letter-spacing: -0.02em; background: linear-gradient(100deg, #1554d8 10%, #18b6e3 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .dark .word { background: linear-gradient(100deg, #8cc4ff, #6fe2ff); -webkit-background-clip: text; background-clip: text; }
  .count { right: 72px; top: 80px; font: 600 32px "Poppins", sans-serif; color: var(--muted); letter-spacing: 0.04em; }
  .dark .count { color: #b9d3ec; }

  .kicker { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; background: #fff; color: var(--coral); font-size: 32px; font-weight: 700; letter-spacing: 0.06em; box-shadow: 0 14px 34px rgba(16, 41, 74, 0.12); }
  .kicker i { width: 14px; height: 14px; border-radius: 50%; background: var(--coral); }

  h1, h2 { margin: 0; font-weight: 700; line-height: 1.18; letter-spacing: 0.01em; }
  h1 em, h2 em { font-style: normal; background: linear-gradient(90deg, #2f7de1, #17b5d8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .seg { display: block; white-space: nowrap; }
  .seg.wrap { white-space: normal; }

  /* cover */
  .cover-text { left: 72px; right: 72px; top: 230px; }
  .cover-text h1 { margin-top: 40px; font-size: 104px; }
  .cover-text p, .cta p { text-wrap: pretty; }
  .cover-text p { margin: 36px 0 0; max-width: 760px; font-size: 42px; line-height: 1.5; color: var(--muted); font-weight: 500; }
  .mascot { right: 40px; bottom: 70px; width: 330px; filter: drop-shadow(0 26px 30px rgba(35, 82, 135, 0.28)); transform: rotate(-6deg); }
  .swipe { left: 72px; bottom: 90px; display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; color: var(--blue); }
  .swipe svg { width: 54px; height: 54px; }

  /* point: the block is centred between the header and the footer */
  .point { left: 72px; right: 72px; top: 170px; bottom: 190px; display: flex; flex-direction: column; justify-content: center; }
  .num { display: grid; place-items: center; width: 150px; height: 150px; border-radius: 42px; color: #fff; font: 700 70px "Poppins", sans-serif; background: linear-gradient(135deg, #3c8ef0, #2bc0e4); box-shadow: 0 22px 44px rgba(47, 125, 225, 0.32); }
  .point h2 { margin-top: 56px; font-size: 100px; }
  .card { margin-top: 56px; padding: 52px 58px; border-radius: 44px; background: #fff; box-shadow: 0 30px 70px rgba(16, 41, 74, 0.12), 0 0 0 1px rgba(16, 41, 74, 0.04); font-size: 54px; line-height: 1.5; font-weight: 500; color: var(--ink); text-wrap: pretty; }
  .card::before { content: ""; display: block; width: 88px; height: 10px; margin-bottom: 30px; border-radius: 6px; background: linear-gradient(90deg, #e2574a, #ff9a7a); }
  .ghost { right: -30px; bottom: 60px; font: 700 520px/1 "Poppins", sans-serif; color: rgba(16, 41, 74, 0.045); letter-spacing: -0.04em; }
  .peek { right: 54px; bottom: 120px; width: 190px; transform: rotate(8deg); filter: drop-shadow(0 18px 20px rgba(35, 82, 135, 0.24)); }
  .foot { left: 72px; right: 72px; bottom: 64px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: var(--muted); font-weight: 500; }
  .dots { display: flex; gap: 12px; }
  .dots b { width: 16px; height: 16px; border-radius: 50%; background: rgba(16, 41, 74, 0.15); }
  .dots b.on { width: 44px; border-radius: 10px; background: var(--blue); }
  .dark .foot { color: #b9d3ec; }
  .dark .dots b { background: rgba(255, 255, 255, 0.2); }
  .dark .dots b.on { background: #6fe2ff; }

  /* call to action */
  .cta { left: 72px; right: 72px; top: 250px; }
  .cta h2 { font-size: 100px; }
  .cta p { margin: 34px 0 0; font-size: 44px; line-height: 1.5; color: #b9d3ec; font-weight: 500; max-width: 820px; }
  .actions { display: grid; gap: 24px; margin-top: 64px; max-width: 700px; }
  .action { display: flex; align-items: center; gap: 22px; padding: 26px 34px; border-radius: 30px; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.14); font-size: 40px; font-weight: 700; }
  .action svg { width: 50px; height: 50px; flex: none; }
  .action.primary { background: linear-gradient(100deg, #2f7de1, #19b7e2); box-shadow: 0 20px 50px rgba(25, 140, 226, 0.4); }
  .wave { right: 30px; bottom: 120px; width: 300px; transform: rotate(-4deg); filter: drop-shadow(0 26px 30px rgba(0, 0, 0, 0.35)); }

  /* cover illustration (from the image desk); text stays in HTML so Chinese is always crisp */
  .art { left: 72px; right: 72px; top: 650px; bottom: 150px; border-radius: 48px; overflow: hidden; background: #e8f0f8; box-shadow: 0 30px 70px rgba(16, 41, 74, 0.18), 0 0 0 1px rgba(16, 41, 74, 0.05); }
  .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .with-art .cover-text { top: 200px; }
  .with-art .mascot { right: 34px; bottom: 96px; width: 210px; }
  .with-art .swipe { bottom: 66px; }
  .story.with-art .cover-text { top: 300px; }
  .story.with-art .art { top: 900px; bottom: 480px; }
  .story.with-art .mascot { bottom: 430px; }

  /* story extras */
  .story .cover-text { top: 330px; }
  .story .mascot { bottom: 420px; }
  .story .swipe { bottom: 440px; }
  .pill { left: 72px; bottom: 300px; display: inline-flex; align-items: center; gap: 16px; padding: 26px 40px; border-radius: 999px; background: var(--navy); color: #fff; font-size: 40px; font-weight: 700; box-shadow: 0 24px 50px rgba(16, 41, 74, 0.3); }
</style>
</head>
<body>
<div id="slide"></div>
<script>
  const ICONS = {
    save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="44" height="44"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>',
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Highlight the part after the first full-width punctuation, e.g. "讀書計畫寫不出來？<em>先回答這 3 題</em>".
  const accent = (title) => {
    const m = esc(title).match(/^(.+?[？！，：])(.+)$/);
    return m ? `<span class="seg">${m[1]}</span><span class="seg"><em>${m[2]}</em></span>` : `<span class="seg">${esc(title)}</span>`;
  };
  const brand = '<div class="brand"><img src="/brand/uniway-logo.webp" alt="" /><span class="word">UniWay</span></div>';
  const dots = (i, n) => `<div class="dots">${Array.from({ length: n }, (_, k) => `<b class="${k === i ? "on" : ""}"></b>`).join("")}</div>`;

  function fit(el, maxHeight, minSize) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    const segs = [...el.querySelectorAll(".seg")];
    const tooWide = () => segs.some((seg) => seg.scrollWidth > el.clientWidth + 1);
    // Prefer each phrase on one line; only let a phrase wrap once the font is already small.
    while ((tooWide() || el.scrollHeight > maxHeight) && size > minSize) {
      size -= 4;
      el.style.fontSize = `${size}px`;
    }
    if (tooWide()) segs.forEach((seg) => seg.classList.add("wrap"));
    while (el.scrollHeight > maxHeight && size > minSize * 0.8) {
      size -= 4;
      el.style.fontSize = `${size}px`;
    }
  }

  // The mascot always comes with its face: the picture is the body only (see mascot-face.css).
  const mascot = (cls) => `<span class="mascot-face ${cls}"><img src="/brand/suitcase.webp" alt="" /><i class="eye"></i><i class="eye r"></i><i class="cheek"></i><i class="cheek r"></i></span>`;

  window.renderSlide = async ({ slide, index, total, site, story, art }) => {
    const root = document.getElementById("slide");
    root.className = [slide.kind === "cta" ? "dark" : "", story ? "story" : "", art ? "with-art" : ""].join(" ").trim();
    const artBlock = art ? `<div class="art"><img src="${esc(art)}" alt="" /></div>` : "";
    const count = `<div class="count">${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</div>`;
    const foot = `<div class="foot"><span>${esc(site)}｜以各校官方公告為準</span>${dots(index, total)}</div>`;
    if (story) {
      root.innerHTML = `${brand}
        <div class="cover-text"><span class="kicker"><i></i>今日新貼文</span><h1>${accent(slide.title)}</h1><p>${esc(slide.body)}</p></div>
        ${artBlock}${mascot("mascot")}
        <div class="pill">${ICONS.up}到主頁看完整內容</div>`;
    } else if (slide.kind === "cover") {
      // A lone picture (the one posted with a Threads post) has nothing to swipe to.
      const single = total === 1;
      root.innerHTML = `${brand}${single ? "" : count}
        <div class="cover-text"><span class="kicker"><i></i>交換申請小筆記</span><h1>${accent(slide.title)}</h1><p>${esc(slide.body)}</p></div>
        ${artBlock}${mascot("mascot")}
        ${single ? `<div class="foot"><span>${esc(site)}｜以各校官方公告為準</span></div>` : `<div class="swipe">往左滑${ICONS.arrow}</div>`}`;
    } else if (slide.kind === "cta") {
      const [feature, ...rest] = String(slide.body || "").split("｜");
      root.innerHTML = `${brand}${count}
        <div class="cta"><h2><span class="seg">${esc(slide.title)}</span></h2><p>${esc(feature)}</p>
          <div class="actions">
            <div class="action primary">${ICONS.save}收藏這篇，申請時拿出來看</div>
            <div class="action">${ICONS.share}分享給也要交換的朋友</div>
            <div class="action">${ICONS.link}${esc(rest.join(" ") || "連結在主頁")}</div>
          </div></div>
        ${mascot("wave")}${foot}`;
    } else {
      const num = String(index).padStart(2, "0");
      root.innerHTML = `<div class="ghost">${num}</div>${brand}${count}
        <div class="point"><div class="num">${num}</div><h2><span class="seg">${esc(slide.title)}</span></h2><div class="card">${esc(slide.body)}</div></div>
        ${index % 2 ? mascot("peek") : ""}${foot}`;
    }
    await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    // The CJK font is split into unicode-range subsets; load the ones this slide needs before measuring.
    const text = root.textContent + "0123456789";
    await Promise.all(["700", "500"].map((weight) => document.fonts.load(`${weight} 64px "GenJyuuGothic"`, text)));
    const heading = root.querySelector("h1, h2");
    const room = art ? (story ? 380 : 240) : story ? 620 : 470;
    if (heading) fit(heading, slide.kind === "point" ? 250 : room, 64);
    const card = root.querySelector(".card");
    if (card) fit(card, 460, 36);
    await document.fonts.ready;
  };
</script>
</body>
</html>
