<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<title>UniWay 輪播圖文</title>
<!--
  IG 輪播（1080×1350，4:5）與限時動態（1080×1920）的版型。
  renderer.py 會呼叫 window.renderSlide({...}) 換內容，等字型載入完再截圖成 JPEG（Instagram API 只收 JPEG 圖片）。
  版面由視覺設計師 Mori 的設計（design：整組規格 spec ＋ 這一頁的 slide）決定：邊距、字級、行距、重點色、強調手法、頁碼位置，
  以及這一頁用 cover／focus／steps／compare／stat／cta 哪種版面。文字本身永遠是文案原文，設計只決定怎麼擺。
-->
<link rel="stylesheet" href="/fonts/genjyuu/GenJyuuGothic-Medium.css" />
<link rel="stylesheet" href="/fonts/genjyuu/GenJyuuGothic-Bold.css" />
<link rel="stylesheet" href="/template/mascot-face.css" />
<style>
  @font-face { font-family: "Poppins"; font-weight: 500; src: url("/fonts/poppins/Poppins-Medium.ttf") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 700; src: url("/fonts/poppins/Poppins-Bold.ttf") format("truetype"); }
  :root {
    --navy: #10294a;
    --ink: #e8f1fb;
    --muted: #b9d3ec;
    --coral: #ff5a4a;
    --paper: #0f1d30;
    /* set per set of pages from the design's spec (see applySpec) */
    --m: 80px; --title: 176px; --body: 44px; --lh: 1.5;
    --h2: calc(var(--title) * 0.7); /* inside pages: a smaller headline than the cover's */
    --a1: #2f7de1; --a2: #17b5d8; --atint: rgba(47, 125, 225, 0.22); --t1: #8cc4ff; --t2: #6fe2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  /* One look for every picture: deep navy, giant white headline, the key word on a coral block. */
  #slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    color: #fff;
    font-family: "Poppins", "GenJyuuGothic", "Noto Sans TC", sans-serif;
    background:
      radial-gradient(700px 700px at 88% 8%, rgba(47, 125, 225, 0.5), transparent 70%),
      radial-gradient(640px 640px at 0% 100%, rgba(23, 181, 216, 0.3), transparent 70%),
      radial-gradient(circle at 50% 35%, #17345a, #0f1d30 75%);
  }
  #slide.story { height: 1920px; }
  #slide > * { position: absolute; }

  .brand { left: var(--m); top: 64px; display: flex; align-items: center; gap: 16px; }
  .brand img { width: 68px; height: 68px; }
  .word { font: 700 46px/1 "Poppins", sans-serif; letter-spacing: -0.02em; background: linear-gradient(100deg, #8cc4ff, #6fe2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .count { right: var(--m); top: 80px; font: 600 32px "Poppins", sans-serif; color: var(--muted); letter-spacing: 0.04em; }

  .kicker { right: var(--m); top: 78px; padding: 12px 26px; border: 3px solid rgba(255, 255, 255, 0.45); border-radius: 999px; color: #cfe6ff; font-size: 30px; font-weight: 700; letter-spacing: 0.06em; }

  /* headlines: heavy, tight, and stroked a little so the strokes read as bold from across a phone */
  h1, h2 { margin: 0; font-weight: 700; line-height: 1.14; letter-spacing: 0; -webkit-text-stroke: 0.023em currentColor; paint-order: stroke fill; }
  h1 { font-size: var(--title); }
  h2 { font-size: var(--h2); }
  .seg { display: block; white-space: nowrap; }

  /* cover */
  .cover-text { left: var(--m); right: var(--m); top: 215px; }
  .cover-text p, .cta p { text-wrap: pretty; }
  .cover-text p { margin: 44px 0 0; max-width: 800px; font-size: calc(var(--body) * 1.18); line-height: var(--lh); color: var(--muted); font-weight: 500; }
  .mascot { right: 50px; bottom: 70px; width: 300px; filter: drop-shadow(0 26px 30px rgba(0, 0, 0, 0.35)); transform: rotate(-6deg); }
  .swipe { left: var(--m); bottom: 84px; display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 700; color: var(--t2); }
  .swipe svg { width: 54px; height: 54px; }

  /* point: the block is centred between the header and the footer */
  .point { left: var(--m); right: var(--m); top: 170px; bottom: 190px; display: flex; flex-direction: column; justify-content: center; }
  .num { display: grid; place-items: center; width: 112px; height: 112px; border-radius: 32px; color: #fff; font: 700 56px "Poppins", sans-serif; background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 22px 44px var(--atint); }
  .point h2 { margin-top: 40px; }
  .card { margin-top: 44px; padding: 48px 54px; border-radius: 44px; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12); font-size: var(--body); line-height: var(--lh); font-weight: 500; color: var(--ink); text-wrap: pretty; }
  .card::before { content: ""; display: block; width: 88px; height: 10px; margin-bottom: 30px; border-radius: 6px; background: var(--coral); }
  .ghost { right: -30px; bottom: 60px; font: 700 520px/1 "Poppins", sans-serif; color: rgba(255, 255, 255, 0.04); letter-spacing: -0.04em; }
  .peek { right: 54px; bottom: 120px; width: 190px; transform: rotate(8deg); filter: drop-shadow(0 18px 20px rgba(0, 0, 0, 0.35)); }
  .foot { left: var(--m); right: var(--m); bottom: 64px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: var(--muted); font-weight: 500; }
  .dots { display: flex; gap: 12px; }
  .dots b { width: 16px; height: 16px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); }
  .dots b.on { width: 44px; border-radius: 10px; background: var(--t2); }

  /* call to action */
  .cta { left: var(--m); right: var(--m); top: 250px; }
  .cta p { margin: 34px 0 0; font-size: var(--body); line-height: var(--lh); color: var(--muted); font-weight: 500; max-width: 820px; }
  .actions { display: grid; gap: 24px; margin-top: 64px; max-width: 700px; }
  .action { display: flex; align-items: center; gap: 22px; padding: 26px 34px; border-radius: 30px; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.14); font-size: 40px; font-weight: 700; }
  .action svg { width: 50px; height: 50px; flex: none; }
  .action.primary { background: linear-gradient(100deg, var(--a1), var(--a2)); box-shadow: 0 20px 50px rgba(25, 140, 226, 0.4); }
  .wave { right: 30px; bottom: 120px; width: 300px; transform: rotate(-4deg); filter: drop-shadow(0 26px 30px rgba(0, 0, 0, 0.35)); }

  /* cover illustration (from the image desk); text stays in HTML so Chinese is always crisp */
  .art { left: var(--m); right: var(--m); top: 700px; bottom: 150px; border-radius: 48px; overflow: hidden; background: #17345a; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .with-art .cover-text { top: 190px; }
  .with-art .cover-text p { margin-top: 28px; font-size: var(--body); }
  .with-art .mascot { right: 34px; bottom: 96px; width: 210px; }
  .with-art .swipe { bottom: 66px; }
  .story.with-art .cover-text { top: 340px; }
  .story.with-art .art { top: 940px; bottom: 480px; }
  .story.with-art .mascot { bottom: 430px; }

  /* the one way this set emphasises a word (design.spec.emphasis): a coral block (the default), the bright cyan, or bigger.
     In a headline the block is big and tilted; in the text under it, a plain highlight. */
  mark.em { background: none; color: inherit; font-weight: 700; }
  .em-chip mark.em { background: var(--coral); color: #fff; border-radius: 0.3em; padding: 0 0.28em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .em-color mark.em { color: var(--t2); }
  .em-size mark.em { font-size: 1.18em; color: var(--t2); }
  h1 mark.em, h2 mark.em { display: inline-block; -webkit-text-stroke: 0.023em currentColor; }
  .em-chip h1 mark.em, .em-chip h2 mark.em { padding: 0 0.15em 0.03em; margin: 0 -0.06em; border-radius: 0.16em; transform: rotate(-2.5deg); }
  .em-size h1 mark.em, .em-size h2 mark.em { font-size: 1.1em; }

  /* steps: 2 to 5 short steps in order */
  .steps { margin: 48px 0 0; padding: 0; list-style: none; display: grid; gap: 22px; font-size: var(--body); }
  .steps li { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 30px; padding: 26px 38px 26px 28px; border-radius: 38px; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12); font-weight: 500; line-height: var(--lh); color: var(--ink); text-wrap: pretty; }
  .steps li b { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 28px; color: #fff; font: 700 44px "Poppins", sans-serif; background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 14px 30px var(--atint); }

  /* compare: two sides next to each other */
  .versus { position: relative; margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; font-size: var(--body); }
  .versus .side { padding: 40px 38px 44px; border-radius: 42px; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12); font-weight: 500; line-height: var(--lh); color: var(--ink); text-wrap: pretty; }
  .versus .side:first-of-type { padding-right: 58px; }
  .versus .side + .side { padding-left: 58px; }
  .versus .tag { display: inline-block; margin-bottom: 22px; padding: 8px 26px; border-radius: 999px; color: #fff; font: 700 0.76em "Poppins", "GenJyuuGothic", sans-serif; background: linear-gradient(100deg, var(--a1), var(--a2)); }
  .versus .side + .side .tag { background: rgba(255, 255, 255, 0.22); }
  .versus .vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--coral); color: #fff; font: 700 30px "Poppins", sans-serif; box-shadow: 0 0 0 8px #14294a; }

  /* stat: one big number or word, with the note under it */
  .stat-hero { margin-top: 28px; font: 700 190px/1.05 "Poppins", "GenJyuuGothic", sans-serif; letter-spacing: -0.02em; white-space: nowrap; background: linear-gradient(90deg, var(--t1), var(--t2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat-hero + .card { margin-top: 40px; }

  /* the page number in the foot instead of the top right corner (design.spec.page_number) */
  .pn-foot .count { top: auto; right: var(--m); bottom: 64px; font-size: 28px; }
  .pn-foot .dots { display: none; }
  .pn-foot .mascot { bottom: 140px; }
  .pn-foot.with-art .mascot { bottom: 160px; }
  .pn-foot .swipe { bottom: 150px; }

  /* story extras */
  .story .kicker { left: var(--m); right: auto; top: 250px; }
  .story .cover-text { top: 340px; }
  .story .mascot { bottom: 420px; }
  .story .swipe { bottom: 440px; }
  .pill { left: var(--m); bottom: 300px; display: inline-flex; align-items: center; gap: 16px; padding: 26px 40px; border-radius: 999px; background: #fff; color: var(--navy); font-size: 40px; font-weight: 700; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.4); }
</style>
</head>
<body>
<div id="slide"></div>
<script>
  const ICONS = {
    save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="44" height="44"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>',
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const brand = '<div class="brand"><img src="/brand/uniway-logo.webp" alt="" /><span class="word">UniWay</span></div>';
  const dots = (i, n) => `<div class="dots">${Array.from({ length: n }, (_, k) => `<b class="${k === i ? "on" : ""}"></b>`).join("")}</div>`;

  // ---- the design: the set's shared spec, and this page's layout ----
  const SPEC = { margin: 80, title_size: 176, body_size: 44, line_height: 1.5, accent: "blue", emphasis: "chip", page_number: "top" };
  // [badge start, badge end, glow, text start, text end]: the last two are lighter, for words on the navy background
  const ACCENTS = {
    blue: ["#2f7de1", "#17b5d8", "rgba(47, 125, 225, 0.22)", "#8cc4ff", "#6fe2ff"],
    teal: ["#0f9d8a", "#22c7a9", "rgba(15, 157, 138, 0.22)", "#7be8d2", "#5ef0ff"],
    coral: ["#e2574a", "#ff9a62", "rgba(226, 87, 74, 0.22)", "#ffb199", "#ffd0a8"],
  };
  const HIGHLIGHT = /^(.+?[？！，：])(.+)$/;
  // Without a design (nobody planned this page) it still gets the plain version of its layout.
  const plainSlide = (slide) => {
    const m = HIGHLIGHT.exec(slide.title);
    const layout = slide.kind === "cover" ? "cover" : slide.kind === "cta" ? "cta" : "focus";
    return { layout, title_lines: [slide.title], emphasis: layout !== "cta" && m && m[2].length >= 2 && m[2].length <= 14 ? [m[2]] : [], items: [], labels: [] };
  };

  function applySpec(root, spec) {
    const [a1, a2, tint, t1, t2] = ACCENTS[spec.accent] || ACCENTS.blue;
    const set = (name, value) => root.style.setProperty(name, value);
    set("--m", `${spec.margin}px`); set("--title", `${spec.title_size}px`); set("--body", `${spec.body_size}px`); set("--lh", String(spec.line_height));
    set("--a1", a1); set("--a2", a2); set("--atint", tint); set("--t1", t1); set("--t2", t2);
  }

  // Spans [at, end) of the emphasised words in a text (each word once, the first place it appears, no overlaps).
  function spansOf(text, words) {
    const hits = [];
    for (const word of words) {
      const at = word ? text.indexOf(word) : -1;
      if (at >= 0 && !hits.some((h) => at < h.end && at + word.length > h.at)) hits.push({ at, end: at + word.length });
    }
    return hits.sort((a, b) => a.at - b.at);
  }
  // Text with the given spans wrapped; everything is escaped.
  function markSpans(text, hits) {
    let out = "", cursor = 0;
    for (const h of hits) {
      out += esc(text.slice(cursor, h.at)) + `<mark class="em">${esc(text.slice(h.at, h.end))}</mark>`;
      cursor = h.end;
    }
    return out + esc(text.slice(cursor));
  }
  const marked = (text, words) => markSpans(String(text ?? ""), spansOf(String(text ?? ""), words));
  // A headline's lines with its emphasised words marked, even where a word runs over a line break (each line gets its piece).
  function titleHTML(lines, words) {
    const hits = spansOf(lines.join(""), words);
    let offset = 0;
    return lines.map((line) => {
      const start = offset;
      offset += line.length;
      const here = hits.map((h) => ({ at: Math.max(h.at, start) - start, end: Math.min(h.end, offset) - start })).filter((h) => h.end > h.at);
      return `<span class="seg">${markSpans(line, here)}</span>`;
    }).join("");
  }
  // Words that are not in the title are marked in the text under it.
  const wordsIn = (lines, words) => words.filter((w) => lines.join("").includes(w));
  const wordsNotIn = (lines, words) => words.filter((w) => !lines.join("").includes(w));

  // Breaks a headline into lines for the width there is: an emphasised word stays whole when it fits on a line, a line never
  // starts with a closing mark, the lines come out about even (no last line of one lonely character), and nothing is left
  // out or reordered.
  function autoLines(text, perLine, words) {
    const total = [...text].length;
    if (total <= Math.max(3, perLine)) return [text];
    const pack = (limit) => {
      const chars = [...text];
      const spans = spansOf(text, words)
        .map((h) => ({ at: [...text.slice(0, h.at)].length, end: [...text.slice(0, h.end)].length }))
        .filter((h) => h.end - h.at <= limit);
      const atoms = [];
      for (let i = 0; i < chars.length;) {
        const span = spans.find((h) => h.at === i);
        if (span) { atoms.push(chars.slice(span.at, span.end).join("")); i = span.end; } else { atoms.push(chars[i]); i += 1; }
      }
      const closing = /^[，。、；：？！）」』…～~]$/;
      const lines = [];
      let line = "";
      for (const atom of atoms) {
        if (line && [...line].length + [...atom].length > limit) {
          if (closing.test(atom)) { const kept = [...line]; const carried = kept.pop(); lines.push(kept.join("")); line = carried; } else { lines.push(line); line = ""; }
        }
        line += atom;
      }
      if (line) lines.push(line);
      return lines;
    };
    perLine = Math.max(3, perLine);
    const lines = pack(perLine);
    const even = Math.max(3, Math.ceil(total / lines.length));
    if (even < perLine) {
      const evened = pack(even);
      if (evened.length === lines.length) return evened;
    }
    return lines;
  }
  // Sets a headline as big as it can be: its own line breaks when the design gave some, otherwise the lines that fit, at most
  // `maxLines` of them and no taller than `room`; the type only gets smaller when it has to.
  function layoutTitle(el, lines, words, { maxLines, room, min }) {
    const text = lines.join("");
    const width = el.clientWidth;
    let size = parseFloat(getComputedStyle(el).fontSize);
    // A short headline that fits on one line a little smaller reads better as one line than as a line and a stray character.
    const oneLine = Math.floor(width / [...text].length);
    if (lines.length === 1 && maxLines > 1 && oneLine >= size * 0.9 && oneLine < size) size = oneLine;
    for (;;) {
      el.style.fontSize = `${size}px`;
      const use = lines.length > 1 ? lines : autoLines(text, Math.floor(width / size), words);
      el.innerHTML = titleHTML(use, words);
      const wide = [...el.querySelectorAll(".seg")].some((seg) => seg.scrollWidth > width + 1);
      const limit = typeof room === "function" ? room(size) : room;
      if ((!wide && use.length <= maxLines && el.scrollHeight <= limit) || size <= min) break;
      size -= 4;
    }
  }

  function fit(el, maxHeight, minSize) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    const segs = [...el.querySelectorAll(".seg")];
    const tooWide = () => segs.some((seg) => seg.scrollWidth > el.clientWidth + 1);
    // Prefer each phrase on one line; only let a phrase wrap once the font is already small.
    while ((tooWide() || el.scrollHeight > maxHeight) && size > minSize) {
      size -= 4;
      el.style.fontSize = `${size}px`;
    }
    if (tooWide()) segs.forEach((seg) => seg.classList.add("wrap"));
    while (el.scrollHeight > maxHeight && size > minSize * 0.8) {
      size -= 4;
      el.style.fontSize = `${size}px`;
    }
  }
  // A line that must stay on one row (the big number): shrink until it fits the width.
  function fitWidth(el, minSize) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && size > minSize) {
      size -= 6;
      el.style.fontSize = `${size}px`;
    }
  }

  // The mascot always comes with its face: the picture is the body only (see mascot-face.css).
  const mascot = (cls) => `<span class="mascot-face ${cls}"><img src="/brand/suitcase.webp" alt="" /><i class="eye"></i><i class="eye r"></i><i class="cheek"></i><i class="cheek r"></i></span>`;

  window.renderSlide = async ({ slide, index, total, site, story, art, design }) => {
    const root = document.getElementById("slide");
    const spec = { ...SPEC, ...(design?.spec || {}) };
    const plan = { ...plainSlide(slide), ...(design?.slide || {}) };
    const lines = plan.title_lines?.length ? plan.title_lines : [slide.title];
    const layout = slide.kind === "cta" ? "cta" : slide.kind === "cover" ? "cover" : plan.layout;
    const words = plan.emphasis || [];
    root.removeAttribute("style");
    root.className = [story ? "story" : "", art ? "with-art" : "", `em-${spec.emphasis}`, spec.page_number === "foot" ? "pn-foot" : ""].join(" ").trim();
    applySpec(root, spec);
    const artBlock = art ? `<div class="art"><img src="${esc(art)}" alt="" /></div>` : "";
    const count = `<div class="count">${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</div>`;
    const foot = `<div class="foot"><span>${esc(site)}｜以各校官方公告為準</span>${dots(index, total)}</div>`;
    const sub = (text) => marked(text, wordsNotIn(lines, words));
    if (story) {
      root.innerHTML = `${brand}<div class="kicker">今日新貼文</div>
        <div class="cover-text"><h1>${titleHTML(lines, wordsIn(lines, words))}</h1><p>${sub(slide.body)}</p></div>
        ${artBlock}${mascot("mascot")}
        <div class="pill">${ICONS.up}到主頁看完整內容</div>`;
    } else if (layout === "cover") {
      // A lone picture (the one posted with a Threads post) has nothing to swipe to.
      const single = total === 1;
      root.innerHTML = `${brand}<div class="kicker">交換申請小筆記</div>
        <div class="cover-text"><h1>${titleHTML(lines, wordsIn(lines, words))}</h1><p>${sub(slide.body)}</p></div>
        ${artBlock}${mascot("mascot")}
        ${single ? `<div class="foot"><span>${esc(site)}｜以各校官方公告為準</span></div>` : `<div class="swipe">往左滑${ICONS.arrow}</div>`}`;
    } else if (layout === "cta") {
      const [feature, ...rest] = String(slide.body || "").split("｜");
      root.innerHTML = `${brand}${count}
        <div class="cta"><h2>${titleHTML(lines, [])}</h2><p>${esc(feature)}</p>
          <div class="actions">
            <div class="action primary">${ICONS.save}收藏這篇，申請時拿出來看</div>
            <div class="action">${ICONS.share}分享給也要交換的朋友</div>
            <div class="action">${ICONS.link}${esc(rest.join(" ") || "連結在主頁")}</div>
          </div></div>
        ${mascot("wave")}${foot}`;
    } else {
      const num = String(index).padStart(2, "0");
      const heading = `<h2>${titleHTML(lines, wordsIn(lines, words))}</h2>`;
      let body;
      if (layout === "steps") {
        body = `${heading}<ol class="steps">${plan.items.map((item, i) => `<li><b>${i + 1}</b><span>${sub(item)}</span></li>`).join("")}</ol>`;
      } else if (layout === "compare") {
        const [a, b] = plan.labels?.length === 2 ? plan.labels : ["A", "B"];
        const side = (tag, text) => `<div class="side"><span class="tag">${esc(tag)}</span><div>${sub(text)}</div></div>`;
        body = `${heading}<div class="versus">${side(a, plan.items[0])}${side(b, plan.items[1])}<span class="vs">VS</span></div>`;
      } else if (layout === "stat") {
        body = `${heading}<div class="stat-hero">${esc(plan.items[0])}</div><div class="card">${sub(slide.body)}</div>`;
      } else {
        body = `<div class="num">${num}</div>${heading}<div class="card">${sub(slide.body)}</div>`;
      }
      root.innerHTML = `<div class="ghost">${num}</div>${brand}${count}<div class="point">${body}</div>
        ${index % 2 && !["steps", "compare"].includes(layout) ? mascot("peek") : ""}${foot}`;
    }
    await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    // The CJK font is split into unicode-range subsets; load the ones this slide needs before measuring.
    const text = root.textContent + "0123456789";
    await Promise.all(["700", "500"].map((weight) => document.fonts.load(`${weight} 64px "GenJyuuGothic"`, text)));
    const heading = root.querySelector("h1, h2");
    if (heading) {
      const titleWords = wordsIn(lines, words);
      if (layout === "cover") {
        // The cover headline is the picture: up to three lines at full size; when an illustration shares the page it gets less
        // height, so the type is a little smaller (or the lines fewer) rather than the picture smaller.
        layoutTitle(heading, lines, titleWords, { maxLines: 3, room: art ? (story ? 440 : 400) : story ? 760 : 660, min: 72 });
      } else {
        // a little more than two lines tall: a tilted block on the key word makes its line a bit taller than the others
        layoutTitle(heading, lines, titleWords, { maxLines: 2, room: (size) => 2 * size * 1.4, min: 64 });
      }
    }
    const card = root.querySelector(".card");
    if (card) fit(card, layout === "stat" ? 330 : 460, 36);
    const list = root.querySelector(".steps, .versus");
    if (list) fit(list, root.querySelector(".steps") ? 700 : 560, 30);
    const hero = root.querySelector(".stat-hero");
    if (hero) fitWidth(hero, 80);
    await document.fonts.ready;
  };
</script>
</body>
</html>
