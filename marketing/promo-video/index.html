const TAB_SPOTS = [
  [140, 110, -6], [760, 70, 4], [1360, 120, -3], [80, 250, 3], [1480, 250, 5],
  [180, 720, 4], [700, 820, -4], [820, 640, -5], [1100, 910, 3], [110, 600, -3],
];

// Text the mascot says, [from, to, text].
const LINES = [
  [2.8, 5.0, "到底要先看哪一份……"],
  [7.9, 10.0, "全部交給我！"],
  [11.2, 16.6, "先選母校，只看你能申請的！"],
  [17.8, 22.2, "全世界的合作校，都在地圖上"],
  [23.6, 29.0, "截止日？我幫你倒數！"],

  [37.2, 42.0, "出發前，先算好預算"],
  [43.2, 48.0, "學長姐的經驗，都在這裡"],

// Where the mascot stands: [time, x (centre), y (feet), width]; it travels between consecutive entries.
const MASCOT_PATH = [
  [0.0, 1610, 1260, 230], [2.0, 1610, 1260, 230], [2.7, 1610, 1030, 230],
  [5.2, 1610, 1030, 230], [6.2, 960, 890, 300], [7.3, 960, 890, 300], [8.0, 1640, 900, 190],
  [10.0, 1640, 900, 190], [10.8, 215, 1030, 170],
  [17.0, 215, 1030, 170], [17.8, 1720, 1020, 190],
  [22.4, 1720, 1020, 190], [23.2, 215, 1030, 170],
  [58.0, 215, 1030, 170], [59.0, 560, 900, 330],
];
const HOPS = [2.75, 6.25, 8.0, 10.8, 17.8, 23.2, 29.1, 36.1, 42.1, 48.3, 53.3, 59.0, 61.6, 63.0];
const SPINS = [7.4, 62.2];
const DURATION = 65;

// ---------------------------------------------------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------------------------------------------------
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeBack = (x) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const CHECK = '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#e3f3fb"/><path d="m11 18.5 4.5 4.5 9.5-10" fill="none" stroke="#2f7de1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

// Fades a scene in over its first `fade` seconds and out over its last; returns local time.
function sceneWindow(el, t, start, end, fade = 0.5) {
  const visible = t >= start && t <= end;
  el.style.visibility = visible ? "visible" : "hidden";
  if (!visible) return -1;
  el.style.opacity = Math.min(prog(t, start, start + fade), 1 - prog(t, end - fade, end));
  return t - start;
}

// Slides an element up into place starting at `at` (local seconds).
function reveal(el, lt, at, dur = 0.7, dy = 40, dx = 0) {
  const k = easeOut(prog(lt, at, at + dur));
  el.style.opacity = k;
  el.style.transform = `translate(${(1 - k) * dx}px, ${(1 - k) * dy}px)`;
}

// ---------------------------------------------------------------------------------------------------------------------
// Build the DOM that comes from data
// ---------------------------------------------------------------------------------------------------------------------
const stage = $("#stage");

HOOK_TABS.forEach(([ext, color, name], i) => {

});

for (const f of FEATURES) {

    </div>
    ${f.float ? `<div class="float fl" style="left:${f.float.x}px;top:${f.float.y}px;width:${f.float.w}px"><img src="assets/${f.float.src}" alt="" /></div>` : ""}
    ${f.float && f.float.tag ? `<div class="tag" style="left:${f.float.x - 40}px;top:${f.float.y - 34}px">${f.float.tag}</div>` : ""}`;
  // Feature scenes sit under the later scenes in paint order; insert before S9 so the stacking stays tidy.

}

$("#s4 .kicker b").innerHTML = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>';

$("#s9 .badges").innerHTML = BADGES.map(([label, path]) =>

// Arcs from Taiwan on the world map (coordinates are in the cropped map picture).
const TW = [767, 208];
const DESTS = [[460, 120], [125, 130], [240, 145], [805, 170], [852, 383], [720, 285], [140, 223], [520, 110]];

// ---------------------------------------------------------------------------------------------------------------------
// Render one frame
// ---------------------------------------------------------------------------------------------------------------------
function renderBackground(t) {
  $(".blob.b1").style.transform = `translate(${Math.sin(t * 0.21) * 90}px, ${Math.cos(t * 0.17) * 60}px)`;
  $(".blob.b2").style.transform = `translate(${Math.cos(t * 0.19) * 100}px, ${Math.sin(t * 0.23) * 70}px)`;
  $(".blob.b3").style.transform = `translate(${Math.sin(t * 0.15 + 1) * 120}px, ${Math.cos(t * 0.2) * 50}px)`;
  $(".dark").style.opacity = Math.min(prog(t, 16.6, 17.4), 1 - prog(t, 22.4, 23.2));
}

function renderHook(t) {
  const sec = $("#s1");
  const lt = sceneWindow(sec, t, 0, 6.6, 0.01);
  if (lt < 0) return;
  // Headline appears, and the number of open tabs ticks up.
  reveal($(".head", sec), lt, 0.5, 0.8, 50);
  $(".count", sec).textContent = Math.round(lerp(1, 30, easeOut(prog(lt, 0.6, 2.2))));
  const headOut = prog(lt, 5.0, 5.5);
  $(".head", sec).style.opacity = Math.min(easeOut(prog(lt, 0.5, 1.3)), 1 - headOut);

  // Tabs pop in one by one and wobble; from 5.3 s they fly into the suitcase.
  const target = [960, 760];
  sec.querySelectorAll(".tab").forEach((el, i) => {
    const [x, y, r] = TAB_SPOTS[i];
    const pop = easeBack(prog(lt, 0.3 + i * 0.16, 0.75 + i * 0.16));
    const wob = Math.sin(lt * 3 + i * 1.7) * 2.2 * (1 + prog(lt, 2, 4.5) * 2);
    const fly = easeInOut(prog(lt, 5.3 + i * 0.05, 6.4 + i * 0.05));
    const cx = lerp(x, target[0] - 150, fly), cy = lerp(y + Math.sin(lt * 1.3 + i) * 8, target[1] - 30, fly);
    const s = lerp(pop, 0.1, fly);
    el.style.opacity = clamp(pop * 1.4) * (1 - prog(fly, 0.85, 1));
    el.style.transform = `translate(${cx}px, ${cy}px) rotate(${r + wob + fly * 160}deg) scale(${Math.max(s, 0)})`;
  });
}

function renderBrand(t) {
  const sec = $("#s2");
  const lt = sceneWindow(sec, t, 6.4, 10.4, 0.3);
  if (lt < 0) return;
  const k = easeBack(prog(lt, 1.1, 1.9));
  const brand = $(".brand", sec);
  brand.style.opacity = clamp(prog(lt, 1.1, 1.5));
  brand.style.transform = `scale(${lerp(0.6, 1, k)})`;
  reveal($(".slogan", sec), lt, 1.8, 0.8, 40);
  reveal($(".sub", sec), lt, 2.3, 0.8, 30);
}

function renderFeature(f, t) {
  const sec = document.getElementById(f.id);
  const lt = sceneWindow(sec, t, f.start, f.end, 0.45);
  if (lt < 0) return;
  const out = prog(t, f.end - 0.45, f.end);
  const text = $(".text", sec);
  reveal($(".kicker", text), lt, 0.15, 0.6, 30);
  reveal($("h2", text), lt, 0.3, 0.7, 40);
  text.querySelectorAll("li").forEach((li, i) => reveal(li, lt, 0.9 + i * 0.35, 0.6, 0, -40));

  const browser = $(".browser", sec);
  const bk = easeOut(prog(lt, 0.2, 1.1));
  browser.style.opacity = bk;
  browser.style.transform = `translate(${(1 - bk) * 120 + out * -60}px, 0) perspective(2400px) rotateY(${(1 - bk) * -12}deg)`;

  // Camera: a slow push, then a zoom onto the feature, with a highlight around it.
  const [fx, fy, fw, fh] = f.focus;
  const k = 1080 / 1920;
  const cx = (fx + fw / 2) * k, cy = (fy + fh / 2) * k;
  const z = easeInOut(prog(lt, f.focusAt, f.focusAt + 1.2));
  const s = lerp(1 + lt * 0.006, f.zoom, z);
  const tx = clamp(540 - s * cx, 1080 - s * 1080, 0) * z;
  const ty = clamp(337.5 - s * cy, 675 - s * 675, 0) * z;
  $(".cam", sec).style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  const hl = $(".hl", sec);
  const hk = prog(lt, f.focusAt + 1.0, f.focusAt + 1.4);
  hl.style.opacity = hk * (0.75 + 0.25 * Math.sin(lt * 6));
  hl.style.borderWidth = `${4 / s}px`;

  const fl = $(".fl", sec);
  if (fl) {
    const fk = easeBack(prog(lt, f.float.at, f.float.at + 0.7));
    fl.style.opacity = clamp(prog(lt, f.float.at, f.float.at + 0.3));
    fl.style.transform = `translateY(${(1 - fk) * 60 + Math.sin(lt * 1.6) * 6}px) scale(${lerp(0.85, 1, fk)})`;
  }
  const tag = $(".tag", sec);
  if (tag) {
    const tk = easeBack(prog(lt, f.float.at + 0.5, f.float.at + 1.0));
    tag.style.opacity = clamp(prog(lt, f.float.at + 0.5, f.float.at + 0.7));
    tag.style.transform = `scale(${tk})`;
    tag.style.transformOrigin = "0 100%";
  }
}

function renderMap(t) {
  const sec = $("#s4");
  const lt = sceneWindow(sec, t, 17.0, 22.8, 0.5);
  if (lt < 0) return;
  reveal($(".kicker", sec), lt, 0.3, 0.6, 30);
  reveal($("h2", sec), lt, 0.45, 0.8, 40);
  reveal($(".stats", sec), lt, 1.0, 0.7, 30);
  sec.querySelectorAll("[data-count]").forEach((el) => {
    const n = Math.round(STATS[el.dataset.count] * easeOut(prog(lt, 1.1, 3.0)));
    el.textContent = n.toLocaleString("en-US");
  });
  const map = $(".map", sec);
  const mk = easeOut(prog(lt, 0.2, 1.4));
  map.style.opacity = mk;
  map.style.transform = `scale(${lerp(0.92, 1.0, mk) + lt * 0.006})`;
  sec.querySelectorAll(".arc").forEach((arc, i) => {
    const a = easeInOut(prog(lt, 1.4 + i * 0.22, 2.3 + i * 0.22));
    arc.setAttribute("stroke-dashoffset", 1 - a);
    arc.setAttribute("opacity", 0.9);
  });
  sec.querySelectorAll(".dst").forEach((d, i) => {
    const a = prog(lt, 2.2 + i * 0.22, 2.5 + i * 0.22);
    d.setAttribute("opacity", a * (0.7 + 0.3 * Math.sin(lt * 5 + i)));
    d.setAttribute("r", 6 + 6 * easeBack(a));
  });
  const ring = $(".ring", sec);
  const rp = (lt * 0.9) % 1;
  ring.setAttribute("r", 10 + rp * 34);
  ring.setAttribute("opacity", 1 - rp);
}

function renderTrust(t) {
  const sec = $("#s9");
  const lt = sceneWindow(sec, t, 48.0, 53.6, 0.45);
  if (lt < 0) return;
  reveal($(".head h2", sec), lt, 0.2, 0.7, 40);
  reveal($(".head p", sec), lt, 0.5, 0.7, 30);
  const src = $(".src", sec);
  const sk = easeOut(prog(lt, 0.8, 1.6));
  src.style.opacity = sk;
  src.style.transform = `translateY(${(1 - sk) * 60}px) scale(${lerp(0.96, 1, sk)})`;
  $(".sweep", sec).style.left = `${lerp(-300, 1700, prog(lt, 1.6, 2.8))}px`;
  sec.querySelectorAll(".badge").forEach((b, i) => {
    const k = easeBack(prog(lt, 2.2 + i * 0.25, 2.8 + i * 0.25));
    b.style.opacity = clamp(prog(lt, 2.2 + i * 0.25, 2.5 + i * 0.25));
    b.style.transform = `translateY(${(1 - k) * 40}px) scale(${lerp(0.8, 1, k)})`;
  });
}

function renderSchools(t) {
  const sec = $("#s10");
  const lt = sceneWindow(sec, t, 53.2, 58.4, 0.45);
  if (lt < 0) return;
  reveal($(".head h2", sec), lt, 0.2, 0.7, 40);
  reveal($(".head p", sec), lt, 0.5, 0.7, 30);
  const chips = sec.querySelectorAll(".chip");
  chips.forEach((c, i) => {
    const last = i === chips.length - 1;
    const at = last ? 2.6 : 0.8 + i * 0.07;
    const k = easeBack(prog(lt, at, at + 0.45));
    const pulse = last ? 1 + 0.04 * Math.sin(Math.max(0, lt - 3.2) * 6) : 1;
    c.style.opacity = clamp(prog(lt, at, at + 0.2));
    c.style.transform = `translateY(${(1 - k) * 30}px) scale(${lerp(0.6, 1, k) * pulse})`;
  });
}

function renderEnd(t) {
  const sec = $("#s11");
  const lt = sceneWindow(sec, t, 58.0, DURATION, 0.5);
  if (lt < 0) return;
  const lock = $(".lockup", sec);
  const row = $(".row", lock);
  const rk = easeBack(prog(lt, 0.7, 1.5));
  row.style.opacity = clamp(prog(lt, 0.7, 1.0));
  row.style.transform = `scale(${lerp(0.7, 1, rk)})`;
  row.style.transformOrigin = "0 50%";
  reveal($(".line", lock), lt, 1.3, 0.8, 40);
  reveal($(".sub", lock), lt, 1.7, 0.8, 30);
  const cta = $(".cta", lock);
  const ck = easeBack(prog(lt, 2.2, 2.9));
  cta.style.opacity = clamp(prog(lt, 2.2, 2.5));
  cta.style.transform = `scale(${lerp(0.7, 1, ck) * (1 + 0.025 * Math.sin(Math.max(0, lt - 3) * 4))})`;
  cta.style.transformOrigin = "0 50%";
  reveal($(".note", lock), lt, 2.8, 0.8, 20);
  // Fade out at the very end.
  sec.style.opacity = Math.min(1, 1 - prog(t, DURATION - 0.6, DURATION));
}

function renderMascot(t) {
  // Position along the path.
  let p = MASCOT_PATH[0];
  let x = p[1], y = p[2], w = p[3];
  for (let i = 0; i < MASCOT_PATH.length - 1; i++) {
    const a = MASCOT_PATH[i], b = MASCOT_PATH[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const k = easeInOut(prog(t, a[0], b[0]));
      x = lerp(a[1], b[1], k); y = lerp(a[2], b[2], k); w = lerp(a[3], b[3], k);
      break;
    }
    if (t > b[0]) { x = b[1]; y = b[2]; w = b[3]; }
  }
  // At the very end it leaves with the end card.
  const leave = prog(t, DURATION - 0.6, DURATION);

  // Hops: squash, jump, land.
  let hop = 0, sx = 1, sy = 1;
  for (const h of HOPS) {
    const k = (t - h) / 0.62;
    if (k < -0.15 || k > 1.2) continue;
    if (k < 0) { const q = (k + 0.15) / 0.15; sx = 1 + 0.06 * q; sy = 1 - 0.07 * q; }
    else if (k <= 1) { hop = Math.sin(Math.PI * k); sx = 1 - 0.03 * hop; sy = 1 + 0.05 * hop; }
    else { const q = Math.sin(Math.PI * (k - 1) / 0.2); sx = 1 + 0.05 * q; sy = 1 - 0.06 * q; }
  }
  let spin = 0;
  for (const s of SPINS) spin += 360 * easeInOut(prog(t, s, s + 0.8));
  const bob = Math.sin(t * 2.4) * 0.012;
  const tilt = Math.sin(t * 1.3) * 3;
  const h = w * 460 / 384;
  const el = $("#mascot");
  el.style.width = `${w}px`;
  el.style.opacity = 1 - leave;
  el.style.transform = `translate(${x - w / 2}px, ${y - h - hop * h * 0.22 - bob * h}px)`;
  $(".body", el).style.transform = `perspective(900px) rotateY(${spin}deg) rotate(${tilt}deg) scale(${sx}, ${sy})`;
  $(".shadow", el).style.transform = `translateY(${hop * h * 0.22 + bob * h}px) scaleX(${1 - hop * 0.35})`;
  $(".shadow", el).style.opacity = 1 - hop * 0.45;

  // Eyes: blink every ~3 s, look around, wink at the end; worried look while the tabs pile up.
  const bt = (t + 0.7) % 3.1;
  const blink = bt < 0.16 ? Math.abs(Math.cos((bt / 0.16) * Math.PI)) : 1;
  const wink = 1 - 0.92 * Math.sin(Math.PI * prog(t, 61.0, 61.8));
  el.style.setProperty("--open", Math.max(0.08, blink));
  el.style.setProperty("--open-r", Math.max(0.08, Math.min(blink, wink)));
  const worried = 1 - prog(t, 5.2, 5.8);
  const lookX = t < 6 ? Math.sin(t * 4.2) * 5 * worried : Math.sin(t * 0.9) * 2.5 + (t > 10.8 && t < 58 && !(t > 17.4 && t < 22.8) ? 2.5 : -1.5);
  const lookY = t < 6 ? -1.5 * worried : Math.sin(t * 0.7) * 1.2;
  $(".eyes", el).style.transform = `translate(${lookX}%, ${lookY}%)`;
  const happy = prog(t, 7.6, 8.0) * (1 - prog(t, 10.0, 10.4)) + prog(t, 59.2, 59.8);
  el.querySelectorAll(".cheek").forEach((c) => (c.style.opacity = clamp(happy)));

  // Speech bubble, placed up and to the right of the mascot.
  const bubble = $("#bubble");
  const line = LINES.find(([a, b]) => t >= a && t <= b);
  if (!line) { bubble.style.opacity = 0; return; }
  const [a, b, text] = line;
  if (bubble.textContent !== text) bubble.textContent = text;
  const k = easeBack(prog(t, a, a + 0.35));
  const o = 1 - prog(t, b - 0.25, b);
  const bw = bubble.offsetWidth;
  let bx = x + w * 0.28, by = y - h * 1.02 - hop * h * 0.22 - 92;
  if (bx + bw > 1880) { bx = x - w * 0.28 - bw; bubble.style.transformOrigin = "100% 100%"; }
  else bubble.style.transformOrigin = "0% 100%";
  bubble.classList.toggle("flip", bx < x);
  bubble.style.opacity = clamp(prog(t, a, a + 0.15)) * o;
  bubble.style.transform = `translate(${bx}px, ${by}px) scale(${lerp(0.4, 1, k)})`;
}

function render(t) {
  renderBackground(t);
  renderHook(t);
  renderBrand(t);
  FEATURES.forEach((f) => renderFeature(f, t));
  renderMap(t);
  renderTrust(t);
  renderSchools(t);
  renderEnd(t);
  renderMascot(t);
}
window.render = render;
window.DURATION = DURATION;

// The flipped bubble keeps its tail under the mascot's side.
const style = document.createElement("style");
style.textContent = "#bubble.flip::after{left:auto;right:26px}";
document.head.appendChild(style);

window.ready = (async () => {
  await Promise.all([...document.images].map((img) => img.decode().catch(() => {})));
  // Run once through the whole timeline so every glyph is laid out and its font subset is fetched.
  for (let t = 0; t <= DURATION; t += 0.5) render(t);
  await document.fonts.ready;
  render(0);
  return true;
})();

// Live preview when opened in a browser (render.mjs adds ?capture and drives render() itself).
if (!location.search.includes("capture")) {
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s})`; stage.style.marginRight = `${1920 * (s - 1)}px`; stage.style.marginBottom = `${1080 * (s - 1)}px`; };
  addEventListener("resize", fit); fit();
  const audio = new Audio("build/music.wav");
  window.ready.then(() => {
    let t0 = null;
    const tick = (now) => { if (t0 === null) t0 = now; render(((now - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    addEventListener("click", () => { audio.currentTime = 0; audio.play().catch(() => {}); t0 = null; });
  });
} else {
  document.body.classList.add("capture");
}
</script>
