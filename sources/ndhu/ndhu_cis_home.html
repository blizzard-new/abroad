<script>
  (function () {
    var muted = true;
    var btn = document.getElementById('ci-mute');
    var yt = document.getElementById('ci-yt');
    function cmd(func, args) {
      yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [] }), '*');
    }
    btn.addEventListener('click', function () {
      muted = !muted;
      if (muted) { cmd('mute'); } else { cmd('unMute'); cmd('setVolume', [100]); }
      btn.textContent = muted ? '🔊 播放聲音' : '🔇 關閉聲音';
      btn.setAttribute('aria-pressed', String(!muted));
    });
  })();
