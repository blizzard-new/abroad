[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniway-mcp-server"
version = "1.0.0"
description = "Lightweight Model Context Protocol (MCP) server for UniWay Taiwan Student Exchange public data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
uniway-mcp = "uniway_mcp_server:main"

[tool.setuptools]
py-modules = ["uniway_mcp_server"]
