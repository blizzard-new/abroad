# Isolated capacity stack. Use only its generated .env.
name: uniway-capacity
services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run deploy/capacity/Stage.ps1 -Action Setup first}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?run deploy/capacity/Stage.ps1 -Action Setup first}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
    volumes:
    - db-data:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    cpus: 1.0
    mem_limit: 2g
  rest:
    image: postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_ADMIN_SERVER_PORT: '3001'
      PGRST_ADMIN_SERVER_HOST: localhost
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
    healthcheck:
      test:
      - CMD
      - postgrest
      - --ready
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    cpus: 0.5
    mem_limit: 512m
  storage:
    image: supabase/storage-api:v1.60.4@sha256:c8eb9858eafec891a97c27125470aaad54703c3f4eb4d55ca7f1bf6c6411febf
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${DB_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://storage:5000
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: '52428800'
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: uniway-storage
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: uniway
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
    volumes:
    - storage-data:/var/lib/storage
    healthcheck:
      test:
      - CMD
      - wget
      - -Y
      - 'off'
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:5000/status
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    cpus: 0.25
    mem_limit: 512m
  gateway:
    image: caddy:2-alpine
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    depends_on:
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
    - ../selfhost/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    - gateway-data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -Y
      - 'off'
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:8000/health
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
    cpus: 0.25
    mem_limit: 128m
  ca-export:
    image: alpine:3
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
    - gateway-data:/data:ro
    - ca-public:/out
    command:
    - sh
    - -c
    - cp /data/caddy/pki/authorities/local/root.crt /out/root.crt && chmod 644 /out/root.crt
    environment:
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
  app:
    build:
      context: ../..
      dockerfile: deploy/capacity/Dockerfile
    image: uniway-capacity-app:local
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    depends_on:
      gateway:
        condition: service_healthy
      ca-export:
        condition: service_completed_successfully
    command:
    - uvicorn
    - capacity_app:app
    - --app-dir
    - /opt/capacity
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --workers
    - ${CAPACITY_WORKERS:-1}
    - --no-proxy-headers
    volumes:
    - ./:/opt/capacity:ro
    - ca-public:/ca-public:ro
    - ../selfhost/tools:/opt/selfhost:ro
    environment:
      EXCHANGE_ENVIRONMENT: production
      EXCHANGE_ACCOUNT_REPOSITORY: supabase
      EXCHANGE_VAULT_BACKEND: supabase
      EXCHANGE_FORM_DRAFT_BACKEND: supabase
      EXCHANGE_EMAIL_VERIFICATION_BACKEND: disabled
      EXCHANGE_CLIENT_IP_HEADER: X-Client-IP
      EXCHANGE_WARM_CACHES: '0'
      EXCHANGE_ACCOUNT_READ_CACHE_SECONDS: '0'
      EXCHANGE_HOSTING_PROFILE: selfhost
      EXCHANGE_SUPABASE_URL: https://gateway
      INTERNAL_CA_FILE: /ca-public/root.crt
      REQUESTS_CA_BUNDLE: /tmp/ca-bundle.pem
      SSL_CERT_FILE: /tmp/ca-bundle.pem
      EXCHANGE_SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
      EXCHANGE_VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      EXCHANGE_EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET}
      EXCHANGE_PUBLIC_BASE_URL: http://localhost:18000
      EXCHANGE_CAPACITY_RUN_ID: ${CAPACITY_RUN_ID:?run Stage.ps1 Setup first}
      EXCHANGE_WORKER_THREADS: ${CAPACITY_THREADS:-16}
      EXCHANGE_CATALOGUE_CONCURRENCY: ${CAPACITY_CATALOGUES:-2}
      EXCHANGE_ANALYTICS: 'off'
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
    cpus: 3.0
    mem_limit: 6g
  web:
    image: caddy:2-alpine
    restart: 'no'
    ports:
    - 127.0.0.1:18000:8080
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_started
    cpus: 0.5
    mem_limit: 256m
    security_opt:
    - no-new-privileges:true
    environment:
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
  seed:
    image: uniway-capacity-app:local
    profiles:
    - tools
    user: ${CAPACITY_UID:-1000}:${CAPACITY_GID:-1000}
    environment:
      EXCHANGE_ENVIRONMENT: production
      EXCHANGE_ACCOUNT_REPOSITORY: supabase
      EXCHANGE_VAULT_BACKEND: supabase
      EXCHANGE_FORM_DRAFT_BACKEND: supabase
      EXCHANGE_EMAIL_VERIFICATION_BACKEND: disabled
      EXCHANGE_CLIENT_IP_HEADER: X-Client-IP
      EXCHANGE_WARM_CACHES: '0'
      EXCHANGE_ACCOUNT_READ_CACHE_SECONDS: '0'
      EXCHANGE_HOSTING_PROFILE: selfhost
      EXCHANGE_SUPABASE_URL: https://gateway
      INTERNAL_CA_FILE: /ca-public/root.crt
      REQUESTS_CA_BUNDLE: /tmp/ca-bundle.pem
      SSL_CERT_FILE: /tmp/ca-bundle.pem
      EXCHANGE_SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
      EXCHANGE_VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      EXCHANGE_EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET}
      EXCHANGE_PUBLIC_BASE_URL: http://localhost:18000
      EXCHANGE_CAPACITY_RUN_ID: ${CAPACITY_RUN_ID:?run Stage.ps1 Setup first}
      EXCHANGE_WORKER_THREADS: ${CAPACITY_THREADS:-16}
      EXCHANGE_CATALOGUE_CONCURRENCY: ${CAPACITY_CATALOGUES:-2}
      EXCHANGE_ANALYTICS: 'off'
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
    volumes:
    - ./:/opt/capacity:ro
    - ./artifacts:/artifacts
    - ca-public:/ca-public:ro
    command:
    - python
    - /opt/capacity/seed.py
    - --users
    - ${CAPACITY_USERS:-1000}
    working_dir: /artifacts
  load:
    image: uniway-capacity-app:local
    profiles:
    - tools
    user: ${CAPACITY_UID:-1000}:${CAPACITY_GID:-1000}
    environment:
      EXCHANGE_CAPACITY_RUN_ID: ${CAPACITY_RUN_ID:?run Stage.ps1 Setup first}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},gateway,rest,storage,db,app,web
    volumes:
    - ./load.py:/opt/capacity/load.py:ro
    - ./artifacts:/artifacts
    command:
    - python
    - /opt/capacity/load.py
    - --target
    - http://web:8080
    - --users
    - ${CAPACITY_USERS:-1000}
    - --duration
    - ${CAPACITY_SECONDS:-300}
    cpus: 2.0
    mem_limit: 3g
    working_dir: /artifacts
volumes:
  gateway-data: {}
  ca-public: {}
  db-data: {}
  storage-data: {}
