<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="中山醫學大學臺中大慶校區正心樓、誠愛樓與附設醫院校園意象圖">
  <defs>
    <linearGradient id="csmu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="csmu-plaza" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="csmu-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#csmu-sky)" />
  <!-- Taichung South District Skyline & Daqing Station Horizon -->
  <circle cx="652" cy="88" r="56" fill="#fde68a" opacity="0.24" />
  <circle cx="652" cy="88" r="34" fill="#fef3c7" opacity="0.54" />
  <path d="M0 272 Q220 198 450 248 T800 202 L800 310 L0 310 Z" fill="#1e293b" opacity="0.55" />
  <!-- CSMU Cheng-Hsin Building (正心樓) & Cheng-Ai Building (誠愛樓) -->
  <rect x="164" y="148" width="472" height="162" rx="6" fill="#f8fafc" opacity="0.96" />
  <rect x="314" y="102" width="172" height="208" rx="5" fill="#ffffff" />
  <polygon points="300,102 400,68 500,102" fill="#0f766e" />
  <circle cx="400" cy="136" r="16" fill="#065f46" />
  <path d="M393 136 H407 M400 129 V143" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round" />
  <!-- Medical & Health Sciences Windows -->
  <rect x="196" y="178" width="38" height="104" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="248" y="178" width="38" height="104" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="514" y="178" width="38" height="104" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="566" y="178" width="38" height="104" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="348" y="170" width="104" height="118" rx="4" fill="#0d9488" opacity="0.88" />
  <!-- Campus Boulevard & Reflection -->
  <path d="M0 302 Q200 288 400 302 T800 294 L800 450 L0 450 Z" fill="url(#csmu-plaza)" />
  <path d="M0 326 Q240 312 440 328 T800 318 L800 332 Q560 342 360 330 T0 336 Z" fill="url(#csmu-gold)" opacity="0.44" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">中山醫學大學 CHUNG SHAN MEDICAL UNIVERSITY</text>
  <text x="400" y="420" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際事務處 · 海外交換生、學位連讀、臨床專業實習與教育部學海系列獎補助</text>
