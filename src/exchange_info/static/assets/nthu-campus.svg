<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立清華大學成功湖、旺宏館與二校門紫荊意象圖">
  <defs>
    <linearGradient id="nthu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="55%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="nthu-lake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="nthu-hills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="nthu-gate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nthu-sky)" />
  <!-- Bauhinia & Atomic Science Glow -->
  <circle cx="650" cy="108" r="54" fill="#d8b4fe" opacity="0.22" />
  <circle cx="650" cy="108" r="32" fill="#f3e8ff" opacity="0.45" />
  <!-- Shiba Jianshan & Campus Lawn Silhouette -->
  <path d="M0 322 Q180 235 360 298 T720 268 L800 318 L800 332 L0 332 Z" fill="url(#nthu-hills)" opacity="0.72" />
  <!-- Tsing Hua Gate & General Building I / Macronix Library Silhouette -->
  <rect x="215" y="178" width="370" height="148" rx="6" fill="url(#nthu-gate)" opacity="0.95" />
  <polygon points="340,132 400,96 460,132 460,178 340,178" fill="#f3e8ff" />
  <rect x="248" y="204" width="40" height="122" rx="4" fill="#6b21a8" opacity="0.84" />
  <rect x="308" y="204" width="40" height="122" rx="4" fill="#6b21a8" opacity="0.84" />
  <path d="M368 326 L368 216 A32 32 0 0 1 432 216 L432 326 Z" fill="#4c1d95" opacity="0.9" />
  <rect x="452" y="204" width="40" height="122" rx="4" fill="#6b21a8" opacity="0.84" />
  <rect x="512" y="204" width="40" height="122" rx="4" fill="#6b21a8" opacity="0.84" />
  <!-- Lake Success (成功湖) Water & Reflection -->
  <path d="M0 326 Q240 314 440 326 T800 320 L800 450 L0 450 Z" fill="url(#nthu-lake)" />
  <ellipse cx="400" cy="348" rx="185" ry="8" fill="#e9d5ff" opacity="0.24" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="2.2">國立清華大學 NATIONAL TSING HUA UNIVERSITY</text>
  <text x="400" y="422" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">全球事務處全球學術合作組 · 校級出國交換與台灣聯大系統交換計畫</text>
