<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立高雄科技大學五大校區（建工、第一、楠梓、燕巢、旗津）與海洋科技創新意象圖">
  <defs>
    <linearGradient id="nkust-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="55%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="nkust-ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="nkust-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="nkust-plaza" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nkust-sky)" />
  <!-- Kaohsiung Harbor Sun & Maritime Beacon -->
  <circle cx="656" cy="98" r="56" fill="#fde68a" opacity="0.22" />
  <circle cx="656" cy="98" r="34" fill="#fef3c7" opacity="0.45" />
  <!-- Ocean Wave & Hill Silhouette -->
  <path d="M0 322 Q200 246 400 292 T800 254 L800 332 L0 332 Z" fill="url(#nkust-ocean)" opacity="0.78" />
  <!-- NKUST Main Campus Architecture & Library Tower -->
  <polygon points="180,176 400,114 620,176" fill="url(#nkust-roof)" />
  <rect x="212" y="176" width="376" height="150" rx="4" fill="#f8fafc" opacity="0.96" />
  <rect x="244" y="202" width="42" height="124" rx="3" fill="#0369a1" opacity="0.88" />
  <rect x="308" y="202" width="42" height="124" rx="3" fill="#0369a1" opacity="0.88" />
  <path d="M368 326 L368 212 A32 32 0 0 1 432 212 L432 326 Z" fill="#0284c7" opacity="0.92" />
  <rect x="450" y="202" width="42" height="124" rx="3" fill="#0369a1" opacity="0.88" />
  <rect x="514" y="202" width="42" height="124" rx="3" fill="#0369a1" opacity="0.88" />
  <!-- Maritime Compass / Tech Star Emblem -->
  <circle cx="400" cy="148" r="14" fill="#fde68a" />
  <polygon points="400,126 405,148 400,170 395,148" fill="#0c4a6e" />
  <polygon points="378,148 400,143 422,148 400,153" fill="#0c4a6e" />
  <!-- Foreground Harbor Plaza -->
  <path d="M0 326 Q240 314 440 326 T800 320 L800 450 L0 450 Z" fill="url(#nkust-plaza)" />
  <ellipse cx="400" cy="348" rx="190" ry="8" fill="#fde68a" opacity="0.22" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="1.4">國立高雄科技大學 NATIONAL KAOHSIUNG UNIVERSITY OF SCIENCE AND TECHNOLOGY</text>
  <text x="400" y="422" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">國際事務處（國際關係組）· 校級暨院系級赴境外大學校院交換研修計畫</text>
</svg>
