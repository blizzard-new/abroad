      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="pu-hill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
