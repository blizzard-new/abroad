  <rect x="508" y="212" width="92" height="16" fill="#5b21b6" opacity="0.62" />
  <rect x="508" y="242" width="92" height="16" fill="#5b21b6" opacity="0.62" />
  <!-- Iconic Our Lady of Providence Chapel (主顧聖母堂竹筍／魚形弧頂與十字架) -->
