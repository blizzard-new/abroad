<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立臺北科技大學紅樓與先鋒國際研發大樓校園意象圖">
  <defs>
    <linearGradient id="ntut-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2547" />
      <stop offset="55%" stop-color="#1c4073" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="ntut-plaza" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a365d" />
      <stop offset="50%" stop-color="#2c5282" />
      <stop offset="100%" stop-color="#3182ce" />
    </linearGradient>
    <linearGradient id="ntut-brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b84a39" />
      <stop offset="100%" stop-color="#8f3224" />
    </linearGradient>
    <linearGradient id="ntut-tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ntut-sky)" />
  <!-- Taipei Warm Sunset Glow -->
  <circle cx="635" cy="128" r="56" fill="#f6ad55" opacity="0.28" />
  <circle cx="635" cy="128" r="36" fill="#fbd38d" opacity="0.45" />
  <!-- Modern Tech Tower (Sixth Academic / Pioneer R&D Building Silhouette) -->
  <rect x="455" y="105" width="175" height="225" rx="6" fill="url(#ntut-tower)" opacity="0.92" />
  <rect x="475" y="128" width="135" height="22" rx="3" fill="#2b6cb0" opacity="0.78" />
  <rect x="475" y="162" width="135" height="22" rx="3" fill="#2b6cb0" opacity="0.78" />
  <rect x="475" y="196" width="135" height="22" rx="3" fill="#2b6cb0" opacity="0.78" />
  <rect x="475" y="230" width="135" height="22" rx="3" fill="#2b6cb0" opacity="0.78" />
  <rect x="475" y="264" width="135" height="22" rx="3" fill="#2b6cb0" opacity="0.78" />
  <!-- Iconic NTUT Historic Red House (紅樓) -->
  <rect x="155" y="175" width="320" height="155" rx="5" fill="url(#ntut-brick)" />
  <polygon points="142,178 315,112 488,178" fill="#63271b" />
  <rect x="265" y="148" width="100" height="182" rx="4" fill="#9c3828" />
  <polygon points="255,150 315,108 375,150" fill="#4a1d14" />
  <rect x="186" y="205" width="36" height="82" rx="18" fill="#fefcbf" opacity="0.88" />
  <rect x="234" y="205" width="36" height="82" rx="18" fill="#fefcbf" opacity="0.88" />
  <rect x="292" y="195" width="46" height="105" rx="23" fill="#fefcbf" opacity="0.92" />
  <rect x="360" y="205" width="36" height="82" rx="18" fill="#fefcbf" opacity="0.88" />
  <rect x="408" y="205" width="36" height="82" rx="18" fill="#fefcbf" opacity="0.88" />
  <!-- Campus Plaza Reflection -->
  <path d="M0 326 Q200 314 400 326 T800 320 L800 450 L0 450 Z" fill="url(#ntut-plaza)" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700" letter-spacing="2.5">國立臺北科技大學 NATIONAL TAIPEI UNIVERSITY OF TECHNOLOGY</text>
  <text x="400" y="422" text-anchor="middle" fill="#bee3f8" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">國際事務處 · 赴外交換研修計畫、雙聯學位與出國研修獎學金</text>
</svg>
