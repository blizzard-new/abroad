<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="國立臺北護理健康大學 National Taipei University of Nursing and Health Sciences Campus">
  <defs>
    <linearGradient id="ntunhsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e4a5a"/>
      <stop offset="52%" stop-color="#287a8c"/>
      <stop offset="100%" stop-color="#e8f5f5"/>
    </linearGradient>
    <linearGradient id="ntunhsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2c94c"/>
      <stop offset="100%" stop-color="#c9961a"/>
    </linearGradient>
    <linearGradient id="ntunhsLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c8d65"/>
      <stop offset="100%" stop-color="#1e573b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#ntunhsSky)"/>

  <!-- Yangmingshan & Beitou Datun Mountain Silhouette -->
  <path d="M0 385 Q 230 290 480 350 T 960 320 L 1200 365 L 1200 450 L 0 450 Z" fill="#3a6b78" opacity="0.45"/>
  <circle cx="980" cy="125" r="52" fill="#fde69e" opacity="0.88"/>

  <!-- NTUNHS Beitou Campus: Administration Building & Qin-Ren Building (親仁樓 / 行政大樓) -->
  <g transform="translate(190, 185)">
    <!-- Left Wing (Nursing & Health Technology Building) -->
    <rect x="0" y="55" width="220" height="190" rx="5" fill="#f3ece2" stroke="#857564" stroke-width="2"/>
    <rect x="10" y="42" width="200" height="15" fill="#1b6b63"/>
    <g fill="#225769" opacity="0.85">
      <rect x="24" y="76" width="34" height="26" rx="2"/>
      <rect x="72" y="76" width="34" height="26" rx="2"/>
      <rect x="120" y="76" width="34" height="26" rx="2"/>
      <rect x="168" y="76" width="28" height="26" rx="2"/>
      <rect x="24" y="116" width="34" height="26" rx="2"/>
      <rect x="72" y="116" width="34" height="26" rx="2"/>
      <rect x="120" y="116" width="34" height="26" rx="2"/>
      <rect x="168" y="116" width="28" height="26" rx="2"/>
      <rect x="24" y="156" width="34" height="26" rx="2"/>
      <rect x="72" y="156" width="34" height="26" rx="2"/>
      <rect x="120" y="156" width="34" height="26" rx="2"/>
      <rect x="168" y="156" width="28" height="26" rx="2"/>
    </g>

    <!-- Central Administration & International Education Tower -->
    <rect x="210" y="10" width="400" height="235" rx="6" fill="#fbf7f0" stroke="#7c6d5c" stroke-width="2.5"/>
    <polygon points="196,14 410,-32 624,14" fill="#175e57" stroke="#f2c94c" stroke-width="2"/>
    <!-- Nursing Cross / Care Emblem -->
    <circle cx="410" cy="-4" r="16" fill="url(#ntunhsGold)"/>
    <rect x="406" y="-13" width="8" height="18" fill="#ffffff" rx="1"/>
    <rect x="401" y="-8" width="18" height="8" fill="#ffffff" rx="1"/>

    <g fill="#1f5061">
      <rect x="242" y="38" width="46" height="34" rx="3"/>
      <rect x="306" y="38" width="46" height="34" rx="3"/>
      <rect x="387" y="38" width="46" height="34" rx="3"/>
      <rect x="468" y="38" width="46" height="34" rx="3"/>
      <rect x="532" y="38" width="46" height="34" rx="3"/>

      <rect x="242" y="88" width="46" height="34" rx="3"/>
      <rect x="306" y="88" width="46" height="34" rx="3"/>
      <rect x="387" y="88" width="46" height="34" rx="3"/>
      <rect x="468" y="88" width="46" height="34" rx="3"/>
      <rect x="532" y="88" width="46" height="34" rx="3"/>
    </g>

    <!-- Entrance Colonnade -->
    <path d="M250 245 L250 175 A28 28 0 0 1 306 175 L306 245 Z" fill="#153c4a"/>
    <path d="M332 245 L332 168 A34 34 0 0 1 400 168 L400 245 Z" fill="#153c4a"/>
    <path d="M420 245 L420 168 A34 34 0 0 1 488 168 L488 245 Z" fill="#153c4a"/>
    <path d="M514 245 L514 175 A28 28 0 0 1 570 175 L570 245 Z" fill="#153c4a"/>

    <!-- Right Wing -->
    <rect x="600" y="55" width="220" height="190" rx="5" fill="#f3ece2" stroke="#857564" stroke-width="2"/>
    <rect x="610" y="42" width="200" height="15" fill="#1b6b63"/>
    <g fill="#225769" opacity="0.85">
      <rect x="624" y="76" width="28" height="26" rx="2"/>
      <rect x="666" y="76" width="34" height="26" rx="2"/>
      <rect x="714" y="76" width="34" height="26" rx="2"/>
      <rect x="762" y="76" width="34" height="26" rx="2"/>
      <rect x="624" y="116" width="28" height="26" rx="2"/>
      <rect x="666" y="116" width="34" height="26" rx="2"/>
      <rect x="714" y="116" width="34" height="26" rx="2"/>
      <rect x="762" y="116" width="34" height="26" rx="2"/>
      <rect x="624" y="156" width="28" height="26" rx="2"/>
      <rect x="666" y="156" width="34" height="26" rx="2"/>
      <rect x="714" y="156" width="34" height="26" rx="2"/>
      <rect x="762" y="156" width="34" height="26" rx="2"/>
    </g>
  </g>

  <!-- Campus Green Lawn -->
  <rect x="0" y="430" width="1200" height="200" fill="url(#ntunhsLawn)"/>
  <text x="600" y="575" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold" opacity="0.92">國立臺北護理健康大學 National Taipei University of Nursing and Health Sciences</text>
</svg>
