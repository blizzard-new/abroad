<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="國立臺南大學 National University of Tainan Fucheng Campus Red Building">
  <defs>
    <linearGradient id="nutnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#361f47"/>
      <stop offset="48%" stop-color="#6c3d7a"/>
      <stop offset="100%" stop-color="#f6ebe1"/>
    </linearGradient>
    <linearGradient id="nutnBrick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b84a39"/>
      <stop offset="100%" stop-color="#872e21"/>
    </linearGradient>
    <linearGradient id="nutnGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5cd56"/>
      <stop offset="100%" stop-color="#c9951e"/>
    </linearGradient>
    <linearGradient id="nutnLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e8954"/>
      <stop offset="100%" stop-color="#295230"/>
    </linearGradient>
  </defs>

  <!-- Tainan Fucheng warm twilight sky -->
  <rect width="1200" height="630" fill="url(#nutnSky)"/>

  <!-- Warm southern sun -->
  <circle cx="950" cy="135" r="58" fill="#fde293" opacity="0.86"/>

  <!-- Distant Tainan silhouette -->
  <path d="M0 395 Q 280 345 580 380 T 1200 365 L 1200 450 L 0 450 Z" fill="#5e4368" opacity="0.42"/>

  <!-- Historic Red Building (國立臺南大學百年市定古蹟「紅樓」) & Cheng-Zheng Building (誠正大樓 B302) -->
  <g transform="translate(190, 185)">
    <!-- Left Wing of Red Building -->
    <rect x="0" y="55" width="230" height="190" rx="3" fill="url(#nutnBrick)" stroke="#f2e6d8" stroke-width="2.5"/>
    <polygon points="-10,55 115,15 240,55" fill="#4a4e54" stroke="#d8cfc4" stroke-width="2"/>
    <!-- White horizontal heritage stone bands -->
    <rect x="0" y="110" width="230" height="7" fill="#f2e6d8"/>
    <rect x="0" y="175" width="230" height="7" fill="#f2e6d8"/>
    <!-- Left Wing Arched Corridor Windows -->
    <g fill="#2b2133">
      <rect x="28" y="72" width="32" height="32" rx="16"/>
      <rect x="80" y="72" width="32" height="32" rx="16"/>
      <rect x="132" y="72" width="32" height="32" rx="16"/>
      <rect x="184" y="72" width="28" height="32" rx="14"/>
      <rect x="28" y="128" width="32" height="38" rx="4"/>
      <rect x="80" y="128" width="32" height="38" rx="4"/>
      <rect x="132" y="128" width="32" height="38" rx="4"/>
      <rect x="184" y="128" width="28" height="38" rx="4"/>
    </g>

    <!-- Central Pediment & Entrance Porch of Red Building -->
    <rect x="220" y="18" width="380" height="227" rx="4" fill="url(#nutnBrick)" stroke="#f2e6d8" stroke-width="3"/>
    <polygon points="205,20 410,-32 615,20" fill="#42464c" stroke="#f2e6d8" stroke-width="2.5"/>
    <!-- Central Heritage Pediment Crest -->
    <polygon points="335,20 410,-14 485,20" fill="#9c3829" stroke="#f2e6d8" stroke-width="2.5"/>
    <circle cx="410" cy="4" r="13" fill="url(#nutnGold)"/>
    <!-- White heritage stone bands -->
    <rect x="220" y="92" width="380" height="8" fill="#f2e6d8"/>
    <rect x="220" y="165" width="380" height="8" fill="#f2e6d8"/>

    <!-- 2nd & 3rd Floor Classical Arched Windows -->
    <g fill="#2b2133" stroke="#f2e6d8" stroke-width="1.5">
      <rect x="252" y="40" width="40" height="44" rx="20"/>
      <rect x="314" y="40" width="40" height="44" rx="20"/>
      <rect x="390" y="40" width="40" height="44" rx="20"/>
      <rect x="466" y="40" width="40" height="44" rx="20"/>
      <rect x="528" y="40" width="40" height="44" rx="20"/>

      <rect x="252" y="110" width="40" height="44" rx="4"/>
      <rect x="314" y="110" width="40" height="44" rx="4"/>
      <rect x="390" y="110" width="40" height="44" rx="4"/>
      <rect x="466" y="110" width="40" height="44" rx="4"/>
      <rect x="528" y="110" width="40" height="44" rx="4"/>
    </g>

    <!-- Ground Floor Grand Triple Archway -->
    <path d="M258 245 L258 186 A24 24 0 0 1 306 186 L306 245 Z" fill="#231929" stroke="#f2e6d8" stroke-width="2"/>
    <path d="M332 245 L332 182 A30 30 0 0 1 392 182 L392 245 Z" fill="#231929" stroke="#f2e6d8" stroke-width="2"/>
    <path d="M428 245 L428 182 A30 30 0 0 1 488 182 L488 245 Z" fill="#231929" stroke="#f2e6d8" stroke-width="2"/>
    <path d="M514 245 L514 186 A24 24 0 0 1 562 186 L562 245 Z" fill="#231929" stroke="#f2e6d8" stroke-width="2"/>

    <!-- Right Wing -->
    <rect x="590" y="55" width="230" height="190" rx="3" fill="url(#nutnBrick)" stroke="#f2e6d8" stroke-width="2.5"/>
    <polygon points="580,55 705,15 830,55" fill="#4a4e54" stroke="#d8cfc4" stroke-width="2"/>
    <rect x="590" y="110" width="230" height="7" fill="#f2e6d8"/>
    <rect x="590" y="175" width="230" height="7" fill="#f2e6d8"/>
    <g fill="#2b2133">
      <rect x="608" y="72" width="28" height="32" rx="14"/>
      <rect x="656" y="72" width="32" height="32" rx="16"/>
      <rect x="708" y="72" width="32" height="32" rx="16"/>
      <rect x="760" y="72" width="32" height="32" rx="16"/>
      <rect x="608" y="128" width="28" height="38" rx="4"/>
      <rect x="656" y="128" width="32" height="38" rx="4"/>
      <rect x="708" y="128" width="32" height="38" rx="4"/>
      <rect x="760" y="128" width="32" height="38" rx="4"/>
    </g>
  </g>

  <!-- Golden Shower Trees (阿勃勒黃金雨與百年樟樹) -->
  <g opacity="0.92">
    <circle cx="135" cy="365" r="48" fill="#2f6638"/>
    <circle cx="155" cy="345" r="36" fill="#e8be3f" opacity="0.85"/>
    <circle cx="1065" cy="365" r="48" fill="#2f6638"/>
    <circle cx="1045" cy="345" r="36" fill="#e8be3f" opacity="0.85"/>
  </g>

  <!-- Campus Lawn & Red Brick Plaza -->
  <rect x="0" y="430" width="1200" height="200" fill="url(#nutnLawn)"/>
  <polygon points="480,430 720,430 830,630 370,630" fill="#d9b99b" opacity="0.82"/>
</svg>
