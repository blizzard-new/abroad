<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立政治大學達賢圖書館與指南山麓校園意象圖">
  <defs>
    <linearGradient id="nccu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d233a" />
      <stop offset="55%" stop-color="#1a416b" />
      <stop offset="100%" stop-color="#2a69ac" />
    </linearGradient>
    <linearGradient id="nccu-lake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#153252" />
      <stop offset="50%" stop-color="#234e7a" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="nccu-hill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e463a" />
      <stop offset="100%" stop-color="#132e26" />
    </linearGradient>
    <linearGradient id="nccu-dahxian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nccu-sky)" />
  <!-- Muzha Morning Sun Glow -->
  <circle cx="645" cy="118" r="54" fill="#f6ad55" opacity="0.28" />
  <circle cx="645" cy="118" r="34" fill="#fbd38d" opacity="0.46" />
  <!-- Zhinan Foothills & Jingmei River Mountains -->
  <path d="M0 295 Q150 205 320 265 T650 225 T800 260 L800 340 L0 340 Z" fill="url(#nccu-hill)" opacity="0.85" />
  <!-- NCCU Dah Hsian Library (達賢圖書館) Stepped Architectural Silhouette -->
  <polygon points="180,325 225,165 565,140 605,325" fill="url(#nccu-dahxian)" opacity="0.95" />
  <polygon points="225,165 565,140 582,162 212,185" fill="#94a3b8" />
  <!-- Stepped Terraces & Reading Windows -->
  <rect x="235" y="192" width="315" height="20" rx="3" fill="#1e3a5f" opacity="0.82" />
  <rect x="225" y="224" width="335" height="22" rx="3" fill="#1e3a5f" opacity="0.82" />
  <rect x="215" y="258" width="355" height="24" rx="3" fill="#1e3a5f" opacity="0.82" />
  <rect x="205" y="294" width="375" height="20" rx="3" fill="#2b6cb0" opacity="0.65" />
  <!-- Lakeside Pond Reflection -->
  <path d="M0 324 Q220 312 420 324 T800 318 L800 450 L0 450 Z" fill="url(#nccu-lake)" />
  <ellipse cx="395" cy="346" rx="170" ry="8" fill="#e2e8f0" opacity="0.18" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="2.8">國立政治大學 NATIONAL CHENGCHI UNIVERSITY</text>
  <text x="400" y="422" text-anchor="middle" fill="#bee3f8" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">國際合作事務處 · 校級赴外交換、大陸地區交換與短期進修獎助金</text>
</svg>
