<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cyutTitle cyutDesc">
  <title id="cyutTitle">朝陽科技大學 Chaoyang University of Technology</title>
  <desc id="cyutDesc">Campus illustration of Chaoyang University of Technology (CYUT) Wufeng Campus in Taichung, featuring the iconic red-brick Administration Building, Poli Memorial Library, Aviation College wing, and Wufeng hillside scenery at sunrise.</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143258"/>
      <stop offset="55%" stop-color="#285d8f"/>
      <stop offset="100%" stop-color="#f7c873"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d5a3f"/>
      <stop offset="100%" stop-color="#193826"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b84a39"/>
      <stop offset="60%" stop-color="#963628"/>
      <stop offset="100%" stop-color="#75261b"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4efe6"/>
      <stop offset="100%" stop-color="#d8cfc0"/>
    </linearGradient>
  </defs>

  <!-- Taichung Wufeng Morning Sky & Chaoyang Sun -->
  <rect width="1200" height="630" fill="url(#skyGrad)"/>
  <circle cx="960" cy="150" r="76" fill="#ffe18d" opacity="0.92"/>
  <circle cx="960" cy="150" r="115" fill="#ffe18d" opacity="0.24"/>

  <!-- Wufeng Hills (霧峰山麓) -->
  <polygon points="0,430 190,285 410,355 660,250 910,340 1110,275 1200,340 1200,485 0,485" fill="url(#hillGrad)" opacity="0.78"/>
  <polygon points="0,460 290,345 580,395 850,320 1200,405 1200,500 0,500" fill="#1e442e" opacity="0.88"/>

  <!-- CYUT Iconic Red-Brick Administration Building & Poli Memorial Library -->
  <g transform="translate(150, 175)">
    <!-- Left & Right Red-Brick Wings -->
    <rect x="60" y="150" width="240" height="165" rx="4" fill="url(#brickGrad)" stroke="#e6dccd" stroke-width="3"/>
    <rect x="600" y="150" width="240" height="165" rx="4" fill="url(#brickGrad)" stroke="#e6dccd" stroke-width="3"/>
    <!-- Central Tower & Archway -->
    <rect x="280" y="75" width="340" height="240" rx="6" fill="url(#brickGrad)" stroke="#e6dccd" stroke-width="3.5"/>
    <polygon points="265,78 450,10 635,78" fill="#5e2118" stroke="#e6dccd" stroke-width="3"/>
    <circle cx="450" cy="52" r="16" fill="url(#stoneGrad)" stroke="#5e2118" stroke-width="3"/>
    <!-- Classical Columns & Grand Entrance Arch -->
    <rect x="330" y="110" width="240" height="90" rx="4" fill="#1e3d59" opacity="0.9"/>
    <line x1="390" y1="110" x2="390" y2="200" stroke="#f4efe6" stroke-width="4"/>
    <line x1="450" y1="110" x2="450" y2="200" stroke="#f4efe6" stroke-width="4"/>
    <line x1="510" y1="110" x2="510" y2="200" stroke="#f4efe6" stroke-width="4"/>
    <path d="M395 315 L395 245 A55 55 0 0 1 505 245 L505 315 Z" fill="#122638" stroke="#f4efe6" stroke-width="4"/>
    <!-- Wing Windows -->
    <rect x="95" y="180" width="170" height="40" fill="#1e3d59" opacity="0.88"/>
    <rect x="95" y="240" width="170" height="40" fill="#1e3d59" opacity="0.88"/>
    <rect x="635" y="180" width="170" height="40" fill="#1e3d59" opacity="0.88"/>
    <rect x="635" y="240" width="170" height="40" fill="#1e3d59" opacity="0.88"/>
  </g>

  <!-- Campus Green Boulevard & Steps -->
  <rect x="0" y="490" width="1200" height="140" fill="#275939"/>
  <polygon points="460,490 740,490 880,630 320,630" fill="url(#stoneGrad)" opacity="0.9"/>
  <line x1="490" y1="520" x2="710" y2="520" stroke="#bfb4a3" stroke-width="3"/>
  <line x1="440" y1="560" x2="760" y2="560" stroke="#bfb4a3" stroke-width="3"/>
  <line x1="390" y1="600" x2="810" y2="600" stroke="#bfb4a3" stroke-width="3"/>

  <!-- Badge & Title Overlay -->
  <rect x="55" y="45" width="520" height="92" rx="14" fill="#143258" opacity="0.88" stroke="#ffe18d" stroke-width="2"/>
  <text x="82" y="86" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">朝陽科技大學 CYUT</text>
  <text x="82" y="116" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#ffe18d" letter-spacing="1">Chaoyang University of Technology</text>
</svg>
