<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="臺北醫學大學信義校區醫學綜合大樓、楓林大道與雙和校區生醫園區校園意象圖">
  <defs>
    <linearGradient id="tmu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="55%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tmu-plaza" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tmu-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tmu-sky)" />
  <!-- Mushan Hills (拇山) & Taipei Xinyi Skyline -->
  <circle cx="656" cy="88" r="56" fill="#fde68a" opacity="0.24" />
  <circle cx="656" cy="88" r="34" fill="#fef3c7" opacity="0.54" />
  <path d="M0 272 Q220 198 450 248 T800 202 L800 310 L0 310 Z" fill="#1e293b" opacity="0.55" />
  <!-- TMU United Medical Building (醫學綜合大樓前棟與後棟誠樸廳) -->
  <rect x="168" y="152" width="464" height="158" rx="6" fill="#f8fafc" opacity="0.96" />
  <rect x="318" y="106" width="164" height="204" rx="5" fill="#ffffff" />
  <polygon points="304,106 400,72 496,106" fill="#991b1b" />
  <circle cx="400" cy="138" r="16" fill="#7f1d1d" />
  <path d="M393 138 H407 M400 131 V145" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round" />
  <!-- Medical & Biomedical Research Windows -->
  <rect x="198" y="180" width="38" height="102" rx="3" fill="#7f1d1d" opacity="0.86" />
  <rect x="250" y="180" width="38" height="102" rx="3" fill="#7f1d1d" opacity="0.86" />
  <rect x="512" y="180" width="38" height="102" rx="3" fill="#7f1d1d" opacity="0.86" />
  <rect x="564" y="180" width="38" height="102" rx="3" fill="#7f1d1d" opacity="0.86" />
  <rect x="350" y="172" width="100" height="116" rx="4" fill="#b91c1c" opacity="0.88" />
  <!-- Maple Avenue (楓林大道) & Reflection -->
  <path d="M0 302 Q200 288 400 302 T800 294 L800 450 L0 450 Z" fill="url(#tmu-plaza)" />
  <path d="M0 326 Q240 312 440 328 T800 318 L800 332 Q560 342 360 330 T0 336 Z" fill="url(#tmu-gold)" opacity="0.44" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">臺北醫學大學 TAIPEI MEDICAL UNIVERSITY</text>
  <text x="400" y="420" text-anchor="middle" fill="#fecaca" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際事務處國際盟校組 · 境外研修暨見實習、跨國雙聯學制與教育部學海系列獎補助</text>
</svg>
