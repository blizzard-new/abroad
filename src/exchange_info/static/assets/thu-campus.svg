<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="東海大學路思義教堂、文理大道與大肚山博雅綠意校園意象圖">
  <defs>
    <linearGradient id="thu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="thu-lawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="thu-chapel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#thu-sky)" />
  <!-- Dadu Mountain & Taichung Sunset Glow -->
  <circle cx="640" cy="88" r="58" fill="#fde68a" opacity="0.26" />
  <circle cx="640" cy="88" r="36" fill="#fef3c7" opacity="0.58" />
  <path d="M0 278 Q210 206 440 248 T800 202 L800 315 L0 315 Z" fill="#1e40af" opacity="0.52" />
  <!-- Luce Memorial Chapel (路思義教堂) Iconic Hyperbolic Paraboloid Silhouette -->
  <path d="M268 304 Q356 154 394 64 L394 304 Z" fill="url(#thu-chapel)" opacity="0.96" />
  <path d="M532 304 Q444 154 406 64 L406 304 Z" fill="url(#thu-chapel)" opacity="0.88" />
  <rect x="395" y="50" width="10" height="254" fill="#fef9c3" opacity="0.92" />
  <line x1="400" y1="32" x2="400" y2="62" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  <line x1="390" y1="42" x2="410" y2="42" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" />
  <!-- Wenli Boulevard (文理大道) & Lawn -->
  <path d="M0 302 Q220 288 400 302 T800 294 L800 450 L0 450 Z" fill="url(#thu-lawn)" />
  <path d="M350 304 L450 304 L520 450 L280 450 Z" fill="#fde68a" opacity="0.22" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">東海大學 TUNGHAI UNIVERSITY</text>
  <text x="400" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際暨兩岸合作處 · 全球暨兩岸姊妹校交換、跨國雙聯學位、深耕國際移動力與學海獎助</text>
