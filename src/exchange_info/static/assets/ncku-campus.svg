<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立成功大學榕園百年老榕與成功湖校園意象圖">
  <defs>
    <linearGradient id="ncku-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0d11" />
      <stop offset="55%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="ncku-lake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="ncku-banyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="ncku-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fecaca" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ncku-sky)" />
  <!-- Tainan Warm Sun Glow -->
  <circle cx="650" cy="115" r="56" fill="#fbbf24" opacity="0.28" />
  <circle cx="650" cy="115" r="36" fill="#fde68a" opacity="0.48" />
  <!-- Historic Red-Brick & Classic Arcade Silhouette -->
  <rect x="150" y="215" width="500" height="110" rx="6" fill="url(#ncku-arch)" opacity="0.92" />
  <rect x="175" y="240" width="55" height="85" rx="27" fill="#7f1d1d" opacity="0.85" />
  <rect x="255" y="240" width="55" height="85" rx="27" fill="#7f1d1d" opacity="0.85" />
  <rect x="490" y="240" width="55" height="85" rx="27" fill="#7f1d1d" opacity="0.85" />
  <rect x="570" y="240" width="55" height="85" rx="27" fill="#7f1d1d" opacity="0.85" />
  <!-- NCKU Iconic Century-Old Banyan Tree (榕園大榕樹) Canopy -->
  <ellipse cx="400" cy="210" rx="175" ry="68" fill="url(#ncku-banyan)" />
  <ellipse cx="320" cy="222" rx="115" ry="50" fill="#166534" opacity="0.92" />
  <ellipse cx="480" cy="222" rx="115" ry="50" fill="#166534" opacity="0.92" />
  <path d="M382 265 L368 325 L432 325 L418 265 Z" fill="#451a03" />
  <!-- Cheng Kung Lake Lawn & Reflection -->
  <path d="M0 324 Q220 312 420 324 T800 318 L800 450 L0 450 Z" fill="url(#ncku-lake)" />
  <ellipse cx="400" cy="346" rx="180" ry="8" fill="#fef2f2" opacity="0.18" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="2.8">國立成功大學 NATIONAL CHENG KUNG UNIVERSITY</text>
  <text x="400" y="422" text-anchor="middle" fill="#fecaca" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">國際事務處國際教育組 · 校級出國與赴大陸地區交換學生計畫</text>
</svg>
