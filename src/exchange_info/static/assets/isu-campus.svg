<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="義守大學觀音山歐風紅磚校本部、國際學院與智慧醫學城校園意象圖">
  <defs>
    <linearGradient id="isu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="52%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="isu-hill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="isu-brick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="isu-stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#isu-sky)" />
  <!-- Kaohsiung Dashu Sun & Mount Guanyin (觀音山) Silhouette -->
  <circle cx="642" cy="86" r="56" fill="#fde68a" opacity="0.28" />
  <circle cx="642" cy="86" r="34" fill="#fef3c7" opacity="0.68" />
  <path d="M0 272 L150 168 L300 222 L485 128 L675 202 L800 166 L800 315 L0 315 Z" fill="#1e293b" opacity="0.52" />
  <path d="M110 286 L285 190 L455 238 L630 170 L800 230 L800 315 L110 315 Z" fill="#065f46" opacity="0.46" />
  <!-- ISU Iconic European Red-Brick Administration & International College Architecture -->
  <rect x="240" y="184" width="320" height="114" rx="4" fill="url(#isu-brick)" opacity="0.95" />
  <polygon points="228,186 400,130 572,186" fill="#7f1d1d" opacity="0.96" />
  <rect x="358" y="154" width="84" height="144" fill="url(#isu-stone)" opacity="0.96" />
  <polygon points="348,156 400,114 452,156" fill="#b45309" opacity="0.98" />
  <!-- Arched Colonnade Windows -->
  <rect x="266" y="206" width="22" height="58" rx="11" fill="#450a0a" opacity="0.72" />
  <rect x="304" y="206" width="22" height="58" rx="11" fill="#450a0a" opacity="0.72" />
  <rect x="474" y="206" width="22" height="58" rx="11" fill="#450a0a" opacity="0.72" />
  <rect x="512" y="206" width="22" height="58" rx="11" fill="#450a0a" opacity="0.72" />
  <rect x="380" y="216" width="40" height="82" rx="20" fill="#450a0a" opacity="0.84" />
  <!-- Terraced Hillside Campus Steps & Greenery -->
  <path d="M0 296 Q240 282 420 296 T800 290 L800 450 L0 450 Z" fill="url(#isu-hill)" />
  <polygon points="340,298 460,298 510,350 290,350" fill="#fef3c7" opacity="0.28" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">義守大學 I-SHOU UNIVERSITY (ISU)</text>
  <text x="400" y="422" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.2">國際及兩岸事務處 · 全球 33 國姐妹校交換研修、跨國雙聯學位與教育部學海／義大學海／學文獎助學金</text>
</svg>
