<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="世新大學山洞口、世界大廈與木柵景美溪畔全媒體傳播校園意象圖">
  <defs>
    <linearGradient id="shu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="55%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="shu-hill" x1="0%" y1="0%" x2="0%" y2="100%">
