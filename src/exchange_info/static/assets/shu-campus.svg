  <rect x="476" y="128" width="78" height="18" fill="#9f1239" opacity="0.65" />
  <rect x="476" y="160" width="78" height="18" fill="#9f1239" opacity="0.65" />
  <rect x="476" y="192" width="78" height="18" fill="#9f1239" opacity="0.65" />
  <rect x="476" y="224" width="78" height="18" fill="#9f1239" opacity="0.65" />
  <!-- Iconic SHU Tunnel Gate (世新山洞口) -->
  <path d="M210 304 L210 176 Q310 128 410 176 L410 304 Z" fill="url(#shu-arch)" opacity="0.95" />
  <path d="M250 304 L250 218 Q310 168 370 218 L370 304 Z" fill="#1e1b4b" opacity="0.92" />
