  <text x="400" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際暨兩岸事務處 · 歐美日韓與大陸港澳姊妹校交換、3+1/1+1雙學位與學海獎學金</text>
