      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shu-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#shu-sky)" />
  <!-- Xianjiyan Hills & Broadcast Signal Waves -->
