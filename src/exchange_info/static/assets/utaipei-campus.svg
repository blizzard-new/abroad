  <text x="400" y="428" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1">Office of International Affairs · Outbound Exchange &amp; Sister University Catalog</text>
