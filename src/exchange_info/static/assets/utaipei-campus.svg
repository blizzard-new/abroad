    <rect x="342" y="208" width="38" height="24" rx="2"/>
    <rect x="420" y="208" width="38" height="24" rx="2"/>
    <rect x="477" y="208" width="38" height="24" rx="2"/>
    <rect x="285" y="248" width="38" height="24" rx="2"/>
    <rect x="342" y="248" width="38" height="24" rx="2"/>
    <rect x="420" y="248" width="38" height="24" rx="2"/>
    <rect x="477" y="248" width="38" height="24" rx="2"/>
    <rect x="370" y="303" width="60" height="62" rx="3" fill="#fbbf24"/>
