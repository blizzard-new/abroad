  <rect x="255" y="180" width="290" height="185" rx="6" fill="#312e81" stroke="#c7d2fe" stroke-width="2"/>
  <polygon points="240,180 400,125 560,180" fill="#e11d48" opacity="0.9"/>
  <rect x="570" y="235" width="125" height="130" rx="4" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
  <!-- Windows -->
  <g fill="#e0e7ff" opacity="0.85">
