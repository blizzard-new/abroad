  <rect x="335" y="138" width="130" height="187" rx="4" fill="#ffffff" opacity="0.95" />
  <polygon points="325,140 400,104 475,140" fill="#8c3b2b" />
  <rect x="208" y="200" width="46" height="96" rx="3" fill="#1e5641" opacity="0.82" />
