<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="高雄醫學大學十全校區舊第一棟紀念館、勵學大樓與濟世大樓校園意象圖">
  <defs>
    <linearGradient id="kmu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="55%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kmu-plaza" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kmu-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#kmu-sky)" />
  <!-- Kaohsiung Harbor & Southern Sun Horizon -->
  <circle cx="654" cy="84" r="56" fill="#fde68a" opacity="0.25" />
  <circle cx="654" cy="84" r="34" fill="#fef3c7" opacity="0.56" />
  <path d="M0 272 Q220 198 450 246 T800 198 L800 310 L0 310 Z" fill="#134e4a" opacity="0.55" />
  <!-- KMU First Building (舊第一棟歷史建築) & Li-Hsueh Building (勵學大樓) -->
  <rect x="156" y="144" width="488" height="166" rx="8" fill="#f8fafc" opacity="0.96" />
  <rect x="308" y="96" width="184" height="214" rx="6" fill="#ffffff" />
  <polygon points="292,96 400,60 508,96" fill="#0f766e" />
  <circle cx="400" cy="132" r="17" fill="#115e59" />
  <path d="M393 132 H407 M400 125 V139" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round" />
  <!-- Medical & Health Sciences Windows -->
  <rect x="190" y="172" width="40" height="110" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="244" y="172" width="40" height="110" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="516" y="172" width="40" height="110" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="570" y="172" width="40" height="110" rx="3" fill="#0f766e" opacity="0.86" />
  <rect x="344" y="164" width="112" height="124" rx="4" fill="#0d9488" opacity="0.88" />
  <!-- Campus Boulevard & Reflection -->
  <path d="M0 302 Q200 288 400 302 T800 294 L800 450 L0 450 Z" fill="url(#kmu-plaza)" />
  <path d="M0 326 Q240 312 440 328 T800 318 L800 332 Q560 342 360 330 T0 336 Z" fill="url(#kmu-gold)" opacity="0.46" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">高雄醫學大學 KAOHSIUNG MEDICAL UNIVERSITY</text>
  <text x="400" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際事務處 · 海外交換學生、跨國雙聯學位、臨床見實習與出國獎補助</text>
</svg>
