<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="中國文化大學陽明山華岡校區大義館、大恩館與古典宮殿建築意象圖">
  <defs>
    <linearGradient id="pccu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="55%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="pccu-hills" x1="0%" y1="0%" x2="0%" y2="100%">
