  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="2.2">中國文化大學 CHINESE CULTURE UNIVERSITY</text>
  <text x="400" y="422" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">國際暨兩岸事務處（國合組／兩岸組）· 外語學院各系所交換留學計畫</text>
