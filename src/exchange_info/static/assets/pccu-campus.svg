      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="pccu-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pccu-plaza" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f1111" />
      <stop offset="50%" stop-color="#5c1919" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pccu-sky)" />
  <!-- Hwakang Yangmingshan Sun & Mist Glow -->
  <circle cx="645" cy="105" r="56" fill="#fde68a" opacity="0.22" />
  <circle cx="645" cy="105" r="34" fill="#fef3c7" opacity="0.45" />
  <!-- Yangmingshan Mountain Ridge Silhouette -->
  <path d="M0 320 Q200 220 400 288 T800 245 L800 332 L0 332 Z" fill="url(#pccu-hills)" opacity="0.76" />
  <!-- Hwakang Palace-Style Campus Buildings (Da-En / Da-Yi /曉峯紀念館) -->
  <polygon points="190,178 400,118 610,178" fill="url(#pccu-roof)" />
  <rect x="220" y="178" width="360" height="148" rx="4" fill="#fffbeb" opacity="0.95" />
  <rect x="252" y="202" width="38" height="124" rx="3" fill="#991b1b" opacity="0.88" />
  <rect x="312" y="202" width="38" height="124" rx="3" fill="#991b1b" opacity="0.88" />
  <path d="M368 326 L368 216 A32 32 0 0 1 432 216 L432 326 Z" fill="#7f1d1d" opacity="0.92" />
  <rect x="450" y="202" width="38" height="124" rx="3" fill="#991b1b" opacity="0.88" />
  <rect x="510" y="202" width="38" height="124" rx="3" fill="#991b1b" opacity="0.88" />
