  <path d="M0 302 Q200 288 400 302 T800 294 L800 450 L0 450 Z" fill="url(#cmu-plaza)" />
  <path d="M0 326 Q240 312 440 328 T800 318 L800 332 Q560 342 360 330 T0 336 Z" fill="url(#cmu-gold)" opacity="0.44" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">中國醫藥大學 CHINA MEDICAL UNIVERSITY</text>
  <text x="400" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際事務處 · 海外交換學生、跨國雙聯學位、臨床見實習與出國獎補助</text>
