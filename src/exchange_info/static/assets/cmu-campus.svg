<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="中國醫藥大學臺中水湳校本部卓越大樓、關懷大樓與英才校區校園意象圖">
  <defs>
    <linearGradient id="cmu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="55%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cmu-plaza" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cmu-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cmu-sky)" />
  <!-- Taichung Shuinan Smart City & Central Park Horizon -->
  <circle cx="658" cy="86" r="56" fill="#fde68a" opacity="0.24" />
  <circle cx="658" cy="86" r="34" fill="#fef3c7" opacity="0.54" />
  <path d="M0 274 Q220 196 450 246 T800 200 L800 310 L0 310 Z" fill="#1e293b" opacity="0.55" />
  <!-- CMU Shuinan Campus Excellence Building (卓越大樓) & Care Building (關懷大樓) -->
  <rect x="156" y="142" width="488" height="168" rx="8" fill="#f8fafc" opacity="0.96" />
  <rect x="308" y="96" width="184" height="214" rx="6" fill="#ffffff" />
  <polygon points="292,96 400,62 508,96" fill="#991b1b" />
  <circle cx="400" cy="132" r="17" fill="#7f1d1d" />
  <path d="M393 132 H407 M400 125 V139" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round" />
  <!-- Biomedical & Chinese Medicine Windows -->
  <rect x="190" y="172" width="40" height="110" rx="3" fill="#991b1b" opacity="0.86" />
  <rect x="244" y="172" width="40" height="110" rx="3" fill="#991b1b" opacity="0.86" />
  <rect x="516" y="172" width="40" height="110" rx="3" fill="#991b1b" opacity="0.86" />
  <rect x="570" y="172" width="40" height="110" rx="3" fill="#991b1b" opacity="0.86" />
  <rect x="344" y="164" width="112" height="124" rx="4" fill="#b91c1c" opacity="0.88" />
