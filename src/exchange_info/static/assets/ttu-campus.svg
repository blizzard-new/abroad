<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="大同大學 Tatung University Shangzhi Education and Research Building Campus">
  <defs>
    <linearGradient id="ttuSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14325c"/>
      <stop offset="55%" stop-color="#2e5e99"/>
      <stop offset="100%" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="ttuDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c7089"/>
      <stop offset="100%" stop-color="#334459"/>
    </linearGradient>
    <linearGradient id="ttuLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c895d"/>
      <stop offset="100%" stop-color="#1d5234"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="630" fill="url(#ttuSky)"/>
  <circle cx="980" cy="120" r="50" fill="#fde396" opacity="0.88"/>

  <!-- Shangzhi Education and Research Building (尚志教育研究館) Neoclassical Rotunda & Colonnade -->
  <g transform="translate(170, 145)">
    <!-- Central Neoclassical Dome -->
    <path d="M310 95 A120 95 0 0 1 550 95 Z" fill="url(#ttuDome)" stroke="#d8cfc2" stroke-width="3"/>
    <rect x="418" y="-18" width="24" height="22" fill="#d8cfc2"/>
    <line x1="430" y1="-42" x2="430" y2="-18" stroke="#f2c94c" stroke-width="4"/>

    <!-- Drum of Dome -->
    <rect x="300" y="92" width="260" height="32" fill="#efe9df" stroke="#998f80" stroke-width="2"/>

    <!-- Main Building Facade -->
    <rect x="20" y="124" width="820" height="175" rx="4" fill="#f7f3eb" stroke="#8c8273" stroke-width="2.5"/>
    <rect x="10" y="114" width="840" height="14" fill="#dfd7c8" stroke="#8c8273" stroke-width="2"/>

    <!-- Central Pediment (山牆) -->
    <polygon points="240,124 430,56 620,124" fill="#fcfaf5" stroke="#8c8273" stroke-width="3"/>
    <polygon points="268,118 430,66 592,118" fill="#e6decb"/>
    <circle cx="430" cy="98" r="14" fill="#1b467a" stroke="#f2c94c" stroke-width="2.5"/>

    <!-- Corinthian Columns under Portico -->
    <g fill="#fcfaf5" stroke="#9e9484" stroke-width="2">
      <rect x="265" y="124" width="22" height="165"/>
      <rect x="325" y="124" width="22" height="165"/>
      <rect x="385" y="124" width="22" height="165"/>
      <rect x="453" y="124" width="22" height="165"/>
      <rect x="513" y="124" width="22" height="165"/>
      <rect x="573" y="124" width="22" height="165"/>
    </g>

    <!-- Windows Left & Right Wings -->
    <g fill="#23486e" opacity="0.88">
      <rect x="52" y="150" width="36" height="44" rx="2"/>
      <rect x="112" y="150" width="36" height="44" rx="2"/>
      <rect x="172" y="150" width="36" height="44" rx="2"/>
      <rect x="52" y="216" width="36" height="44" rx="2"/>
      <rect x="112" y="216" width="36" height="44" rx="2"/>
      <rect x="172" y="216" width="36" height="44" rx="2"/>

      <rect x="652" y="150" width="36" height="44" rx="2"/>
      <rect x="712" y="150" width="36" height="44" rx="2"/>
      <rect x="772" y="150" width="36" height="44" rx="2"/>
      <rect x="652" y="216" width="36" height="44" rx="2"/>
      <rect x="712" y="216" width="36" height="44" rx="2"/>
      <rect x="772" y="216" width="36" height="44" rx="2"/>
    </g>

    <!-- Grand Steps -->
    <rect x="235" y="289" width="390" height="12" fill="#d9d1c3"/>
    <rect x="215" y="299" width="430" height="12" fill="#c7beae"/>
  </g>

  <!-- Campus Green Lawn & Banyan Boulevard -->
  <rect x="0" y="455" width="1200" height="175" fill="url(#ttuLawn)"/>
  <text x="600" y="578" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="bold" opacity="0.94">大同大學 Tatung University (TTU)</text>
</svg>
