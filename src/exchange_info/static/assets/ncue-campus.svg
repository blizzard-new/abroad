  <text x="400" y="420" text-anchor="middle" fill="#ccfbf1" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際暨兩岸事務處（學生交流組）· 赴國外非大陸與大陸地區姊妹校交換、雙聯學制與學海獎補助</text>
