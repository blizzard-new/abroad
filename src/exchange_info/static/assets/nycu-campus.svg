<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立陽明交通大學竹湖浩然圖書館與陽明山麓雙校區意象圖">
  <defs>
    <linearGradient id="nycu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a57" />
      <stop offset="55%" stop-color="#0033a0" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="nycu-lake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="nycu-hills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="nycu-library" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nycu-sky)" />
  <!-- Hsinchu Tech & Biomedical Innovation Glow -->
  <circle cx="645" cy="110" r="56" fill="#38bdf8" opacity="0.22" />
  <circle cx="645" cy="110" r="34" fill="#bae6fd" opacity="0.45" />
  <!-- Taipei Yangming Campus Qilian Mountain Silhouette -->
  <path d="M0 320 Q160 220 330 295 T700 265 L800 315 L800 330 L0 330 Z" fill="url(#nycu-hills)" opacity="0.72" />
  <!-- Hsinchu Guangfu Campus Haoran Library & Twin Campus Towers -->
  <rect x="210" y="175" width="380" height="150" rx="6" fill="url(#nycu-library)" opacity="0.94" />
  <polygon points="350,130 400,98 450,130 450,175 350,175" fill="#e0f2fe" />
  <rect x="240" y="200" width="38" height="95" rx="4" fill="#0033a0" opacity="0.82" />
  <rect x="298" y="200" width="38" height="95" rx="4" fill="#0033a0" opacity="0.82" />
  <rect x="366" y="152" width="68" height="143" rx="6" fill="#1e3a8a" opacity="0.88" />
  <rect x="464" y="200" width="38" height="95" rx="4" fill="#0033a0" opacity="0.82" />
  <rect x="522" y="200" width="38" height="95" rx="4" fill="#0033a0" opacity="0.82" />
  <!-- Bamboo Lake (竹湖) Water & Reflection -->
  <path d="M0 324 Q240 312 440 324 T800 318 L800 450 L0 450 Z" fill="url(#nycu-lake)" />
  <ellipse cx="400" cy="346" rx="190" ry="8" fill="#bae6fd" opacity="0.22" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="2.2">國立陽明交通大學 NATIONAL YANG MING CHIAO TUNG UNIVERSITY</text>
  <text x="400" y="422" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">國際事務處國際合作組 · 校級出國交換與臺灣聯大系統交換計畫</text>
</svg>
