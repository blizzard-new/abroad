  <text x="40" y="56" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">國立臺中科技大學 NATIONAL TAICHUNG UNIVERSITY OF SCIENCE AND TECHNOLOGY</text>
  <text x="40" y="86" fill="#e0f2fe" font-family="sans-serif" font-size="15" letter-spacing="1">Sanmin · Minsheng · Ntunhs Campuses · Office of International Affairs (OIA)</text>
