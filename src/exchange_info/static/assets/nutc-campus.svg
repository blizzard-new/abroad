      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Taichung Urban Sky -->
  <rect width="800" height="500" fill="url(#nutcSky)"/>
  <!-- Central Taiwan Distant Hills -->
  <path d="M0 330 Q180 250 380 295 T720 260 L800 285 L800 370 L0 370 Z" fill="#0369a1" opacity="0.65"/>
  <!-- NUTC Sanmin Campus Chung-Cheng & Information Buildings (三民校區中正大樓與資訊大樓意象) -->
  <rect x="120" y="165" width="560" height="205" rx="6" fill="url(#nutcBuilding)" stroke="#0284c7" stroke-width="2"/>
  <rect x="295" y="130" width="210" height="240" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  <rect x="295" y="122" width="210" height="14" rx="2" fill="#0f766e"/>
  <!-- Entrance Archway -->
  <rect x="355" y="275" width="90" height="95" rx="4" fill="#1e3a8a"/>
  <!-- Windows -->
  <rect x="150" y="195" width="55" height="36" fill="#0284c7"/>
  <rect x="220" y="195" width="55" height="36" fill="#0284c7"/>
  <rect x="150" y="250" width="55" height="36" fill="#0284c7"/>
  <rect x="220" y="250" width="55" height="36" fill="#0284c7"/>
  <rect x="525" y="195" width="55" height="36" fill="#0284c7"/>
  <rect x="595" y="195" width="55" height="36" fill="#0284c7"/>
  <rect x="525" y="250" width="55" height="36" fill="#0284c7"/>
  <rect x="595" y="250" width="55" height="36" fill="#0284c7"/>
  <rect x="330" y="165" width="140" height="44" fill="#0f766e"/>
