<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="文藻外語大學高雄三民校區正氣樓、至善樓與歐式紅磚迴廊建築意象圖">
  <defs>
    <linearGradient id="wzu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="wzu-trees" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="wzu-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="wzu-plaza" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#wzu-sky)" />
  <!-- Kaohsiung Warm Sun & Ursuline Cross Starlight Glow -->
  <circle cx="648" cy="102" r="56" fill="#fde68a" opacity="0.22" />
  <circle cx="648" cy="102" r="34" fill="#fef3c7" opacity="0.45" />
  <!-- Green Banyan & Palm Silhouette -->
  <path d="M0 322 Q200 236 400 290 T800 250 L800 332 L0 332 Z" fill="url(#wzu-trees)" opacity="0.78" />
  <!-- Wenzao Ursuline Campus Architecture (Zhengqi Hall / Zhishan Hall / Brick Archways) -->
  <polygon points="185,176 400,116 615,176" fill="url(#wzu-roof)" />
  <rect x="216" y="176" width="368" height="150" rx="4" fill="#fffbeb" opacity="0.96" />
  <rect x="248" y="202" width="40" height="124" rx="3" fill="#065f46" opacity="0.88" />
  <rect x="310" y="202" width="40" height="124" rx="3" fill="#065f46" opacity="0.88" />
  <path d="M368 326 L368 214 A32 32 0 0 1 432 214 L432 326 Z" fill="#047857" opacity="0.92" />
  <rect x="450" y="202" width="40" height="124" rx="3" fill="#065f46" opacity="0.88" />
  <rect x="512" y="202" width="40" height="124" rx="3" fill="#065f46" opacity="0.88" />
  <!-- Ursuline Serviam Emblem Cross Accent -->
  <rect x="396" y="132" width="8" height="32" rx="2" fill="#fde68a" />
  <rect x="386" y="142" width="28" height="8" rx="2" fill="#fde68a" />
