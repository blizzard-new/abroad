  <path d="M0 326 Q240 316 440 326 T800 320 L800 450 L0 450 Z" fill="url(#wzu-plaza)" />
  <ellipse cx="400" cy="348" rx="185" ry="8" fill="#fde68a" opacity="0.22" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" letter-spacing="1.8">文藻外語大學 WENZAO URSULINE UNIVERSITY OF LANGUAGES</text>
  <text x="400" y="422" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.5">國際暨兩岸合作處（國合處境外組）· 六大語組暨雙軌（一般組／語言學習組）交換計畫</text>
