<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立屏東科技大學北大武山、靜思湖畔與國家公園森林校園意象圖">
  <defs>
    <linearGradient id="npust-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="npust-lawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="npust-lake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="npust-bldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#npust-sky)" />
  <!-- Pingtung Tropical Sun & Mount Dawu (北大武山) Silhouette -->
  <circle cx="650" cy="84" r="56" fill="#fde68a" opacity="0.28" />
  <circle cx="650" cy="84" r="34" fill="#fef3c7" opacity="0.64" />
  <path d="M0 264 L160 158 L310 218 L510 116 L690 198 L800 162 L800 310 L0 310 Z" fill="#065f46" opacity="0.58" />
  <path d="M120 282 L290 186 L460 236 L640 164 L800 228 L800 310 L120 310 Z" fill="#047857" opacity="0.48" />
  <!-- NPUST Administration Building & Library Iconic Silhouette -->
  <rect x="260" y="188" width="280" height="106" rx="4" fill="url(#npust-bldg)" opacity="0.94" />
  <polygon points="246,190 400,136 554,190" fill="#d97706" opacity="0.96" />
  <rect x="364" y="160" width="72" height="134" fill="#fef9c3" opacity="0.95" />
  <rect x="284" y="208" width="22" height="58" fill="#064e3b" opacity="0.65" />
  <rect x="322" y="208" width="22" height="58" fill="#064e3b" opacity="0.65" />
  <rect x="456" y="208" width="22" height="58" fill="#064e3b" opacity="0.65" />
  <rect x="494" y="208" width="22" height="58" fill="#064e3b" opacity="0.65" />
  <rect x="382" y="218" width="36" height="76" rx="18" fill="#064e3b" opacity="0.78" />
  <!-- Neipu Forest Campus Lawn & Jingsi Lake (靜思湖與牧場綠林) -->
  <path d="M0 294 Q240 280 420 294 T800 288 L800 450 L0 450 Z" fill="url(#npust-lawn)" />
  <ellipse cx="400" cy="336" rx="230" ry="24" fill="url(#npust-lake)" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">國立屏東科技大學 NATIONAL PINGTUNG UNIVERSITY OF SCIENCE AND TECHNOLOGY</text>
  <text x="400" y="422" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.2">國際事務處 · 全球姊妹校交換學生、跨國雙聯學制、教育部學海系列計畫與海外研習獎補助</text>
</svg>
