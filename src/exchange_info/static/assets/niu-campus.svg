<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4d6e"/>
      <stop offset="45%" stop-color="#3c82a8"/>
      <stop offset="80%" stop-color="#8ec5db"/>
      <stop offset="100%" stop-color="#e9f4f8"/>
    </linearGradient>
    <linearGradient id="sunGlow" cx="78%" cy="24%" r="32%" fx="78%" fy="24%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd584" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd584" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c5e7a"/>
      <stop offset="100%" stop-color="#5687a1"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d6a5e"/>
      <stop offset="100%" stop-color="#4e8f7c"/>
    </linearGradient>
    <linearGradient id="brickMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a83b2b"/>
      <stop offset="100%" stop-color="#7d2619"/>
    </linearGradient>
    <linearGradient id="brickLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c44d3b"/>
      <stop offset="100%" stop-color="#963223"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c8c4a"/>
      <stop offset="55%" stop-color="#3a7338"/>
      <stop offset="100%" stop-color="#285427"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfe6f7"/>
      <stop offset="100%" stop-color="#5ca4c7"/>
    </linearGradient>
  </defs>

  <!-- Sky & Lanyang Morning Sun -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <ellipse cx="940" cy="150" rx="340" ry="240" fill="url(#sunGlow)"/>
  <circle cx="940" cy="145" r="46" fill="#fff3c4" opacity="0.9"/>

  <!-- Distant Snow Mountain Range (雪山山脈) & Gueishan Island (龜山島) -->
  <path d="M0 360 L110 245 L220 290 L350 210 L490 275 L630 225 L760 310 L860 340 L1200 340 L1200 420 L0 420 Z" fill="url(#mountainFar)" opacity="0.82"/>
  <!-- Gueishan Island on the Pacific Horizon -->
  <path d="M905 338 Q945 292 995 305 Q1035 314 1062 332 L1095 336 L1095 344 L890 344 Z" fill="#234f68" opacity="0.9"/>
  <rect x="760" y="340" width="440" height="32" fill="#2d769c" opacity="0.75"/>

  <!-- Midground Foothills -->
  <path d="M0 380 L160 295 L310 340 L480 285 L670 345 L830 355 L1200 365 L1200 440 L0 440 Z" fill="url(#mountainMid)"/>

  <!-- Campus Lawn & Shennong Avenue -->
  <rect x="0" y="420" width="1200" height="210" fill="url(#lawn)"/>
  <path d="M460 630 L555 455 L645 455 L740 630 Z" fill="#d8cbb8"/>
  <path d="M485 630 L562 455 L638 455 L715 630 Z" fill="#e6dccb"/>

  <!-- Left Wing: NIU Library & Information Building (圖書資訊館) -->
  <g transform="translate(150, 265)">
    <rect x="0" y="35" width="230" height="145" rx="4" fill="url(#brickMain)"/>
    <rect x="12" y="20" width="206" height="22" rx="2" fill="#e8dfd1"/>
    <polygon points="0,35 115,0 230,35" fill="#632016"/>
    <!-- Windows -->
    <g fill="url(#glass)">
      <rect x="24" y="54" width="34" height="36" rx="2"/>
      <rect x="72" y="54" width="34" height="36" rx="2"/>
      <rect x="120" y="54" width="34" height="36" rx="2"/>
      <rect x="168" y="54" width="34" height="36" rx="2"/>
      <rect x="24" y="104" width="34" height="36" rx="2"/>
      <rect x="72" y="104" width="34" height="36" rx="2"/>
      <rect x="120" y="104" width="34" height="36" rx="2"/>
      <rect x="168" y="104" width="34" height="36" rx="2"/>
    </g>
  </g>

  <!-- Right Wing: College of Bioresources & Engineering Building -->
  <g transform="translate(820, 265)">
    <rect x="0" y="35" width="230" height="145" rx="4" fill="url(#brickMain)"/>
    <rect x="12" y="20" width="206" height="22" rx="2" fill="#e8dfd1"/>
    <polygon points="0,35 115,0 230,35" fill="#632016"/>
    <g fill="url(#glass)">
      <rect x="24" y="54" width="34" height="36" rx="2"/>
      <rect x="72" y="54" width="34" height="36" rx="2"/>
      <rect x="120" y="54" width="34" height="36" rx="2"/>
      <rect x="168" y="54" width="34" height="36" rx="2"/>
      <rect x="24" y="104" width="34" height="36" rx="2"/>
      <rect x="72" y="104" width="34" height="36" rx="2"/>
      <rect x="120" y="104" width="34" height="36" rx="2"/>
      <rect x="168" y="104" width="34" height="36" rx="2"/>
    </g>
  </g>

  <!-- Centerpiece: NIU Administration Building & Shennong Red-Brick Archway (行政大樓與紅磚拱門意象) -->
  <g transform="translate(405, 195)">
    <!-- Main Administration Tower -->
    <rect x="25" y="55" width="340" height="205" rx="4" fill="url(#brickLight)"/>
    <rect x="15" y="42" width="360" height="18" rx="3" fill="#e8dfd1"/>
    <!-- Central Pediment & Clock Tower -->
    <rect x="130" y="8" width="130" height="48" fill="url(#brickMain)"/>
    <polygon points="118,12 195,-32 272,12" fill="#5e1b12"/>
    <circle cx="195" cy="30" r="16" fill="#fff8e8" stroke="#d4af37" stroke-width="3"/>
    <line x1="195" y1="30" x2="195" y2="20" stroke="#2c3e50" stroke-width="2.5"/>
    <line x1="195" y1="30" x2="204" y2="30" stroke="#2c3e50" stroke-width="2"/>

    <!-- Columns & Windows -->
    <g fill="#f0e8dc">
      <rect x="42" y="60" width="10" height="195"/>
      <rect x="118" y="60" width="10" height="195"/>
      <rect x="262" y="60" width="10" height="195"/>
      <rect x="338" y="60" width="10" height="195"/>
    </g>

    <g fill="url(#glass)">
      <rect x="62" y="75" width="44" height="34" rx="2"/>
      <rect x="145" y="75" width="42" height="34" rx="2"/>
      <rect x="203" y="75" width="42" height="34" rx="2"/>
      <rect x="284" y="75" width="44" height="34" rx="2"/>

      <rect x="62" y="122" width="44" height="34" rx="2"/>
      <rect x="145" y="122" width="100" height="34" rx="2"/>
      <rect x="284" y="122" width="44" height="34" rx="2"/>
    </g>

    <!-- Grand Entrance Arch -->
    <path d="M148 260 L148 202 A47 47 0 0 1 242 202 L242 260 Z" fill="#233746"/>
    <path d="M144 260 L144 200 A51 51 0 0 1 246 200 L246 260" fill="none" stroke="#f0e8dc" stroke-width="6"/>
    <rect x="135" y="168" width="120" height="20" rx="3" fill="#f5efe6"/>
    <text x="195" y="183" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="13" font-weight="bold" fill="#5e1b12" text-anchor="middle">國立宜蘭大學 NIU</text>
  </g>

  <!-- Campus Trees -->
  <g fill="#2d632e">
    <circle cx="110" cy="415" r="42"/>
    <circle cx="145" cy="425" r="34"/>
    <circle cx="395" cy="430" r="32"/>
    <circle cx="805" cy="430" r="32"/>
    <circle cx="1055" cy="425" r="36"/>
    <circle cx="1095" cy="415" r="44"/>
  </g>
</svg>
