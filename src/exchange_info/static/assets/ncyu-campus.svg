<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ncyuSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="lantanWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ncyuHall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <!-- Alishan & Lantan Emerald Sky -->
  <rect width="800" height="500" fill="url(#ncyuSky)"/>
  <!-- Alishan Mountain Silhouette -->
  <path d="M0 320 Q160 220 340 285 T680 245 L800 280 L800 365 L0 365 Z" fill="#065f46" opacity="0.85"/>
  <path d="M0 345 Q240 275 480 325 T800 300 L800 365 L0 365 Z" fill="#15803d" opacity="0.9"/>
  <!-- NCYU Administration & International House (蘭潭校區行政大樓與國際交流學園意象) -->
  <rect x="130" y="175" width="540" height="190" rx="4" fill="url(#ncyuHall)" stroke="#b45309" stroke-width="2"/>
  <rect x="315" y="140" width="170" height="225" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <polygon points="300,140 400,102 500,140" fill="#047857"/>
  <!-- Entrance Archway -->
  <path d="M360 365 L360 275 Q400 245 440 275 L440 365 Z" fill="#064e3b"/>
  <!-- Windows -->
  <rect x="160" y="205" width="55" height="36" fill="#064e3b"/>
  <rect x="235" y="205" width="55" height="36" fill="#064e3b"/>
  <rect x="160" y="260" width="55" height="36" fill="#064e3b"/>
  <rect x="235" y="260" width="55" height="36" fill="#064e3b"/>
  <rect x="510" y="205" width="55" height="36" fill="#064e3b"/>
  <rect x="585" y="205" width="55" height="36" fill="#064e3b"/>
  <rect x="510" y="260" width="55" height="36" fill="#064e3b"/>
  <rect x="585" y="260" width="55" height="36" fill="#064e3b"/>
  <rect x="345" y="175" width="110" height="45" fill="#047857"/>
  <!-- Lantan Lake & Botanical Lawn -->
  <rect x="0" y="365" width="800" height="135" fill="#14532d"/>
  <ellipse cx="400" cy="440" rx="350" ry="50" fill="url(#lantanWater)"/>
  <!-- Title Banner -->
  <text x="40" y="58" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700" letter-spacing="2">國立嘉義大學 NATIONAL CHIAYI UNIVERSITY</text>
  <text x="40" y="88" fill="#d1fae5" font-family="sans-serif" font-size="15" letter-spacing="1">Lantan · Minsyong · Sinmin · Linsen Campuses · Office of International Affairs</text>
</svg>
