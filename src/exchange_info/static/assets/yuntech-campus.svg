<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立雲林科技大學鐘樓、雲夢湖與綠色科技設計校園意象圖">
  <defs>
    <linearGradient id="yuntech-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#097ea5" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="yuntech-lake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="yuntech-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="yuntech-plaza" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#yuntech-sky)" />
  <!-- Douliu Sun & Green Campus Glow -->
  <circle cx="652" cy="96" r="54" fill="#fde68a" opacity="0.22" />
  <circle cx="652" cy="96" r="32" fill="#fef3c7" opacity="0.45" />
  <!-- Distant Mountain & Foliage Silhouette -->
  <path d="M0 320 Q190 250 400 288 T800 256 L800 332 L0 332 Z" fill="url(#yuntech-lake)" opacity="0.78" />
  <!-- YunTech Main Administration & Clock Tower (鐘樓) -->
  <polygon points="366,118 400,82 434,118" fill="url(#yuntech-roof)" />
  <rect x="372" y="118" width="56" height="208" rx="3" fill="#f8fafc" opacity="0.97" />
  <circle cx="400" cy="148" r="14" fill="#097ea5" />
  <circle cx="400" cy="148" r="10" fill="#fef3c7" />
  <line x1="400" y1="148" x2="400" y2="141" stroke="#042f2e" stroke-width="2" />
  <line x1="400" y1="148" x2="406" y2="148" stroke="#042f2e" stroke-width="2" />
  <!-- Left & Right Academic Wings -->
  <polygon points="184,186 372,158 372,186" fill="url(#yuntech-roof)" />
  <polygon points="428,158 616,186 428,186" fill="url(#yuntech-roof)" />
  <rect x="196" y="186" width="176" height="140" rx="4" fill="#f1f5f9" opacity="0.95" />
  <rect x="428" y="186" width="176" height="140" rx="4" fill="#f1f5f9" opacity="0.95" />
  <rect x="220" y="208" width="36" height="118" rx="3" fill="#097ea5" opacity="0.88" />
  <rect x="274" y="208" width="36" height="118" rx="3" fill="#097ea5" opacity="0.88" />
  <rect x="326" y="208" width="32" height="118" rx="3" fill="#0d9488" opacity="0.88" />
  <rect x="442" y="208" width="32" height="118" rx="3" fill="#0d9488" opacity="0.88" />
  <rect x="490" y="208" width="36" height="118" rx="3" fill="#097ea5" opacity="0.88" />
  <rect x="544" y="208" width="36" height="118" rx="3" fill="#097ea5" opacity="0.88" />
  <path d="M382 326 L382 238 A18 18 0 0 1 418 238 L418 326 Z" fill="#065f46" opacity="0.92" />
  <!-- Foreground Yun-Meng Lake (雲夢湖) & Plaza -->
  <path d="M0 326 Q240 314 440 326 T800 320 L800 450 L0 450 Z" fill="url(#yuntech-plaza)" />
  <ellipse cx="400" cy="348" rx="196" ry="8" fill="#fde68a" opacity="0.24" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700" letter-spacing="1.2">國立雲林科技大學 NATIONAL YUNLIN UNIVERSITY OF SCIENCE AND TECHNOLOGY</text>
  <text x="400" y="422" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.4">國際事務處（國際交流組）· 出國交換學生計畫、雙聯學制與王秋雄榮譽博士德日美獎助金</text>
</svg>
