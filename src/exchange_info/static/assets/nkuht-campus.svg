<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="nkuhtTitle nkuhtDesc">
  <title id="nkuhtTitle">國立高雄餐旅大學 National Kaohsiung University of Hospitality and Tourism</title>
  <desc id="nkuhtDesc">Campus illustration of National Kaohsiung University of Hospitality and Tourism (NKUHT) featuring European castle-style arches, hospitality and culinary motifs, and Kaohsiung sky.</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="52%" stop-color="#1e4e79"/>
      <stop offset="100%" stop-color="#f3c68f"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f2"/>
      <stop offset="100%" stop-color="#e5d5c3"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e3b24"/>
      <stop offset="100%" stop-color="#6e2211"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e6f56"/>
      <stop offset="100%" stop-color="#174231"/>
    </linearGradient>
  </defs>

  <!-- Sky & Southern Sun -->
  <rect width="1200" height="630" fill="url(#skyGrad)"/>
  <circle cx="960" cy="150" r="68" fill="#ffe4a3" opacity="0.88"/>
  <circle cx="960" cy="150" r="95" fill="#ffe4a3" opacity="0.22"/>

  <!-- Subtle Airplane Path (Aviation & Tourism) -->
  <path d="M140 165 Q 520 70 910 135" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.55"/>
  <polygon points="920,136 894,126 901,136 892,145" fill="#ffffff" opacity="0.85"/>

  <!-- Distant Kaohsiung Hills & Palms Silhouette -->
  <path d="M0 430 Q 260 375 560 415 T 1200 400 L 1200 500 L 0 500 Z" fill="#183b56" opacity="0.65"/>

  <!-- NKUHT Iconic European Castle Archway & Administration Hall -->
  <g transform="translate(150, 175)">
    <!-- Side Wings -->
    <rect x="40" y="130" width="820" height="195" rx="6" fill="url(#archGrad)" stroke="#c7b299" stroke-width="3"/>
    <polygon points="25,130 450,55 875,130" fill="url(#roofGrad)"/>

    <!-- Central Clock & Bell Tower -->
    <rect x="355" y="25" width="190" height="300" rx="6" fill="url(#archGrad)" stroke="#bfa78b" stroke-width="3"/>
    <polygon points="340,30 450,-35 560,30" fill="url(#roofGrad)"/>
    <circle cx="450" cy="82" r="28" fill="#ffffff" stroke="#8c6d46" stroke-width="5"/>
    <line x1="450" y1="82" x2="450" y2="64" stroke="#1e3a5f" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="450" y1="82" x2="465" y2="82" stroke="#9e3b24" stroke-width="3" stroke-linecap="round"/>

    <!-- Grand Arches -->
    <path d="M110 325 L110 215 A45 45 0 0 1 200 215 L200 325 Z" fill="#1e3a5f"/>
    <path d="M235 325 L235 215 A45 45 0 0 1 325 215 L325 325 Z" fill="#1e3a5f"/>
    <path d="M395 325 L395 190 A55 55 0 0 1 505 190 L505 325 Z" fill="#132942"/>
    <path d="M575 325 L575 215 A45 45 0 0 1 665 215 L665 325 Z" fill="#1e3a5f"/>
    <path d="M700 325 L700 215 A45 45 0 0 1 790 215 L790 325 Z" fill="#1e3a5f"/>

    <!-- Upper Windows -->
    <rect x="125" y="150" width="60" height="34" rx="4" fill="#2c5882"/>
    <rect x="250" y="150" width="60" height="34" rx="4" fill="#2c5882"/>
    <rect x="590" y="150" width="60" height="34" rx="4" fill="#2c5882"/>
    <rect x="715" y="150" width="60" height="34" rx="4" fill="#2c5882"/>
  </g>

  <!-- Foreground Courtyard & Lawn -->
  <rect x="0" y="495" width="1200" height="135" fill="url(#lawnGrad)"/>
  <path d="M470 495 L730 495 L860 630 L340 630 Z" fill="#d9c3aa" opacity="0.88"/>

  <!-- Badge & Title Overlay -->
  <rect x="55" y="45" width="520" height="92" rx="14" fill="#0f2942" opacity="0.82" stroke="#f3c68f" stroke-width="2"/>
  <text x="82" y="86" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">國立高雄餐旅大學 NKUHT</text>
  <text x="82" y="116" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#f3c68f" letter-spacing="1">National Kaohsiung University of Hospitality and Tourism</text>
</svg>
