<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="長榮大學長榮堂竹構建築、行政大樓十字塔與珍古德根與芽永續校園意象圖">
  <defs>
    <linearGradient id="cjcu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="52%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cjcu-lawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="cjcu-bamboo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="cjcu-tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cjcu-sky)" />
  <!-- Tainan Gueiren Warm Sun & Eco-Campus Horizon -->
  <circle cx="648" cy="86" r="54" fill="#fde68a" opacity="0.28" />
  <circle cx="648" cy="86" r="32" fill="#fef3c7" opacity="0.68" />
  <path d="M0 278 Q210 236 420 268 T800 250 L800 320 L0 320 Z" fill="#115e59" opacity="0.52" />
  <!-- CJCU Administration Building & Chapel Cross Spire -->
  <rect x="210" y="182" width="190" height="114" rx="4" fill="url(#cjcu-tower)" opacity="0.93" />
  <rect x="282" y="128" width="46" height="168" rx="3" fill="#ffffff" opacity="0.96" />
  <!-- Iconic Christian Cross at Top of Spire -->
  <rect x="302" y="88" width="6" height="42" fill="#fbbf24" />
  <rect x="291" y="100" width="28" height="6" fill="#fbbf24" />
  <!-- Windows on Administration Building -->
  <rect x="228" y="204" width="20" height="54" fill="#0f766e" opacity="0.65" />
  <rect x="256" y="204" width="18" height="54" fill="#0f766e" opacity="0.65" />
  <rect x="336" y="204" width="18" height="54" fill="#0f766e" opacity="0.65" />
  <rect x="362" y="204" width="20" height="54" fill="#0f766e" opacity="0.65" />
  <!-- Chang Jung Bamboo Architecture Pavilion (長榮堂竹構地景) -->
  <path d="M430 296 Q525 154 620 296 Z" fill="url(#cjcu-bamboo)" opacity="0.92" />
  <path d="M454 296 Q525 186 596 296 Z" fill="#0f172a" opacity="0.45" />
  <line x1="478" y1="296" x2="525" y2="178" stroke="#fde68a" stroke-width="2.5" opacity="0.75" />
  <line x1="572" y1="296" x2="525" y2="178" stroke="#fde68a" stroke-width="2.5" opacity="0.75" />
  <!-- Eco-Campus Green Lawn & Shalun Railway Line Silhouette -->
  <path d="M0 294 Q260 282 480 294 T800 288 L800 450 L0 450 Z" fill="url(#cjcu-lawn)" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">長榮大學 CHANG JUNG CHRISTIAN UNIVERSITY (CJCU)</text>
  <text x="400" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.2">國際事務室 · 校級與院級赴外交換、跨國雙聯學制、教育部學海系列與國際學術交流獎補助</text>
</svg>
