<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="臺北城市科技大學關渡平原、大屯山系與北投校園意象圖">
  <defs>
    <linearGradient id="tpcu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tpcu-lawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="tpcu-river" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="tpcu-bldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tpcu-sky)" />
  <!-- Guandu Plain Sunset & Datun Mountain (大屯山系與觀音山) Silhouette -->
  <circle cx="640" cy="88" r="54" fill="#fde68a" opacity="0.28" />
  <circle cx="640" cy="88" r="32" fill="#fef3c7" opacity="0.68" />
  <path d="M0 266 L150 162 L320 220 L500 124 L680 196 L800 164 L800 310 L0 310 Z" fill="#1e3a8a" opacity="0.58" />
  <path d="M110 284 L280 190 L460 238 L640 168 L800 230 L800 310 L110 310 Z" fill="#0369a1" opacity="0.48" />
  <!-- TPCU Campus Administration & Finance Building Iconic Silhouette -->
  <rect x="256" y="182" width="288" height="112" rx="6" fill="url(#tpcu-bldg)" opacity="0.94" />
  <polygon points="244,184 400,132 556,184" fill="#0284c7" opacity="0.96" />
  <rect x="362" y="156" width="76" height="138" fill="#f0f9ff" opacity="0.96" />
  <rect x="282" y="204" width="24" height="60" fill="#0f172a" opacity="0.65" />
  <rect x="320" y="204" width="24" height="60" fill="#0f172a" opacity="0.65" />
  <rect x="456" y="204" width="24" height="60" fill="#0f172a" opacity="0.65" />
  <rect x="494" y="204" width="24" height="60" fill="#0f172a" opacity="0.65" />
  <rect x="382" y="216" width="36" height="78" rx="18" fill="#0f172a" opacity="0.78" />
  <!-- Beitou Campus Lawn & Guandu Plain Horizon -->
  <path d="M0 294 Q240 280 420 294 T800 288 L800 450 L0 450 Z" fill="url(#tpcu-lawn)" />
  <ellipse cx="400" cy="336" rx="236" ry="22" fill="url(#tpcu-river)" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">臺北城市科技大學 TAIPEI CITY UNIVERSITY OF SCIENCE AND TECHNOLOGY</text>
  <text x="400" y="422" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.2">國際事務處 · 海外姊妹校交換留學、跨國雙聯學制、教育部學海系列計畫與海外專業實習</text>
</svg>
