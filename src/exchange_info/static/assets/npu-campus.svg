<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立澎湖科技大學菊島海洋校園、跨海大橋與雙心石滬意象圖">
  <defs>
    <linearGradient id="npu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="npu-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="npu-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#99f6e4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#npu-sky)" />
  <!-- Penghu Island Sun & Ocean Glow -->
  <circle cx="650" cy="92" r="56" fill="#fde68a" opacity="0.25" />
  <circle cx="650" cy="92" r="34" fill="#fef3c7" opacity="0.56" />
