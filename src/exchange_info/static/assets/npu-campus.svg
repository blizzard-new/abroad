  <path d="M0 326 Q220 310 420 328 T800 318 L800 334 Q580 344 380 332 T0 338 Z" fill="url(#npu-wave)" opacity="0.48" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">國立澎湖科技大學 NATIONAL PENGHU UNIVERSITY OF SCIENCE AND TECHNOLOGY</text>
  <text x="400" y="420" text-anchor="middle" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">研究發展處國際事務組 · 國外與大陸地區姊妹校交換生、雙聯學制與教育部學海系列獎補助</text>
