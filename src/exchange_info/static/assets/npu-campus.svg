  <path d="M520 256 L556 196 L642 196 L686 256 Z" fill="#134e4a" opacity="0.78" />
  <line x1="118" y1="145" x2="118" y2="262" stroke="#ccfbf1" stroke-width="3" opacity="0.75" />
  <path d="M118 145 L96 122 M118 145 L144 128 M118 145 L114 176" stroke="#ccfbf1" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  <!-- NPU Main Academic Building & Maritime Archway -->
  <rect x="195" y="164" width="330" height="150" rx="6" fill="#f8fafc" opacity="0.96" />
  <rect x="322" y="118" width="76" height="196" rx="4" fill="#ffffff" />
  <polygon points="312,118 360,82 408,118" fill="#0f766e" />
  <circle cx="360" y="148" r="15" fill="#0284c7" />
  <circle cx="360" y="148" r="8" fill="#fef08a" />
  <!-- Academic Windows -->
  <rect x="218" y="188" width="40" height="94" rx="3" fill="#0284c7" opacity="0.88" />
  <rect x="268" y="188" width="40" height="94" rx="3" fill="#0284c7" opacity="0.88" />
  <rect x="412" y="188" width="40" height="94" rx="3" fill="#0284c7" opacity="0.88" />
  <rect x="462" y="188" width="40" height="94" rx="3" fill="#0284c7" opacity="0.88" />
