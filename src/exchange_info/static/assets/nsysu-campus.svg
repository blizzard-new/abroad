<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立中山大學西子灣校園意象圖">
  <defs>
    <linearGradient id="nsysu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3a4a" />
      <stop offset="50%" stop-color="#19647e" />
      <stop offset="100%" stop-color="#e07a5f" />
    </linearGradient>
    <linearGradient id="nsysu-sea" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d4b5e" />
      <stop offset="55%" stop-color="#1d748b" />
      <stop offset="100%" stop-color="#2ac7b7" />
