    <linearGradient id="nsysu-bldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d65a47" />
      <stop offset="100%" stop-color="#9e3526" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nsysu-sky)" />
  <!-- Sizihwan Sunset -->
  <circle cx="635" cy="148" r="62" fill="#ffd166" opacity="0.32" />
  <circle cx="635" cy="148" r="42" fill="#ffe599" opacity="0.45" />
  <!-- Shoushan Mountain Silhouette -->
  <path d="M0 295 Q150 185 330 245 T680 250 L800 285 L800 350 L0 350 Z" fill="#133c47" opacity="0.65" />
  <!-- Iconic Red-Brick Campus Buildings by the Bay -->
  <rect x="170" y="185" width="460" height="145" rx="6" fill="url(#nsysu-bldg)" />
  <polygon points="155,187 400,122 645,187" fill="#7d2519" />
  <rect x="205" y="210" width="48" height="95" rx="4" fill="#fdf6f0" opacity="0.88" />
  <rect x="280" y="210" width="48" height="95" rx="4" fill="#fdf6f0" opacity="0.88" />
  <rect x="356" y="198" width="88" height="132" rx="4" fill="#fdf6f0" opacity="0.94" />
  <rect x="472" y="210" width="48" height="95" rx="4" fill="#fdf6f0" opacity="0.88" />
  <rect x="547" y="210" width="48" height="95" rx="4" fill="#fdf6f0" opacity="0.88" />
  <!-- Sizihwan Waves -->
  <path d="M0 328 Q200 312 400 328 T800 322 L800 450 L0 450 Z" fill="url(#nsysu-sea)" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="3">國立中山大學 NATIONAL SUN YAT-SEN UNIVERSITY</text>
