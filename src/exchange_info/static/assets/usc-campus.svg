<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="uscSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="concreteLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="concreteDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
  </defs>
  <!-- Background Sky -->
  <rect width="800" height="500" fill="url(#uscSky)"/>
  <!-- Dazhi Mountains Backdrop -->
  <path d="M0 320 Q160 230 340 295 T680 250 L800 290 L800 380 L0 380 Z" fill="#1e3a2f" opacity="0.65"/>
  <!-- Iconic Shih Chien Exposed-Concrete Design Building (東閔紀念大樓 / A棟設計大樓意象) -->
  <rect x="90" y="135" width="380" height="235" fill="url(#concreteLight)" stroke="#475569" stroke-width="2"/>
  <polygon points="470,135 695,165 695,370 470,370" fill="url(#concreteDark)" stroke="#475569" stroke-width="2"/>
  <!-- Architectural Cantilever & Geometric Brutalist Cutouts -->
  <polygon points="70,115 500,115 470,135 90,135" fill="#94a3b8"/>
  <rect x="125" y="165" width="90" height="55" fill="#1e293b"/>
  <rect x="235" y="165" width="90" height="55" fill="#1e293b"/>
  <rect x="345" y="165" width="95" height="55" fill="#1e293b"/>
  <rect x="125" y="240" width="90" height="55" fill="#0f172a"/>
  <rect x="235" y="240" width="90" height="55" fill="#0f172a"/>
  <rect x="345" y="240" width="95" height="55" fill="#0f172a"/>
  <!-- Diagonal Stairway & Gallery Ramp Feature -->
  <polygon points="470,210 675,260 675,285 470,235" fill="#e2e8f0"/>
  <rect x="505" y="190" width="55" height="40" fill="#1e293b"/>
  <rect x="585" y="200" width="65" height="40" fill="#1e293b"/>
  <rect x="505" y="295" width="145" height="75" fill="#0f172a"/>
  <!-- Central Courtyard Lawn -->
  <rect x="0" y="370" width="800" height="130" fill="url(#lawnGrad)"/>
  <polygon points="240,370 420,370 520,500 140,500" fill="#cbd5e1" opacity="0.85"/>
  <!-- Title Banner -->
  <text x="40" y="62" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="700" letter-spacing="2">實踐大學 SHIH CHIEN UNIVERSITY</text>
  <text x="40" y="92" fill="#cbd5e1" font-family="sans-serif" font-size="15" letter-spacing="1">Taipei &amp; Kaohsiung Campuses · Office of International Affairs</text>
</svg>
