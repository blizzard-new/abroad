  <text x="400" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際教育交流處 · 菁英海外留學交換、雙學位、赴大陸頂尖大學交換與出國獎勵金</text>
