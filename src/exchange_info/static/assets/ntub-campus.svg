  <path d="M0 302 Q200 288 400 302 T800 294 L800 450 L0 450 Z" fill="url(#ntub-plaza)" />
  <path d="M0 326 Q240 312 440 328 T800 318 L800 332 Q560 342 360 330 T0 336 Z" fill="url(#ntub-gold)" opacity="0.46" />
  <text x="400" y="390" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">國立臺北商業大學 NATIONAL TAIPEI UNIVERSITY OF BUSINESS</text>
  <text x="400" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.3">國際事務處 · 姊妹校交換生、跨國雙聯學位、學海飛颺／惜珠與王春滿清寒助學金</text>
</svg>
