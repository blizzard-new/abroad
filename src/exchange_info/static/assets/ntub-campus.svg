  <circle cx="654" cy="84" r="56" fill="#fde68a" opacity="0.24" />
  <circle cx="654" cy="84" r="34" fill="#fef3c7" opacity="0.54" />
  <path d="M0 270 Q220 192 450 242 T800 194 L800 310 L0 310 Z" fill="#312e81" opacity="0.55" />
  <!-- NTUB Chengxi Building & Wuyu Building Silhouette -->
  <rect x="156" y="144" width="488" height="166" rx="8" fill="#f8fafc" opacity="0.96" />
  <rect x="308" y="96" width="184" height="214" rx="6" fill="#ffffff" />
  <polygon points="292,96 400,58 508,96" fill="#4338ca" />
  <circle cx="400" cy="132" r="18" fill="#312e81" />
  <path d="M390 134 Q400 122 410 134" stroke="#fde68a" stroke-width="3.2" fill="none" stroke-linecap="round" />
  <!-- Academic Windows -->
  <rect x="190" y="172" width="40" height="110" rx="3" fill="#4338ca" opacity="0.86" />
  <rect x="244" y="172" width="40" height="110" rx="3" fill="#4338ca" opacity="0.86" />
  <rect x="516" y="172" width="40" height="110" rx="3" fill="#4338ca" opacity="0.86" />
  <rect x="570" y="172" width="40" height="110" rx="3" fill="#4338ca" opacity="0.86" />
  <rect x="344" y="164" width="112" height="124" rx="4" fill="#4f46e5" opacity="0.88" />
