<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="真理大學 Aletheia University (AU) Tamsui Oxford College &amp; Great Chapel Illustration">
  <defs>
    <linearGradient id="auSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14284b"/>
      <stop offset="45%" stop-color="#29487d"/>
      <stop offset="78%" stop-color="#b85d43"/>
      <stop offset="100%" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="tamsuiGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="guanyinMt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e66"/>
      <stop offset="100%" stop-color="#1b2845"/>
    </linearGradient>
    <linearGradient id="tamsuiRiver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="50%" stop-color="#457b9d"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="redBrick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b54434"/>
      <stop offset="100%" stop-color="#84291e"/>
    </linearGradient>
    <linearGradient id="chapelBrick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c95340"/>
      <stop offset="100%" stop-color="#8f2d22"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
  </defs>

  <!-- Tamsui Sunset Sky -->
  <rect width="1200" height="630" fill="url(#auSky)"/>
  <circle cx="260" cy="215" r="165" fill="url(#tamsuiGlow)"/>
  <circle cx="260" cy="215" r="68" fill="#ffe599" opacity="0.82"/>

  <!-- Guanyin Mountain Silhouette across Tamsui River -->
  <path d="M0 370 Q130 305 250 325 Q370 250 490 310 Q610 275 740 340 L1200 350 L1200 430 L0 430 Z" fill="url(#guanyinMt)" opacity="0.88"/>

  <!-- Tamsui River Estuary & Golden Sunset Reflection -->
  <rect x="0" y="395" width="1200" height="70" fill="url(#tamsuiRiver)"/>
  <g fill="#ffd166" opacity="0.45">
    <rect x="190" y="405" width="140" height="4" rx="2"/>
    <rect x="210" y="416" width="105" height="4" rx="2"/>
    <rect x="175" y="427" width="165" height="4" rx="2"/>
    <rect x="225" y="438" width="85" height="3" rx="1.5"/>
  </g>

  <!-- Tamsui Hill Terraces & Royal Palms -->
  <path d="M0 450 Q420 420 840 440 Q1040 450 1200 435 L1200 630 L0 630 Z" fill="url(#lawnGrad)"/>

  <!-- Right Side: Aletheia University Great Chapel (大禮拜堂哥德式紅磚建築與高聳鐘樓) -->
  <g transform="translate(690, 130)">
    <!-- Tall Bell Tower -->
    <rect x="260" y="40" width="68" height="270" fill="url(#chapelBrick)" stroke="#f4e4d4" stroke-width="2"/>
    <polygon points="254,40 294,-35 334,40" fill="#3d405b" stroke="#f4e4d4" stroke-width="2"/>
    <!-- Cross on Spire -->
    <line x1="294" y1="-62" x2="294" y2="-32" stroke="#ffd166" stroke-width="4"/>
    <line x1="283" y1="-50" x2="305" y2="-50" stroke="#ffd166" stroke-width="4"/>
    <!-- Bell Tower Gothic Arch Windows -->
    <path d="M280 85 Q294 65 308 85 L308 135 L280 135 Z" fill="#1d3557" stroke="#f4e4d4" stroke-width="2"/>
    <path d="M280 165 Q294 145 308 165 L308 220 L280 220 Z" fill="#ffd166" opacity="0.85"/>

    <!-- Main Chapel Gable Body -->
    <polygon points="20,130 145,25 270,130 270,310 20,310" fill="url(#chapelBrick)" stroke="#f4e4d4" stroke-width="2.5"/>
    <polygon points="10,132 145,15 280,132 268,142 145,35 22,142" fill="#3d405b"/>
    <!-- Central Tall Gothic Stained-Glass Arch Window -->
    <path d="M105 135 Q145 75 185 135 L185 245 L105 245 Z" fill="#1d3557" stroke="#f4e4d4" stroke-width="3"/>
    <path d="M115 142 Q145 92 175 142 L175 238 L115 238 Z" fill="#ffd166" opacity="0.78"/>
    <line x1="145" y1="98" x2="145" y2="238" stroke="#8f2d22" stroke-width="2.5"/>
    <line x1="115" y1="175" x2="175" y2="175" stroke="#8f2d22" stroke-width="2.5"/>
    <!-- Side Gothic Windows -->
    <path d="M48 165 Q65 140 82 165 L82 245 L48 245 Z" fill="#1d3557" stroke="#f4e4d4" stroke-width="2"/>
    <path d="M208 165 Q225 140 242 165 L242 245 L208 245 Z" fill="#1d3557" stroke="#f4e4d4" stroke-width="2"/>
    <!-- Entrance Arches -->
    <path d="M122 272 Q145 250 168 272 L168 310 L122 310 Z" fill="#2b1810" stroke="#f4e4d4" stroke-width="2"/>
  </g>

  <!-- Center-Left Foreground: Historic Oxford College (牛津學堂／理學堂大書院 1882 國定古蹟) -->
  <g transform="translate(115, 235)">
    <!-- Stone Platform Base -->
    <rect x="0" y="210" width="520" height="28" rx="3" fill="#8d99ae" stroke="#edf2f4" stroke-width="1.5"/>
    <rect x="200" y="210" width="120" height="28" fill="#adb5bd"/>

    <!-- Red-Brick Main Facade -->
    <rect x="25" y="95" width="470" height="115" fill="url(#redBrick)" stroke="#f4e4d4" stroke-width="2"/>

    <!-- Traditional Minnan Curved Roof with Western Spires (中西合璧紅瓦斜頂與西式小尖塔) -->
    <path d="M5 98 Q260 55 515 98 L495 62 Q260 28 25 62 Z" fill="#9e2a2b" stroke="#f4e4d4" stroke-width="2"/>
    <!-- Central Pagoda-Style Western Spire -->
    <rect x="242" y="18" width="36" height="32" fill="#b54434" stroke="#f4e4d4" stroke-width="1.5"/>
    <polygon points="236,18 260,-18 284,18" fill="#ffd166"/>
    <!-- Corner Western Pinnacles on Swallowtail Roof -->
    <rect x="30" y="38" width="18" height="28" fill="#b54434" stroke="#f4e4d4" stroke-width="1.5"/>
    <polygon points="27,38 39,14 51,38" fill="#f4e4d4"/>
    <rect x="472" y="38" width="18" height="28" fill="#b54434" stroke="#f4e4d4" stroke-width="1.5"/>
    <polygon points="469,38 481,14 493,38" fill="#f4e4d4"/>

    <!-- Name Plaque "理學堂大書院 OXFORD COLLEGE 1882" -->
    <rect x="175" y="72" width="170" height="24" rx="3" fill="#1d3557" stroke="#ffd166" stroke-width="2"/>
    <text x="260" y="89" text-anchor="middle" fill="#ffd166" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">理學堂大書院 1882</text>

    <!-- Red-Brick Veranda Arches (拱圈迴廊) -->
    <g fill="#2b1810" stroke="#f4e4d4" stroke-width="2">
      <path d="M52 145 Q75 115 98 145 L98 210 L52 210 Z"/>
      <path d="M118 145 Q141 115 164 145 L164 210 L118 210 Z"/>
      <path d="M184 145 Q207 115 230 145 L230 210 L184 210 Z"/>
      <!-- Center Main Door -->
      <path d="M242 138 Q260 112 278 138 L278 210 L242 210 Z" fill="#ffd166" opacity="0.88"/>
      <path d="M290 145 Q313 115 336 145 L336 210 L290 210 Z"/>
      <path d="M356 145 Q379 115 402 145 L402 210 L356 210 Z"/>
      <path d="M422 145 Q445 115 468 145 L468 210 L422 210 Z"/>
    </g>
  </g>

  <!-- Title Banner at Bottom Left -->
  <g transform="translate(65, 515)">
    <rect x="0" y="0" width="1070" height="78" rx="14" fill="#0d1b2a" fill-opacity="0.78" stroke="#ffd166" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="32" y="34" fill="#ffd166" font-family="'Segoe UI', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" letter-spacing="2.5">
      ALETHEIA UNIVERSITY • TAMSUI, NEW TAIPEI CITY • OXFORD COLLEGE EST. 1882 / 1965
    </text>
    <text x="32" y="62" fill="#ffffff" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">
      真理大學國際事務中心（CIA）・全球 14 國 80 所合作姊妹校、英美西雙聯學位與交換求學指南
    </text>
  </g>
</svg>
