<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="國立聯合大學苗栗八甲與二坪山雙校區、國鼎圖書館與聯大湖意象圖">
  <defs>
    <linearGradient id="nuu-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="nuu-hills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="nuu-lake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="nuu-bldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nuu-sky)" />
  <!-- Miaoli Bajia & Erpingshan Hills Silhouette -->
  <circle cx="648" cy="86" r="52" fill="#fde68a" opacity="0.28" />
  <circle cx="648" cy="86" r="32" fill="#fef3c7" opacity="0.68" />
  <path d="M0 268 L150 172 L310 222 L490 132 L680 202 L800 166 L800 310 L0 310 Z" fill="#1e40af" opacity="0.48" />
  <path d="M100 284 L280 192 L450 238 L630 172 L800 232 L800 310 L100 310 Z" fill="#0369a1" opacity="0.46" />
  <!-- NUU Bajia Campus K.T. Li Library (國鼎圖書館) & Academic Towers Silhouette -->
  <rect x="256" y="176" width="288" height="118" rx="6" fill="url(#nuu-bldg)" opacity="0.95" />
  <rect x="348" y="142" width="104" height="152" rx="4" fill="#e2e8f0" opacity="0.96" />
  <polygon points="340,144 400,114 460,144" fill="#ea580c" opacity="0.92" />
  <rect x="280" y="198" width="24" height="68" fill="#1e3a8a" opacity="0.68" />
  <rect x="314" y="198" width="22" height="68" fill="#1e3a8a" opacity="0.68" />
  <rect x="464" y="198" width="22" height="68" fill="#1e3a8a" opacity="0.68" />
  <rect x="496" y="198" width="24" height="68" fill="#1e3a8a" opacity="0.68" />
  <rect x="378" y="168" width="44" height="96" rx="6" fill="#0284c7" opacity="0.78" />
