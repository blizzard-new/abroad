  <path d="M0 294 Q240 280 420 294 T800 288 L800 450 L0 450 Z" fill="url(#nuu-hills)" />
  <ellipse cx="400" cy="336" rx="234" ry="24" fill="url(#nuu-lake)" />
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1">國立聯合大學 NATIONAL UNITED UNIVERSITY</text>
  <text x="400" y="422" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="1.2">研究發展處國際及兩岸事務組 · 學期交換、雙聯學位、日本高專實習與教育部學海系列計畫</text>
