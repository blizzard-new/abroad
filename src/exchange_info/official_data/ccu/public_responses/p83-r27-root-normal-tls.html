 Group Introduces ChatGPT Edu \u2013 A first for Philippine Education&quot;,&quot;content_introduction&quot;:&quot;The Map\u00faa Education Group (MEG) announced its historic group-wide collaboration with OpenAI for the roll out ChatGPT Edu to its students and educators across the Philippines.&quot;,&quot;published_at&quot;:&quot;Feb 10, 2026&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;capcom-singapore-prime-manpower-mapua-collaboration&quot;,&quot;image_path&quot;:&quot;news_images\/cflO8IH7sVEysPg8Du3AdSyCW8agLZWPULFnVS8Z.jpg&quot;,&quot;title&quot;:&quot;Capcom Singapore Collaborates with Map\u00faa University to Deliver Intellectual Property and Business Education Program in the Philippines&quot;,&quot;content_introduction&quot;:&quot;Capcom Singapore has partnered with Map\u00faa University and Prime Manpower to develop an innovative educational program themed around \u2018Games, Intellectual Property &amp; Digital Culture.\u2019&quot;,&quot;published_at&quot;:&quot;Dec 16, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;buhawind-project&quot;,&quot;image_path&quot;:&quot;news_images\/wWcIsgpFfBaKEzvXJpclWuxMwRsQDyChAB1F57DN.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa and MMSU Spearhead Offshore Wind Workforce Revolution in Landmark Partnership with BENLC&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University signed a Memorandum of Agreement (MOA) with Buhawind Energy Northern Luzon Corporation (BENLC) and Mariano Marcos State University (MMSU) for Northern Luzon Offshore Wind Power Project.&quot;,&quot;published_at&quot;:&quot;Dec 10, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;2025-coursera-ai-innovation-award&quot;,&quot;image_path&quot;:&quot;news_images\/rgdsSxtMdUcyEmtMmyqsgLq8hqeCKOLLKcogJw41.png&quot;,&quot;title&quot;:&quot;Map\u00faa Honored with AI Innovation Award: A Century of Excellence Leads the Digital Frontier&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University was awarded the prestigious 2025 Coursera Outstanding Achievement Award in the Artificial Intelligence (AI) Innovation category.&quot;,&quot;published_at&quot;:&quot;Oct 25, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;innovation-led-sthm&quot;,&quot;image_path&quot;:&quot;news_images\/XRWBr0xDeHJE2NRRUQzeE6y4fjftW7D6LWrZkZ2A.png&quot;,&quot;title&quot;:&quot;Map\u00faa University redefines hospitality education with the launch of innovation-led School of Tourism and Hospitality Management&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University has officially launched its innovation-led School of Tourism and Hospitality Management (STHM), consisting of an AI-integrated curriculum.&quot;,&quot;published_at&quot;:&quot;Sep 18, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mastering-math-and-science-mapua-senior-high-school-faculty-share-insights-for-academic-excellence&quot;,&quot;image_path&quot;:&quot;news_images\/aKIykPObwAIWwirvmOOPb9E2y0lkjyNsbWlFhrnO.webp&quot;,&quot;title&quot;:&quot;Mastering Math and Science: Map\u00faa Senior high school faculty share insights for academic excellence&quot;,&quot;content_introduction&quot;:&quot;For many Filipino young learners and their parents, mastering math and science remains a persistent challenge.\r\n\r\nThis is evident in the country\u2019s subpar performance in the Program for International Student Assessment (PISA) 2022 and Trends in International Mathematics and Science Study (TIMSS) 2019, where students ranked among the lowest in math and science. The results reflect a widespread difficulty with complex problem-solving and applying concepts to real-life situations.&quot;,&quot;published_at&quot;:&quot;Jul 21, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-hosts-curriculum-summit-a-century-of-nation-building-through-education&quot;,&quot;image_path&quot;:&quot;news_images\/zBoaKip8sYtxdnjCq5vwf3bwpukhzPe00jwVqBVL.png&quot;,&quot;title&quot;:&quot;Map\u00faa University Hosts Curriculum Summit: A Century of Nation-Building through Education&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University successfully held its annual Alumni and Industry Curriculum Summit on June 20\u201321, 2025. Hosted by the Innovation and Development Office for Career Advancement and Lifelong Learning (idCALL), the two-day event gathered esteemed alumni, industry leaders, and academic experts to critically examine and redefine the educational curricula. The summit honored Map\u00faa University\u2019s 100-year legacy while charting a bold path forward for education in the Philippines.&quot;,&quot;published_at&quot;:&quot;Jul 17, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-boosts-global-standing-as-an-innovation-powerhouse-with-wuri-2025-recognition&quot;,&quot;image_path&quot;:&quot;news_images\/uGtwpV4059hgjMsY3Kb2lrv886d2dwzBtrLE2IJU.png&quot;,&quot;title&quot;:&quot;Map\u00faa University Boosts Global Standing as an Innovation Powerhouse with WURI 2025 Recognition&quot;,&quot;content_introduction&quot;:&quot;In an outstanding achievement that further amplifies its position as a global leader in innovation and impact, Map\u00faa University has secured the 313th spot in the prestigious 2025 World University Rankings for Innovation (WURI) Global Top 400 Innovative Universities. This significant recognition underscores Map\u00faa&#039;s forward-thinking approach to innovation, education, and its profound impact on the community.&quot;,&quot;published_at&quot;:&quot;Jul 15, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;rlip-2025-marks-record-breaking-year-for-student-research-and-international-collaboration-at-mapua-university&quot;,&quot;image_path&quot;:&quot;news_images\/Ju71edxA3Kokpx7iqvD3N0YcfruPrNlAhRte3AOP.jpg&quot;,&quot;title&quot;:&quot;RLIP 2025 Marks Record-Breaking Year for Student Research and International Collaboration at Map\u00faa University&quot;,&quot;content_introduction&quot;:&quot;The Research Learning &amp; Immersion Program (RLIP) 2025, an annual initiative by Map\u00faa University\u2019s Office of International Linkages, Relations, and Development Cooperation (ILRAD), ran from June 9 to 25, gathering 104 senior high school students for two weeks of research training, laboratory immersion, and international collaboration.&quot;,&quot;published_at&quot;:&quot;Jul 11, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-leads-ai-integration-in-education-through-inspire&quot;,&quot;image_path&quot;:&quot;news_images\/2mqLJocATmrfvIkf78mM4BPv4Mwl245tuA2gJwia.webp&quot;,&quot;title&quot;:&quot;Map\u00faa Leads AI Integration in Education through INSPIRE&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University is setting the standard in Philippine higher education with its pioneering initiative, INSPIRE\u2014the Innovational Network for Supporting Professional Integration of AI in Education. Spearheaded by the Center for Teaching and Learning (CTL) as part of the University\u2019s broader AI Strategy Roadmap, the INSPIRE project signals a deep institutional commitment to meaningful and ethical AI integration across disciplines.&quot;,&quot;published_at&quot;:&quot;Jul 07, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-professor-sheds-light-on-advantages-of-going-solar-power&quot;,&quot;image_path&quot;:&quot;news_images\/OVTwiJJpgFXWZiTtmLSQcwhRm3ahsPSkUVvKnr0r.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa professor sheds light on advantages of going solar power&quot;,&quot;content_introduction&quot;:&quot;With rising electricity becoming a growing concern, Filipinos are turning to renewable energy (RE) for their homes, particularly solar.\r\n\r\nWhile solar power is a very promising solution, Dr. Jaime Honra, program chair of the School of Mechanical, Manufacturing, and Energy Engineering at Map\u00faa University, emphasized that understanding the right solar power system is key to making a wise and cost-saving investment for Filipino households.&quot;,&quot;published_at&quot;:&quot;Jul 07, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;a-century-on-mapua-makes-historic-qs-world-university-rankings-debut&quot;,&quot;image_path&quot;:&quot;news_images\/WLuDBUJOtFMqwHb96zPhkLbBx1ooGyteVLcuLJwp.webp&quot;,&quot;title&quot;:&quot;A Century On, Map\u00faa Makes Historic QS World University Rankings Debut&quot;,&quot;content_introduction&quot;:&quot;In a moment that marks a new chapter in its storied legacy, Map\u00faa University has earned a coveted place in the 2026 QS World University Rankings\u2014one of the most respected and competitive global university ranking systems.&quot;,&quot;published_at&quot;:&quot;Jun 20, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;from-passion-to-profession-support-your-childs-future-through-mapuas-bs-game-development-program&quot;,&quot;image_path&quot;:&quot;news_images\/wIcnFLde1ZYpDA98vhSsRIUUpyVckdgVdhzhpmaf.webp&quot;,&quot;title&quot;:&quot;From Passion to Profession: Support Your Child&#039;s Future through Map\u00faa&#039;s BS Game Development Program&quot;,&quot;content_introduction&quot;:&quot;As kids spend hours online, engrossed in either solving quests or winning matches, it&#039;s not unusual for parents to wonder if their child&#039;s passion for gaming could lead to something greater. Can gaming be more than just a pastime but a direction? For Map\u00faa University, the country&#039;s leading engineering and technological institution, the answer is a resounding yes. Home to a distinctive BS Game Development program, the institute recognizes gaming&#039;s potential as a platform for innovation, education, and collaboration.&quot;,&quot;published_at&quot;:&quot;Jun 17, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-embracing-inclusivity-and-diversity-to-support-every-students-journey&quot;,&quot;image_path&quot;:&quot;news_images\/cqS1Z2eqL7oEBozjtkCXJ8Sj9t2FkLVSCrFSuMf8.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University: Embracing inclusivity and diversity to support every student\u2019s journey&quot;,&quot;content_introduction&quot;:&quot;In keeping with its core mission of providing accessible, high-quality education, Map\u00faa University has steadfastly championed gender inclusivity and diversity through the university-wide implementation of its Gender Equality and Diversity, Equity, and Inclusion Policies.&quot;,&quot;published_at&quot;:&quot;Jun 07, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-cardinal-tech-fest-2025-empowers-young-innovators-to-ctrlcreate&quot;,&quot;image_path&quot;:&quot;news_images\/sK4zmcEdwCIuwKIE5bcEzqH1fgGVkPDoWfhDkKSm.webp&quot;,&quot;title&quot;:&quot;Map\u00faa Cardinal Tech Fest 2025 empowers young innovators to CTRL+CREATE&quot;,&quot;content_introduction&quot;:&quot;Young tech whizzes from all over Luzon showed off their skills and creativity in engineering, technology, and gaming at the Cardinal Tech Fest 2025 held at the Map\u00faa Makati Campus last May 31.&quot;,&quot;published_at&quot;:&quot;May 31, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-launches-the-countrys-first-artificial-intelligence-engineering-undergrad-program&quot;,&quot;image_path&quot;:&quot;news_images\/g5MD7cx1hFo2Lqk0dG0SKMmJHgT3Ro2z34DbvY61.png&quot;,&quot;title&quot;:&quot;Map\u00faa launches the country&#039;s first Artificial Intelligence Engineering undergrad program&quot;,&quot;content_introduction&quot;:&quot;In keeping with its mission of building the future, Map\u00faa University has officially launched a cutting-edge Bachelor of Science in Artificial Intelligence (AI) Engineering degree this academic year, 2025-2026, the first-ever undergraduate program of its kind in the Philippines.&quot;,&quot;published_at&quot;:&quot;May 15, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;philippine-tourism-reclaims-momentum-innovative-mapua-tourism-programs-help-drive-growth&quot;,&quot;image_path&quot;:&quot;news_images\/wtOHQRHsHEhLYFuJEnLG6cybJLntVj0JoxVsaRwa.webp&quot;,&quot;title&quot;:&quot;Philippine Tourism reclaims momentum, Innovative Map\u00faa tourism programs help drive growth&quot;,&quot;content_introduction&quot;:&quot;A few years ago, the idea of travelling overseas and exploring distant places seemed an elusive dream. The pandemic didn&#039;t just slow tourism down\u2013it was brought to a standstill, grounding airlines and forcing travel bans. Despite these restrictions, the tourism and hospitality industry adapted.&quot;,&quot;published_at&quot;:&quot;Apr 22, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-cardinal-summit-leads-future-innovators-leaders-towards-academic-success&quot;,&quot;image_path&quot;:&quot;news_images\/PjoqODkzeONaA5MtQinXsL1p6bkkPHcub9CJ6NRf.webp&quot;,&quot;title&quot;:&quot;Map\u00faa Cardinal Summit leads future innovators, leaders towards academic success&quot;,&quot;content_introduction&quot;:&quot;Senior high school can be a confusing time for students since they are pressured to make several major life decisions, like choosing a future career and education, while undergoing significant personal and social changes. To help students manage the overwhelm and guide them towards academic success, Map\u00faa University hosted its annual Map\u00faa Cardinal Summit, an immersive pre-college event.&quot;,&quot;published_at&quot;:&quot;Apr 10, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;making-a-mark-how-mapuas-graduate-school-empowered-this-innovator-to-transform-industries-with-an-eco-friendly-invention&quot;,&quot;image_path&quot;:&quot;news_images\/qPy9vFRORDhqr3Z5bB3gymcBIaM3jExquEYvfiJi.webp&quot;,&quot;title&quot;:&quot;Making a Mark: How Map\u00faa\u2019s Graduate School Empowered This Innovator to Transform Industries with an Eco-Friendly Invention&quot;,&quot;content_introduction&quot;:&quot;In a world increasingly grappling with environmental challenges, one MS Materials Science and Engineering by Research student from Map\u00faa University\u2019s Graduate Studies has revolutionized how industries can commit to upholding sustainability across their operations with his groundbreaking invention, Pili Seal.&quot;,&quot;published_at&quot;:&quot;Apr 07, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-breeds-next-generation-global-climate-solutionaries&quot;,&quot;image_path&quot;:&quot;news_images\/LxjEHKhm3nsJVdD0TZykhLSjFmhxMVaD5oLQuFUC.png&quot;,&quot;title&quot;:&quot;Map\u00faa breeds next-generation global climate solutionaries&quot;,&quot;content_introduction&quot;:&quot;The global climate crisis demands science-based sustainable solutions, and Map\u00faa University is leading the charge as the first Philippine institution to offer a bachelor\u2019s program in energy engineering.&quot;,&quot;published_at&quot;:&quot;Apr 01, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-microcredential-programs-prepare-ph-workforce-for-4ir&quot;,&quot;image_path&quot;:&quot;news_images\/Qbp6HMPvitHSfzp9dVtPKQdN7LMRPTaJRwT16HGM.png&quot;,&quot;title&quot;:&quot;Map\u00faa microcredential programs prepare PH workforce for 4IR&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University has introduced microcredential programs to equip the Filipino workforce for the fourth industrial revolution (4IR). As shifting industry demands and technological innovations transform job markets, these quick, focused courses have become essential to ensure career and future readiness.&quot;,&quot;published_at&quot;:&quot;Mar 21, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;ipeople-and-coursera-expand-partnership-to-deliver-ai-powered-future-ready-education-to-45000-students&quot;,&quot;image_path&quot;:&quot;news_images\/23pbqCHR8pmNDbRfjmfx7PunemTYmMQJuADDPIel.jpg&quot;,&quot;title&quot;:&quot;iPeople and Coursera expand partnership to deliver AI-powered, future-ready education to 45,000 students&quot;,&quot;content_introduction&quot;:&quot;Students and faculty gain access to Generative AI tools, industry micro-credentials, and academic credit pathways to build globally competitive skills.&quot;,&quot;published_at&quot;:&quot;Mar 06, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;the-truth-about-cyberattacks-and-how-mapua-is-equipping-the-next-generation-of-cyber-experts&quot;,&quot;image_path&quot;:&quot;news_images\/QOMUfTRqpsNeupk1Of9XmUEnsZxf2bRUfIIQAw4i.png&quot;,&quot;title&quot;:&quot;The truth about cyberattacks and how Map\u00faa is equipping the next generation of cyber experts&quot;,&quot;content_introduction&quot;:&quot;Imagine waking up in the morning to find out that you, along with hundreds of other Filipinos, have lost your hard-earned savings overnight because of a perfectly orchestrated cyberattack on your online bank. Although the bank may be able to recover your funds, the fear, wait, and inconvenience during the investigation and processing period can be nightmarish even for those who are well-off. This scenario is just one of the many cybercrimes that could happen here in the country and overseas.&quot;,&quot;published_at&quot;:&quot;Mar 06, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;a-new-year-and-into-the-next-century-mapua-university-highlights-a-century-of-achievements-in-centennial-year-celebrations&quot;,&quot;image_path&quot;:&quot;news_images\/pT9usgq917izMHMgleRnEyo4PtuwoDWpTVSeEFMW.webp&quot;,&quot;title&quot;:&quot;A New Year and Into the Next Century: Map\u00faa University highlights a century of achievements in Centennial Year celebrations&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University, the country&#039;s premier engineering and technological institution, has culminated its centennial year celebrations with academic and cultural events highlighting the institute&#039;s innumerable contributions and impact since its founding in 1925.&quot;,&quot;published_at&quot;:&quot;Jan 25, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-ranked-1-in-the-philippines-for-engineering-computer-science-and-physical-sciences-in-the-wur-by-subject-2025&quot;,&quot;image_path&quot;:&quot;news_images\/wIMxk3O7WjEF0Q4j8DBzp6cOfI99gdXLaNHrIYsb.png&quot;,&quot;title&quot;:&quot;Map\u00faa Ranked #1 in the Philippines for Engineering, Computer Science, and Physical Sciences in THE-WUR by Subject 2025&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University has once again solidified its position as the leading institution for engineering, technology, and the sciences in the Philippines. In the latest Times Higher Education (THE) World University Rankings (WUR) by Subject 2025, Map\u00faa has emerged as the #1 university in the country for Engineering, Computer Science, and Physical Sciences, surpassing institutions such as the University of the Philippines (UP), De La Salle University (DLSU), and Ateneo de Manila University (ADMU).&quot;,&quot;published_at&quot;:&quot;Jan 22, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-celebrates-centennial-with-icset-2025-a-commitment-to-people-and-planet&quot;,&quot;image_path&quot;:&quot;news_images\/7wSDx3jT8cECYmcepmpwn8mipMY2vVb1hhMa676u.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa University Celebrates Centennial with ICSET 2025: A Commitment to People and Planet&quot;,&quot;content_introduction&quot;:&quot;In its centennial year, Map\u00faa University proudly hosts the International Conference on Sustainable Environmental Technologies (ICSET) 2025 in partnership with National Chung Hsing University at the Manila Hotel from January 21-23, 2025. This prestigious event underscores Map\u00faa\u2019s enduring commitment to fostering advancements in environmental sustainability and its role as a university for people and planet.&quot;,&quot;published_at&quot;:&quot;Jan 21, 2025&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-prepares-students-for-the-future-of-industries-with-ai-integration&quot;,&quot;image_path&quot;:&quot;news_images\/WttvSH7lMP1nYtnq7zyO8EyDgyQKKUOWu9G5ZMea.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa University\u00a0prepares students for the future of industries with\u00a0AI\u00a0integration&quot;,&quot;content_introduction&quot;:&quot;The public has been divided on the usefulness and risks of artificial Intelligence technologies or\u00a0AI\u00a0ever since it broke through the market. However, while some organizations have shied away from\u00a0AI,\u00a0progressive higher education institutions like Map\u00faa University have embraced the technology, knowing that it will reshape and drive industries in the near future.&quot;,&quot;published_at&quot;:&quot;Dec 20, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-and-mapua-mcl-soar-in-global-qs-rankings&quot;,&quot;image_path&quot;:&quot;news_images\/auDps02Sg97cGFOMkokPFCCcWysNdwto6W51jnOn.png&quot;,&quot;title&quot;:&quot;Map\u00faa University and Map\u00faa MCL soar in global QS Rankings&quot;,&quot;content_introduction&quot;:&quot;Two Map\u00faa schools, Map\u00faa University and Map\u00faa Malayan Colleges Laguna (Map\u00faa MCL) continue to elevate Philippine higher education on the global stage, securing impressive rankings in the latest QS Sustainability Rankings and QS Stars ratings. The prestigious QS Stars evaluate institutions globally based on a range of criteria, including academic reputation, faculty quality, research impact, and internationalization, as well as environmental impact, social responsibility, and governance for QS Sustainability.&quot;,&quot;published_at&quot;:&quot;Dec 13, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;two-mapua-professors-included-in-the-worlds-top-2-scientists&quot;,&quot;image_path&quot;:&quot;news_images\/aubnKP15TedaIjqgd911lwPWbcSrkOujkYByf5VK.jpg&quot;,&quot;title&quot;:&quot;Two Map\u00faa Professors Included in the World&#039;s Top 2% Scientists&quot;,&quot;content_introduction&quot;:&quot;Two Map\u00faa University faculty members upheld the Map\u00faan excellence in their recognition by Stanford University and Elsevier as among the World\u2019s Top 2% Scientists for August 2024. The prestigious distinction was bestowed upon Dr. Reggie C. Pantig, a full-time probationary professor from the Department of Physics, and Dr. Ardvin Kester Ong, an associate professor from the School of Industrial Engineering and Engineering Management and program chairman of Engineering Management, for the copious and highly impactful works they have contributed to their respective fields.&quot;,&quot;published_at&quot;:&quot;Nov 18, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-opens-online-applications-for-ay-2025-2026-with-enhanced-learning-and-student-experience&quot;,&quot;image_path&quot;:&quot;news_images\/HwwUFVFfaBgu4zVr1yVY8Z6FRxdNaIupDC4Un68z.webp&quot;,&quot;title&quot;:&quot;Map\u00faa opens online applications for A.Y. 2025-2026 with enhanced learning and student experience&quot;,&quot;content_introduction&quot;:&quot;Getting a world-class education is now within reach as Map\u00faa University has officially opened its online applications for new college, senior high school, and graduate students for the academic year 2025 to 2026.&quot;,&quot;published_at&quot;:&quot;Oct 17, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-schools-achieve-milestone-as-the-first-school-system-in-the-ph-to-attain-quality-matters-certification&quot;,&quot;image_path&quot;:&quot;news_images\/Itrtx8B2EYsGINrOV0JQGstu36fuxUX8zgFQHgFO.webp&quot;,&quot;title&quot;:&quot;Map\u00faa Schools Achieve Milestone as the First School System in the PH to Attain Quality Matters Certification&quot;,&quot;content_introduction&quot;:&quot;The Map\u00faa Schools, a leading education group in the Philippines, has made history by becoming the first school system in the country to receive certification from Quality Matters (QM). QM is a prestigious global organization that recognizes outstanding online courses, ensuring they meet the highest standards of quality and innovation.&quot;,&quot;published_at&quot;:&quot;Oct 14, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-ranks-in-the-2025-world-university-rankings-for-a-third-straight-year&quot;,&quot;image_path&quot;:&quot;news_images\/EEwS0Zl3cCW8hd35mXRngPVVRP60ZlfyVk4uA1E6.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa ranks in the 2025 World University Rankings for a third straight year&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University has once again cemented its place among the world&#039;s top educational institutions, achieving a remarkable third consecutive ranking in the prestigious Times Higher Education World University Rankings for 2025.&quot;,&quot;published_at&quot;:&quot;Oct 09, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;breaking-borders-accessing-us-education-in-the-philippines&quot;,&quot;image_path&quot;:&quot;news_images\/sb4qT6UL79VzCburuLSOWWds3nhZlA0lQcacLq7Q.webp&quot;,&quot;title&quot;:&quot;Breaking Borders: Accessing US Education in the Philippines&quot;,&quot;content_introduction&quot;:&quot;The number of US schools collaborating with Filipino universities have increased in recent years. The emergence of these schools has allowed Filipinos to experience world-class education from the comfort of their home country. This development marks a significant shift in the country\u2019s educational standards, offering unprecedented opportunities for aspiring professionals to pursue top-tier degrees without the need to relocate.\r\n\r\nDiscover how you can acquire a world-class education, expand your career horizons, and gain a competitive edge, all from the comfort of the Philippines.&quot;,&quot;published_at&quot;:&quot;Sep 22, 2024&quot;,&quot;author&quot;:&quot;Map\u00faa University&quot;,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-revolutionizes-education-with-innovative-digital-tools&quot;,&quot;image_path&quot;:&quot;news_images\/IPR0A1k5kvOezIlrN4pkbd8KmaAOJ4pm3A2FdXJH.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University Revolutionizes Education with Innovative Digital Tools&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University, the country\u2019s premier engineering and technological school, has taken a significant step towards enhancing student experiences and bridging the learning gap by launching four innovative digital toolkits: Ally, EAC Visual Data, Engage, and Map\u00faaX.&quot;,&quot;published_at&quot;:&quot;Sep 02, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-ushers-in-a-new-era-of-innovation-with-thought-leadership-program&quot;,&quot;image_path&quot;:&quot;news_images\/S8J4LMxo0jywmsRmiZAsFLLMq1uecF5KA56MbuB5.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University Ushers in a New Era of Innovation with Thought Leadership Program&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University approaches its centennial under the theme \&quot;Always Building the Future,\&quot; it reaffirms its role as the nation\u2019s leading institution in engineering and technology, steadfast in its dedication to innovation and transformative education.&quot;,&quot;published_at&quot;:&quot;Aug 31, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-and-partner-schools-arrest-learning-crisis-in-ph-with-mapua-snippets-a-free-digital-education-tool-for-children&quot;,&quot;image_path&quot;:&quot;news_images\/tv2z1V2iM2TlZbgqKpXZ890L4mMfAxWIT10niqB4.webp&quot;,&quot;title&quot;:&quot;Map\u00faa and partner schools arrest learning crisis in PH with \u2018Map\u00faa Snippets,\u2019 a free digital education tool for children&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University, a renowned learning institution in the country and a recognized global leader in education, takes the lead in reversing the depressing learning poverty experienced among many Filipino children by building a free and accessible digital education tool, Map\u00faa Snippets.&quot;,&quot;published_at&quot;:&quot;Aug 30, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;school-of-health-sciences-hosts-1st-asu-scholar-to-visit-mapua&quot;,&quot;image_path&quot;:&quot;news_images\/PehLPFcdVccMgQVIEl54yuI3n0Kg37UcXrFH3v5Q.webp&quot;,&quot;title&quot;:&quot;School of Health Sciences hosts 1st ASU scholar to visit Map\u00faa&quot;,&quot;content_introduction&quot;:&quot;MANILA, August 22, 2024 \u2013 The School of Health Sciences (SoHS) served host as Map\u00faa University opened its doors to the first-ever visiting scholar from Arizona State University (ASU) since the two universities partnered in May 11, 2022 through the Cintana Educational Network. Dr. Peter Joseph Torres, Assistant Professor, of ASU\u2019s Department of English arrived in the Philippines for a series of research lecturing and networking activities with administrators, faculty members, and students of Map\u00faa SoHS from August 15 to 21.&quot;,&quot;published_at&quot;:&quot;Aug 27, 2024&quot;,&quot;author&quot;:&quot;Map\u00faa School of Health Sciences&quot;,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-empowers-filipino-stem-educators-with-free-online-cpd-event&quot;,&quot;image_path&quot;:&quot;news_images\/SGFeAbIGGVrUIblPWL5eAEy0bMjE0opLoPe3ALKh.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa University Empowers Filipino STEM Educators with Free Online CPD Event&quot;,&quot;content_introduction&quot;:&quot;Reinforcing its leadership in STEM education, Map\u00faa University (MU), along with Map\u00faa Malayan Colleges Laguna (MMCL) and Map\u00faa Malayan Colleges Mindanao (MMCM), welcomed 788 junior and senior high school STEM teachers from across the Philippines to its flagship continuing professional development event \u2013 STEM Teach Map\u00faa 2024. Held from July 6 to August 3, 2024, the event was endorsed by the Philippine Department of Education and recognized by the Professional Regulation Commission (PRC).&quot;,&quot;published_at&quot;:&quot;Aug 15, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-hosts-alumni-and-industry-curriculum-summit-2024&quot;,&quot;image_path&quot;:&quot;news_images\/46JF0ekvBtbbu3CHy6B8DUPUkRufybRFuvpBOK1Q.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University Hosts Alumni and Industry Curriculum Summit 2024&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University took a significant step towards bridging the skills gap and preparing students for the dynamic job market with its inaugural Alumni and Industry Curriculum Summit on July 13, 2024. Hosted by the Map\u00faa Institute for Lifelong Learning and Global Competencies and co-sponsored by the National Association of\u00a0Map\u00faa Alumni, Inc. (NAMA)\u00a0and Foundation of Outstanding Map\u00faans, Inc. (FOMI), the event brought together University administration, faculty, alumni, and industry experts to collaborate on developing T-shaped graduates.&quot;,&quot;published_at&quot;:&quot;Aug 13, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;cisco-philippines-and-mapua-university-unveil-first-ever-digital-classrooms-equipped-with-new-ai-led-collaboration&quot;,&quot;image_path&quot;:&quot;news_images\/CvDQ4BpQdrSste9j6brlaeWJB8Dp3GctneyOhosF.jpg&quot;,&quot;title&quot;:&quot;Cisco Philippines and Map\u00faa University Unveil First-ever Digital Classrooms Equipped with New AI-Led Collaboration&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University, one of the top engineering and technological schools in the Philippines, today unveiled how it will leverage AI-led collaboration and connectivity tools to redefine the classroom experience for students in the upcoming academic year, beginning in August 2024.&quot;,&quot;published_at&quot;:&quot;Jul 18, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;top-3-trendy-college-programs-to-pursue-at-mapua-this-2024&quot;,&quot;image_path&quot;:&quot;news_images\/wj5g5UOcV2jo9p9T7IQG6xYvEB7Kr2Kiyc452Mcm.webp&quot;,&quot;title&quot;:&quot;Top 3 trendy college programs to pursue at Map\u00faa this 2024&quot;,&quot;content_introduction&quot;:&quot;Choosing a college degree can be overwhelming for just about anybody. To help speed up your decision-making, you might want to include these trendy degree programs Map\u00faa University recommended in your shortlist. The country\u2019s premier engineering and technological school has always been a purveyor of innovative and specialized academic programs to fill the skills gap in industries and build a plethora of future-ready Filipino professionals.&quot;,&quot;published_at&quot;:&quot;Jul 08, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-expert-shares-energy-saving-tips-for-the-pocket-and-the-environment&quot;,&quot;image_path&quot;:&quot;news_images\/evavuhg5KRKA1tuSZPQEEj2fnjw7MbljvAwCWELu.webp&quot;,&quot;title&quot;:&quot;Map\u00faa expert shares energy saving tips for the pocket and the environment&quot;,&quot;content_introduction&quot;:&quot;With electricity prices rising, it\u2019s not uncommon for people to seek ways to save energy and, more importantly, money. Fortunately, as more Filipinos strive to be thriftier, their efforts positively impact energy conservation. Dean Aldrin Calderon of Map\u00faa University\u2019s BS Energy Engineering program explained how energy consciousness translates to both environmental and financial sustainability.&quot;,&quot;published_at&quot;:&quot;Jul 02, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-poised-to-drive-innovation-live-up-to-producing-game-changer-alumni-in-modern-society&quot;,&quot;image_path&quot;:&quot;news_images\/rNxTFkxarqb7QNgowopgKTYuTJWfT8kvmcx5evMx.png&quot;,&quot;title&quot;:&quot;Map\u00faa University poised to drive innovation, live up to producing \u2018game-changer\u2019 alumni in modern society&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University, a member of the Yuchengco Group of Companies (YGC), can easily rest on its laurels as a premier and world-class engineering school in the Philippines but as an institution rooted in excellence and relevance, it continues to expand its expertise and position their academic stronghold in providing a diverse array of undergraduate programs that are relevant in today\u2019s society.&quot;,&quot;published_at&quot;:&quot;Jun 28, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-schools-in-the-limelight-for-championing-global-sustainability-and-innovation&quot;,&quot;image_path&quot;:&quot;news_images\/MmXEtrCwlrfZvnSxyRBPhOrXWWcjJ3ehxk0gYgKT.webp&quot;,&quot;title&quot;:&quot;Map\u00faa schools in the limelight for championing global sustainability and innovation&quot;,&quot;content_introduction&quot;:&quot;Beyond its renowned ranking as a top global institution, Map\u00faa University, along with its esteemed subsidiaries Map\u00faa Malayan Colleges Laguna and Map\u00faa Malayan Colleges Mindanao, has long established itself as a global powerhouse fostering sustainability and innovation to build a sustainable future for the country and the world. Through its commitment to upholding this purpose, the Map\u00faa schools has earned notable recognition from the prestigious Times Higher Education (THE) Impact Rankings and World University Rankings for Innovation (WURI).&quot;,&quot;published_at&quot;:&quot;Jun 21, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;train-up-for-the-future-at-mapua-senior-high-school&quot;,&quot;image_path&quot;:&quot;news_images\/bsHLWmQpl7RpEUSwD5djH56nQEZIC4zVHvfIDBSi.webp&quot;,&quot;title&quot;:&quot;Train up for the future at Map\u00faa Senior High School&quot;,&quot;content_introduction&quot;:&quot;If world-class athletes spend years training for a shot at a professional career, shouldn&#039;t aspiring engineers, architects, nurses, CEOs, academicians, and other professionals also have a chance to prepare for their dream careers beforehand? Internationally recognized educational institutions like Map\u00faa University Senior High School (SHS) have recognized the importance of helping students build a strong foundation for their chosen future professions by offering them two high-level tracks: academic and arts and design.&quot;,&quot;published_at&quot;:&quot;Jun 06, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-paves-way-for-accessible-education-with-php-5000-cardinal-innovator-discount&quot;,&quot;image_path&quot;:&quot;news_images\/oFmYzs2Zj1ZpTEmoAnhqAmAHqUxdu3GpOB1oFWpM.webp&quot;,&quot;title&quot;:&quot;Map\u00faa paves way for accessible education with PHP 5,000 Cardinal Innovator Discount&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University broadens its commitment to making higher education more accessible through the Cardinal Innovator Discount, a one-time PHP 5,000 tuition discount open to all incoming college freshmen for the Academic Year 2024 \u2013 2025.&quot;,&quot;published_at&quot;:&quot;May 31, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-architecture-expert-shares-tips-on-how-pinoys-can-beat-the-heat-at-home&quot;,&quot;image_path&quot;:&quot;news_images\/eCmkjx6pI1PBqbJAEbOtqHPXYZ9pEFtverPKDUcf.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa Architecture expert shares tips on how Pinoys can beat the heat at home&quot;,&quot;content_introduction&quot;:&quot;Architect Perry Sanga, Program Chair of Map\u00faa&#039;s Architecture program, explained that some buildings and homes retain heat due to poor ventilation, narrow fenestration or arrangement of windows that prevent air from coming in, usage of poor construction materials that allow rather than avert heat gain, and low ceiling height. He also said that some structures are built without considering the sun&#039;s orientation, while others don&#039;t have proper building setbacks installed in the front, sides, or rear.&quot;,&quot;published_at&quot;:&quot;May 14, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapuas-first-ever-cardinal-tech-fest-a-success-participants-bag-cash-prizes&quot;,&quot;image_path&quot;:&quot;news_images\/1hZmiY1lkdGYx5BGgOz0fMFEdGNIomeeyDylfWeA.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa\u2019s first-ever Cardinal Tech Fest a success, participants bag cash prizes&quot;,&quot;content_introduction&quot;:&quot;Grade 10 and Grade 12 students from different schools in Luzon had the opportunity to show off their skills in innovation, game development, and gaming as Map\u00faa University launched its first-ever Cardinal Tech Fest at the Makati campus last April 27, 2024.&quot;,&quot;published_at&quot;:&quot;May 01, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapuas-fully-online-enrollment-now-accepting-new-students-for-ay-2024-2025&quot;,&quot;image_path&quot;:&quot;news_images\/ryd71TK4S6QHeweZxf8Jko4k5phfBNcIvfzPB2oP.webp&quot;,&quot;title&quot;:&quot;Map\u00faa&#039;s fully online enrollment now accepting new students for A.Y. 2024-2025&quot;,&quot;content_introduction&quot;:&quot;Incoming senior high school and college students can now access world-class education now that Map\u00faa University has officially opened its enrollment period for the school year 2024-2025 through a fully online enrollment system.&quot;,&quot;published_at&quot;:&quot;Apr 23, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-biological-engineering-program-fits-global-demand&quot;,&quot;image_path&quot;:&quot;news_images\/UzTpkRWtmNmA2njjqSyjNqm4tsgCSXGQM6PnjyqN.webp&quot;,&quot;title&quot;:&quot;Map\u00faa Biological Engineering Program Fits Global Demand&quot;,&quot;content_introduction&quot;:null,&quot;published_at&quot;:&quot;Apr 17, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-secures-spot-in-the-times-higher-education-world-university-rankings-2024&quot;,&quot;image_path&quot;:&quot;news_images\/O5fgIgrsV8lUiseBDqdMizUAe3X6WF765LQmVlNY.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University secures spot in the Times Higher Education World University Rankings 2024&quot;,&quot;content_introduction&quot;:&quot;Testament to its unwavering commitment to excellence in higher education, Map\u00faa University enters the prestigious Times Higher Education (THE) World University Rankings (WUR) 2024 alongside four other Philippine universities, marking a significant milestone in its journey towards global recognition.&quot;,&quot;published_at&quot;:&quot;Apr 05, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-breaks-glass-ceiling-training-women-to-dominate-engineering-tech-fields&quot;,&quot;image_path&quot;:&quot;news_images\/Kx1d7F0WwyBa1HKeKFLVMSCCwKeefImBQFVcgyAc.webp&quot;,&quot;title&quot;:&quot;Map\u00faa breaks glass ceiling: Training women to dominate engineering, tech fields&quot;,&quot;content_introduction&quot;:&quot;Step inside the walls of Map\u00faa University and you will notice the vibrance and diversity of its student body. There seems to be a better representation of all genders across all programs\u2014particularly in highly technical ones such as engineering, information technology, and architecture.&quot;,&quot;published_at&quot;:&quot;Mar 29, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;three-generations-of-excellence-how-mapua-continues-to-shape-the-lives-of-its-graduates&quot;,&quot;image_path&quot;:&quot;news_images\/gAKb79rwdrsWttbmXMeobtChryhc6Xim92AGwTWL.webp&quot;,&quot;title&quot;:&quot;Three generations of excellence: How Map\u00faa continues to shape the lives of its graduates&quot;,&quot;content_introduction&quot;:&quot;In most Filipino households, education is perceived as the most valuable inheritance passed down from one generation to the next. It serves as a great social equalizer and a beacon of opportunity especially for parents who strive to pave the path to a brighter future for their children. For the Nicolas family, bearing witness to the transformative education at Map\u00faa University, this has steered them to choose the country&#039;s leading engineering and technological school as the home of their dreams and aspirations in life.&quot;,&quot;published_at&quot;:&quot;Mar 19, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;watch-mapua-university-and-cintana-education-talks-about-the-importance-of-ai-integrated-education&quot;,&quot;image_path&quot;:&quot;news_images\/axyXgUHeOI1MKLW6LtS8VndO9F6rTpP7RqRN5Lwz.webp&quot;,&quot;title&quot;:&quot;WATCH: Map\u00faa University and Cintana Education talks about the importance of AI-integrated education&quot;,&quot;content_introduction&quot;:&quot;Dr. Bonifacio T. Doma, Jr., Map\u00faa University Executive Vice President for International Partnerships, and Dr. Rick Shangraw, Cintana Education President, talks about the importance of AI-integrated education and how Map\u00faa University&#039;s Business and Health Sciences programs will benefit from advanced, AI-enabled education, as well as the importance of its collaboration with Arizona State University through Cintana Education.&quot;,&quot;published_at&quot;:&quot;Mar 01, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;building-connections-and-bridging-fun-fitness-and-sustainability&quot;,&quot;image_path&quot;:null,&quot;title&quot;:&quot;Building Connections and Bridging Fun, Fitness, and Sustainability&quot;,&quot;content_introduction&quot;:&quot;As part of the 99th Founding Anniversary Week of Mapua University, the School of Health Sciences in the Makati Campus held a series of activities to kick off a campaign to promote sustainability and healthy lifestyles by combining social interaction with recreational activities that support physical, mental, and social well-being.&quot;,&quot;published_at&quot;:&quot;Feb 29, 2024&quot;,&quot;author&quot;:&quot;A.R. Arias, Jr., PhD, M.A. Villapol, MD, M.P. Santos, MD, MPH&quot;,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;embracing-unity-in-diversity-sohs-strategic-planning-session&quot;,&quot;image_path&quot;:null,&quot;title&quot;:&quot;Embracing unity in diversity: SoHS Strategic Planning Session&quot;,&quot;content_introduction&quot;:&quot;The Mapua School of Medicine and Health Sciences faculty convened last February 22-23, 2024 in Tagaytay City, Cavite for a workshop on strategic planning.&quot;,&quot;published_at&quot;:&quot;Feb 25, 2024&quot;,&quot;author&quot;:&quot;Marion Jyel R. Cordova, M.D.&quot;,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;embracing-unity-in-diversity-sohs-strategic-planning-session&quot;,&quot;image_path&quot;:&quot;news_images\/RLkQ4ARrXABp7xdAPIcg9iWyy46HoMvH84auEptP.png&quot;,&quot;title&quot;:&quot;Embracing unity in diversity: SoHS Strategic Planning Session&quot;,&quot;content_introduction&quot;:&quot;The Mapua School of Medicine and Health Sciences faculty convened last February 22-23, 2024 in Tagaytay City, Cavite for a workshop on strategic planning.&quot;,&quot;published_at&quot;:&quot;Feb 25, 2024&quot;,&quot;author&quot;:&quot;Marion Jyel R. Cordova, M.D.&quot;,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-leads-the-way-in-ai-integrated-education-in-the-philippines&quot;,&quot;image_path&quot;:&quot;news_images\/7k1tpztdYfQskGr4ifjuw35IfJEOanRqzdhNO21O.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University Leads the Way in AI-Integrated Education in the Philippines&quot;,&quot;content_introduction&quot;:&quot;With how rapidly Artificial Intelligence (AI) is changing how people live, work, and interact with technology, is there room for AI to positively impact the field of education? To equip students with the tools and global perspectives needed to navigate today\u2019s working world, Map\u00faa University aims to set the standard for AI-integrated education in the country.&quot;,&quot;published_at&quot;:&quot;Feb 21, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-strengthens-international-relations-joins-hktdc-2024&quot;,&quot;image_path&quot;:&quot;news_images\/6ghlyUL8Oewuy3R9U0HrCnqseoWyefCxVqALH2VF.webp&quot;,&quot;title&quot;:&quot;Map\u00faa Strengthens International Relations, Joins HKTDC 2024&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University strengthened its global presence, upholding its status as one of the top-ranked universities in the world, during its participation at the Hong Kong Trade Development Council (HKTDC) Education and Careers Expo last January 2024.&quot;,&quot;published_at&quot;:&quot;Feb 13, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-and-altair-global-academic-program-forge-innovative-partnership&quot;,&quot;image_path&quot;:&quot;news_images\/nZz1CAQRAiL90nVQCQh1TyyGzjFi6TKBlnlmQ3XM.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University and Altair Global Academic Program Forge Innovative Partnership&quot;,&quot;content_introduction&quot;:&quot;Altair (Nasdaq: ALTR), a global leader in computational science and artificial intelligence (AI), has entered a strategic collaboration with Map\u00faa University, a pillar of academic excellence in the Philippines.&quot;,&quot;published_at&quot;:&quot;Feb 06, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;social-bingo-safari-health-sciences-edition&quot;,&quot;image_path&quot;:null,&quot;title&quot;:&quot;Social Bingo Safari: Health Sciences Edition&quot;,&quot;content_introduction&quot;:&quot;As part of the 99th Founding Anniversary Week of Mapua University, the School of Health Sciences in the Makati Campus held a Social Bingo activity in the afternoon of Jan. 24, 2024.&quot;,&quot;published_at&quot;:&quot;Jan 25, 2024&quot;,&quot;author&quot;:&quot;Dr. Malaya P. Santos&quot;,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-levels-up-student-life-with-anthology-engage&quot;,&quot;image_path&quot;:&quot;news_images\/nnS8NwD2zDxKOHjeIkuzQqJYiU5azfHR1pT5vPfY.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa University Levels Up Student Life with Anthology Engage&quot;,&quot;content_introduction&quot;:&quot;Universities have been a long-standing institution in society. Over the years, education has evolved from simple unidirectional learning approaches to dynamic, interactive, and output-based curriculums. Students, with their different backgrounds, profiles, and learning preferences, also face the ever-changing demands of the real world in terms of skills and learning expertise.&quot;,&quot;published_at&quot;:&quot;Jan 24, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;roadto100-mapua-turns-99-continues-to-build-the-future-with-world-class-education&quot;,&quot;image_path&quot;:&quot;news_images\/9yCq9hcUAyk9o0nEpPMIE2Pf2CCfBIbKEY54NWEr.webp&quot;,&quot;title&quot;:&quot;#RoadTo100: Map\u00faa turns 99, continues to build the future with world-class education&quot;,&quot;content_introduction&quot;:&quot;As Map\u00faa moves toward its centennial anniversary, the university, from its students, administration, faculty, and staff, is even more determined to build new and more impactful inroads in global education within the next ten years. Dr. Dodjie S. Maestrecampo explained that as the institution remains steadfast towards academic excellence, it will strengthen technology integration, international linkages, and research collaborations using a five-pronged approach.&quot;,&quot;published_at&quot;:&quot;Jan 21, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapuans-show-off-their-data-science-skills-with-junior-data-science-challenge-2023-win&quot;,&quot;image_path&quot;:&quot;news_images\/IIUiJ1kucVIPcnUCpls2idRjZjo3b33WCAvzWle1.webp&quot;,&quot;title&quot;:&quot;Map\u00faans show off their Data Science skills with Junior Data Science Challenge 2023 win&quot;,&quot;content_introduction&quot;:&quot;A trio of Map\u00faa Data Science students were crowned champion of the Philippine Junior Data Science Challenge 2023, co-presented by the UP Data Science Society and the Bank of the Philippine Islands. Third-year Data Science students Christine Love Ladringan, Alwin Denz Santos, and Lorenzo David Divina, who comprise Team Insigion, bested\u00a0over 160 teams from various schools in the Philippines with their UNA project.&quot;,&quot;published_at&quot;:&quot;Jan 12, 2024&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;research-development-and-innovation-take-the-spotlight-at-mapua&quot;,&quot;image_path&quot;:&quot;news_images\/C7sWfkCpyo2mVOkb0coOovcq5v5fbxXuDNhnCyVa.webp&quot;,&quot;title&quot;:&quot;Research, development, and innovation take the spotlight at Map\u00faa&quot;,&quot;content_introduction&quot;:&quot;RDI (research, development, and innovation) is rightfully at the center of the Yuchengco-led Map\u00faa University\u2019s academic brilliance and efforts right now and for good reasons.&quot;,&quot;published_at&quot;:&quot;Dec 19, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapuans-celebrate-a-season-filled-with-gratitude-this-paskong-mapuan-2023&quot;,&quot;image_path&quot;:&quot;news_images\/qJsEy8DZk8fXztfoKiouHteoRPBnl51y7kcncwoJ.jpg&quot;,&quot;title&quot;:&quot;Map\u00faans celebrate a season filled with gratitude this Paskong Map\u00faan 2023&quot;,&quot;content_introduction&quot;:&quot;Map\u00faans welcome this Christmas season filled with joy and gratitude as the community commences Paskong Map\u00faan 2023 at the Intramuros campus.&quot;,&quot;published_at&quot;:&quot;Dec 08, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-discussion-prescribes-integrated-solutions-for-philippine-healthcare&quot;,&quot;image_path&quot;:&quot;news_images\/f3kKF8ZOiN3yE7Rnh9SJPHerGkmwtrLpWAVhQiIH.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University discussion prescribes integrated solutions for Philippine healthcare&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University School of Health Sciences in collaboration with Arizona State University (ASU) recently gathered healthcare professionals, policy makers, and industry experts to discuss existing challenges surrounding the local healthcare landscape. In a panel discussion entitled \u201cBridging the Healthcare Gap: Concrete Solutions to Address the Workforce Crisis\u201d, taking an integrated approach to bolstering education emerged as a vital measure to address disparities in healthcare delivery, and to raise the standard of competitiveness among Filipino healthcare professionals.&quot;,&quot;published_at&quot;:&quot;Dec 07, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;strengthening-collaboration-mapua-partners-with-national-chung-hsing-university-of-taiwan&quot;,&quot;image_path&quot;:&quot;news_images\/tndBrYj8FYm2HxiNgEcLSTiP9wH819ThEWYyayMX.webp&quot;,&quot;title&quot;:&quot;Strengthening collaboration: Map\u00faa partners with National Chung Hsing University of Taiwan&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University made a significant visit to National Chung Hsing University in Taiwan on November 13, 2023. The purpose was to solidify an agreement memorandum for the Joint Conduct of the International Conference on Sustainable Environmental Technologies in 2025. The memorandum was signed by the President of National Chung Hsing University, Professor Dr. Fuh-Jyh Jan, and the President of Map\u00faa University, Dr. Dodjie S. Maestrecampo.&quot;,&quot;published_at&quot;:&quot;Nov 22, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-receives-prestigious-recognition-from-cengage-for-digital-education-leadership&quot;,&quot;image_path&quot;:&quot;news_images\/LXVgGGhNnTAScG7DcuHUBUVXQwG934EhUxsdR6Wa.jpg&quot;,&quot;title&quot;:&quot;Map\u00faa University receives prestigious recognition from Cengage for Digital Education Leadership&quot;,&quot;content_introduction&quot;:&quot;Remaining at the forefront of digital education in the country, Map\u00faa University has received another recognition from Cengage, a United States-based education and technology company.&quot;,&quot;published_at&quot;:&quot;Nov 20, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-university-now-offers-minor-in-stem-education&quot;,&quot;image_path&quot;:&quot;news_images\/MfXlRrmdeSosoaotZftC8mvcZ7oHM07D9UJt09yF.webp&quot;,&quot;title&quot;:&quot;Map\u00faa University now offers Minor in STEM Education&quot;,&quot;content_introduction&quot;:&quot;Map\u00faans who wish to become educators can now pursue a minor in STEM education alongside their other course units. This minor is open to undergraduate students in Information Technology, Computer Science, Physics, and Chemistry.&quot;,&quot;published_at&quot;:&quot;Nov 14, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-remains-as-top-qs-asia-university-maintains-4-qs-stars-rating&quot;,&quot;image_path&quot;:&quot;news_images\/k4nRnhlCW21NC2LQHoUBUBQtr0qQH94avrnDZXSM.webp&quot;,&quot;title&quot;:&quot;Map\u00faa remains as top QS Asia university, maintains 4 QS Stars rating&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University, the Philippines\u2019 premier engineering and technological school, maintained its status as one of the region\u2019s top universities as it entered the Quacquarelli Symonds (QS) Asia University Rankings for the sixth straight year and its 4-Star overall rating in the QS Stars Rating System.&quot;,&quot;published_at&quot;:&quot;Nov 09, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;21st-century-innovators-to-watch-out-for-meet-young-mapuans-who-will-change-the-world&quot;,&quot;image_path&quot;:&quot;news_images\/GKFtSFHjI8RuGMimcCdfAL3BkZrqWUxDJfzLL8cy.webp&quot;,&quot;title&quot;:&quot;21st century innovators to watch out for: Meet young Map\u00faans who will change the world&quot;,&quot;content_introduction&quot;:&quot;The trailblazing inventions and products, such as the Pili Seal, BAKAWONE, SafeSteps, and Echo, by Map\u00faa University students, demonstrate how bold and thoughtfully designed solutions could address society\u2019s pressing challenges. Learn more about these up-and-coming 21st-century innovators and the novel solutions they developed.&quot;,&quot;published_at&quot;:&quot;Oct 31, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-opens-applications-for-academic-year-2024-2025&quot;,&quot;image_path&quot;:&quot;news_images\/AYJzRfb5ZT7q5k0qRYycoYNjoxRbrqpEDNeyQaGL.webp&quot;,&quot;title&quot;:&quot;Map\u00faa opens applications for Academic Year 2024-2025&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa University, the Philippines\u2019 premier engineering and technological school, now accepts college and senior high school applications for A.Y. 2024-2025.&quot;,&quot;published_at&quot;:&quot;Oct 09, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-among-best-universities-worldwide-for-computer-science-engineering-physical-sciences&quot;,&quot;image_path&quot;:&quot;news_images\/k1gj2HsDYXvz87fu3LhYYfhvLsDcUeVs6hwHvim2.webp&quot;,&quot;title&quot;:&quot;Map\u00faa among best universities worldwide for Computer Science, Engineering, Physical Sciences&quot;,&quot;content_introduction&quot;:&quot;Map\u00faa&#039;s focus on learning-based outcomes, research, career-relevant skills, and global preparedness has enabled its graduates to establish solid careers here and abroad. Its accomplishments have also made it one of the best universities worldwide in the previous Times Higher Education (THE) World University Rankings by Subject 2023.&quot;,&quot;published_at&quot;:&quot;Sep 28, 2023&quot;,&quot;author&quot;:null,&quot;redirect_url&quot;:null},{&quot;slug&quot;:&quot;mapua-to-the-world-reaching-new-heights-through-international-recognitions&quot;,&quot;image_path&quot;:&quot;news_images\/b4MWlDxFL8hvrg8P6R
